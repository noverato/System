<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 System</title>
<style>
    body { margin:0; background:#050b12; font-family:'Segoe UI', sans-serif; color:white; display:flex; justify-content:center; align-items:center; height:100vh; overflow: hidden; }
    .system { width:950px; height:540px; background:linear-gradient(180deg,#031a30,#000); border:3px solid #00c3ff; border-radius:20px; box-shadow:0 0 40px #00c3ff; display:grid; grid-template-columns: 1fr 1fr; }
    .char { padding:20px; border-right:2px solid #00c3ff; }
    .char-box { border:1px solid #00c3ff; border-radius:10px; padding:15px; background:rgba(0,195,255,0.1); text-align:center; height:90%; }
    .avatar { width:180px; height:180px; margin:auto; border-radius:20px; border:2px solid #00c3ff; box-shadow:0 0 20px #00c3ff; background:#000; display:flex; justify-content:center; align-items:center; overflow:hidden; }
    .avatar img { max-width:100%; max-height:100%; object-fit: contain; }
    .rank { font-size:24px; color:#00c3ff; margin-top:10px; font-weight: bold; text-shadow: 0 0 10px #00c3ff; }
    .xpbar { background:#111; border:1px solid #00c3ff; height:20px; border-radius:20px; overflow:hidden; margin-top:10px; }
    .xpfill { height:100%; background: linear-gradient(90deg, #005f7a, #00c3ff); width:0%; transition:1s; }
    .rewards { margin-top:10px; min-height:40px; display:flex; justify-content:center; gap:8px; }
    .inv { padding:20px; }
    .grid { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
    .slot { height:90px; border:1px solid #444; border-radius:10px; background:#111; display:flex; justify-content:center; align-items:center; }
    .slot img { max-width:60%; max-height:60%; filter:grayscale(100%); opacity:0.3; }
    .slot.unlocked { border-color:#00c3ff; box-shadow:0 0 10px #00c3ff; background:rgba(0,195,255,0.2); }
    .slot.unlocked img { filter:none; opacity:1; }
    .daily { margin-top:15px; border:1px solid #00c3ff; padding:10px; border-radius:10px; background: rgba(0,0,0,0.5); }
    button { background:#00c3ff; border:none; padding:8px 15px; cursor:pointer; font-weight:bold; color: #000; border-radius: 5px; }
    input { width:80%; padding:8px; margin-top:5px; background: #111; border: 1px solid #00c3ff; color: white; border-radius: 5px; }
</style>
</head>
<body>

<div class="system">
    <div class="char">
        <div class="char-box">
            <div style="font-size: 1.2em;">SYSTEM-JÄGER: <span id="user" style="color:#00c3ff; font-weight:bold;">Gast</span></div>
            <div class="rank" id="rank">LÄDT...</div>
            <div class="avatar" id="avatarContainer">
                <img id="avatarImage" src="img/ei.png" onerror="this.style.display='none'; document.getElementById('avatarText').style.display='block';">
                <span id="avatarText" style="display:none; font-size: 50px;">🥚</span>
            </div>
            <div style="margin-top:10px;">XP: <span id="xp">0</span> / <span id="nextxp">60</span></div>
            <div class="xpbar"><div class="xpfill" id="fill"></div></div>
            <div class="rewards" id="rewards"></div>
            <div class="daily" id="dailyBox">
                <div id="question" style="font-style: italic; color: #aaa;">Warte auf Quest...</div>
                <input id="answer" placeholder="Antwort eingeben...">
                <div style="margin-top: 10px;"><button onclick="submitAnswer()">BESTÄTIGEN</button></div>
            </div>
        </div>
    </div>

    <div class="inv">
        <h3 style="color:#00c3ff; border-bottom: 1px solid #00c3ff; padding-bottom: 5px;">INVENTAR</h3>
        <div class="grid" id="inventory"></div>
    </div>
</div>

<script>
    const stages = [
        {n:"EI", x:0, img:"img/ei.png", emo:"🥚"},
        {n:"SCHLEIM", x:60, img:"img/schleim.png", emo:"💧"},
        {n:"SKELETT", x:120, img:"img/skelett.png", emo:"💀"},
        {n:"GOBLIN", x:240, img:"img/goblin.png", emo:"👺"},
        {n:"OGER", x:480, img:"img/oger.png", emo:"👹"},
        {n:"LICH", x:960, img:"img/lich.png", emo:"🧙‍♂️"},
        {n:"HÖHERES WESEN", x:2000, img:"img/wesen.png", emo:"✨"}
    ];

    const items = [
        {n:"Schwert", x:60, img:"img/schwert.png", reward:"⚔️"},
        {n:"Kristall", x:120, img:"img/kristall.png", reward:"💎"},
        {n:"Truhe", x:240, img:"img/truhe.png", reward:"🎁"},
        {n:"Relikt", x:960, img:"img/relikt.png", reward:"🔮"},
        {n:"Krone", x:2000, img:"img/krone.png", reward:"👑"}
    ];

    const params = new URLSearchParams(location.search);
    const user = params.get("user") || "Gast";
    document.getElementById("user").innerText = user;
    const key = "spawn_" + user;
    let save = JSON.parse(localStorage.getItem(key)) || {xp:0, last:""};

    let currentCorrectAnswer = "7"; // Standard

    function updateUI() {
        let cur = stages[0];
        let next = stages[1];
        stages.forEach(s => { if(save.xp >= s.x) cur = s; });
        next = stages[stages.indexOf(cur)+1] || cur;

        document.getElementById("rank").innerText = cur.n;
        const imgTag = document.getElementById("avatarImage");
        const textTag = document.getElementById("avatarText");
        imgTag.src = cur.img;
        textTag.innerText = cur.emo;
        
        document.getElementById("xp").innerText = save.xp;
        document.getElementById("nextxp").innerText = next.x;
        
        let p = cur === next ? 100 : ((save.xp - cur.x) / (next.x - cur.x)) * 100;
        document.getElementById("fill").style.width = Math.min(100, p) + "%";

        const inv = document.getElementById("inventory");
        const rew = document.getElementById("rewards");
        inv.innerHTML = "";
        rew.innerHTML = "";

        items.forEach(it => {
            const slot = document.createElement("div");
            slot.className = "slot" + (save.xp >= it.x ? " unlocked" : "");
            slot.innerHTML = `<img src="${save.xp >= it.x ? it.img : 'img/locked.png'}" onerror="this.src='https://via.placeholder.com/50?text=?'}">`;
            inv.appendChild(slot);
            if(save.xp >= it.x) rew.innerHTML += `<span style='font-size:25px;'>${it.reward}</span>`;
        });
    }

    function submitAnswer() {
        const val = document.getElementById("answer").value.toLowerCase().trim();
        if(val == currentCorrectAnswer.toString().toLowerCase()) {
            save.xp += 10;
            save.last = new Date().toDateString();
            localStorage.setItem(key, JSON.stringify(save));
            alert("System-Upgrade erfolgreich! +10 XP");
            updateUI();
        } else {
            alert("Code inkorrekt.");
        }
    }

    // WEBSOCKET
    const ws = new WebSocket("ws://127.0.0.1:8080");
    ws.onmessage = e => {
        const data = JSON.parse(e.data);
        if(data.type === "dailyQuest") {
            document.getElementById("question").innerText = data.frage;
            currentCorrectAnswer = data.antwort;
        }
        if(data.type === "xpBoost") {
            save.xp += data.amount;
            localStorage.setItem(key, JSON.stringify(save));
            updateUI();
        }
    };

    updateUI();
</script>
</body>
</html>
