<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Isekai RPG - FINAL BOSS EDITION</title>
    <style>
        :root { 
            --fantasy-bg: rgba(40, 30, 20, 0.95); 
            --gold: #ffd700; 
            --border: 2px solid #ffd700; 
            --shadow: 0 0 15px rgba(255, 215, 0, 0.4); 
            --btn-grad: linear-gradient(135deg, #b8860b, #8b4513); 
            --admin-grad: linear-gradient(135deg, #4b0082, #800080);
            --arena-grad: linear-gradient(135deg, #800, #400);
            --pve-grad: linear-gradient(135deg, #2d5a27, #1e3a1a);
        }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; transform-origin: center center; z-index: 1; cursor: pointer; }
        #charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .creature { position: absolute; width: 80px; height: 100px; text-align: center; transform: translate(-50%, -50%); transition: left 0.6s ease-out, top 0.6s ease-out; pointer-events: auto; }
        .creature img { height: 80px; filter: drop-shadow(0 0 8px rgba(0,0,0,0.8)); }
        
        .name-tag { font-size: 14px; font-weight: bold; color: #fff; background: rgba(15, 23, 42, 0.9); padding: 2px 12px; border-radius: 8px; border: 1px solid #3b82f6; margin-top: 5px; white-space: nowrap; }
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; transform: translate(-50%, -50%); z-index: 10; }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        
        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 180px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .mmo-panel { width: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; border: 3px solid var(--gold); }
        
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; font-size: 12px; transition: 0.2s; text-transform: uppercase; }
        .btn-action:disabled { background: #444; border-color: #666; color: #888; cursor: not-allowed; opacity: 0.6; }
        .btn-action:hover:not(:disabled) { transform: scale(1.05); box-shadow: var(--shadow); }

        .recipe-grid, .mining-grid, .arena-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .player-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.3); padding: 12px; border-radius: 10px; display: flex; flex-direction: column; }
        #battleLog { height: 120px; overflow-y: auto; background: rgba(0,0,0,0.5); border: 1px solid var(--gold); margin: 10px; padding: 8px; font-size: 12px; color: #ccc; border-radius: 5px; }
        
        #adminHud { display: none; margin-top: 15px; padding-top: 10px; border-top: 2px dashed var(--gold); }
        .evo-tree-v { display: flex; flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px; width: 100%; }
        .evo-node-v { padding: 12px 20px; border: 2px solid var(--gold); border-radius: 12px; background: rgba(0,0,0,0.7); color: #fff; width: 90%; transition: 0.3s; }
        .evo-node-v.glow { box-shadow: 0 0 15px var(--gold); background: linear-gradient(to right, rgba(184, 134, 11, 0.4), rgba(0,0,0,0.7)); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div class="building" style="left:400px; top:300px; width:250px; height:250px; background-image:url('./rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Rathaus</div></div>
        <div class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png');" onclick="event.stopPropagation(); openBuilding('wald')"><div class="label">Wald-Schmiede</div></div>
        <div class="building" style="left:300px; top:700px; width:200px; height:200px; background-image:url('./arena.png');" onclick="event.stopPropagation(); openBuilding('arena')"><div class="label">Arena</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:gold; font-size: 18px; font-weight:bold;">👑 <span id="playerName">Held</span></div>
    <div id="hudClass" style="font-size:12px; color: #3b82f6; font-weight: bold; text-transform: uppercase;">Novize</div>
    <div style="font-size:11px; color:#4ade80; margin-top: 5px;">💎 LXP: <span id="lxpC">0</span> | ⭐ LVL: <span id="lvlTotal">0</span></div>
    <div id="adminHud"><button class="btn-action" style="background:var(--admin-grad);" onclick="openAdminPanel()">🛠 GÖTTER-MENÜ</button></div>
</div>

<div id="gameModal" class="modal">
    <div class="mmo-panel">
        <div style="flex:2; padding:25px; overflow-y: auto; max-height: 80vh;" id="modalLeft"></div>
        <div style="flex:1; padding:25px; background:rgba(20,15,10,0.5); display: flex; flex-direction: column;">
            <h3 style="color:gold; margin-top:0;">🎒 RUCKSACK</h3>
            <div id="miniInv" style="overflow-y: auto; flex-grow: 1; border-bottom: 1px solid var(--gold); margin-bottom: 10px;"></div>
            <button class="btn-action" onclick="toggleModal('gameModal', false)">Schließen X</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// --- FIREBASE & CONFIG ---
const firebaseConfig = {
    apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8",
    authDomain: "thenest-81de6.firebaseapp.com",
    databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com",
    projectId: "thenest-81de6",
    storageBucket: "thenest-81de6.firebasestorage.app",
    messagingSenderId: "785821659645",
    appId: "1:785821659645:web:684460a421d3c9dcaee994"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const BOSS_NAME = "Spawn2909";
const BOSS_TOKEN = "U3Bhd24yOTA5X0FkbWluX1Rva2VuXzIwMjY=";
const LOOT_POOL = { wald: ['Gras', 'Stock', 'Moos', 'Feder', 'Harz', 'Pilz', 'Kiesel'] };

const CRAFTING_RECIPES = {
    'Leinen': { tier: 1, needs: { 'Gras': 3 }, lxp: 5 },
    'Steinspitzhacke': { tier: 1, needs: { 'Kiesel': 3, 'Stock': 2 }, lxp: 10 },
    'Einfacher Dolch': { tier: 2, needs: { 'Eisenerz': 1, 'Schleifstein': 1 }, lxp: 10 },
    'Wanderstab': { tier: 2, needs: { 'Stock': 3, 'Harz': 1 }, lxp: 10 },
    'Eisenschwert': { tier: 3, needs: { 'Einfacher Dolch': 1, 'Eisenerz': 3 }, lxp: 25 },
    'Langbogen': { tier: 3, needs: { 'Stock': 5, 'Leinen': 2, 'Harz': 2 }, lxp: 25 },
    'Eisenspitzhacke': { tier: 3, needs: { 'Eisenerz': 5, 'Steinspitzhacke': 1 }, lxp: 20 },
    'Runenklinge': { tier: 5, needs: { 'Eisenschwert': 1, 'Edelstein': 5 }, lxp: 50 },
    'Götterdämmerung': { tier: 7, needs: { 'Runenklinge': 1, 'Eisenerz': 20 }, lxp: 150 }
};

let data = { 
    name: "Held", x: 960, y: 540, lxp: 0, isSub: false, inventar: {}, 
    stats: { warrior: 0, mage: 0, ranger: 0, craftsman: 0, shadow: 0, totalEvoLevel: 0, className: "Novize" }, 
    ...(JSON.parse(localStorage.getItem('nestData')) || {}) 
};
let myID = "", onlinePlayers = {}, isAdmin = false;

// --- DYNAMISCHE EVOLUTION ---
function getEvoImage(lvl) {
    if (lvl >= 6) return 'HoeheresWesen.png';
    const imgs = ['Ei.png', 'Schleim.png', 'Skelett.png', 'Goblin.png', 'Oger.png', 'Lich.png'];
    return imgs[lvl] || 'HoeheresWesen.png';
}

function save() {
    let s = data.stats;
    data.stats.totalEvoLevel = (s.warrior || 0) + (s.mage || 0) + (s.ranger || 0) + (s.craftsman || 0) + (s.shadow || 0);
    localStorage.setItem('nestData', JSON.stringify(data));
    updateUI();
    if (myID) db.ref('players/' + myID).update(data);
}

function updateUI() {
    const statusTxt = data.isSub ? "⭐ Sub" : "Follower";
    document.getElementById('playerName').innerText = `${data.name} (${statusTxt})`;
    document.getElementById('hudClass').innerText = data.stats.className;
    document.getElementById('lxpC').innerText = data.lxp;
    document.getElementById('lvlTotal').innerText = data.stats.totalEvoLevel;
    const invDiv = document.getElementById('miniInv'); invDiv.innerHTML = '';
    Object.keys(data.inventar).forEach(i => { if(data.inventar[i]>0) invDiv.innerHTML += `<div>${i} x${data.inventar[i]}</div>`; });
}

// --- GEBÄUDE & ARENA ---
function openBuilding(b) {
    toggleModal('gameModal', true);
    const left = document.getElementById('modalLeft');
    if (b === 'arena') {
        const subStatus = data.isSub ? "Sub" : "Follower";
        left.innerHTML = `<h2>Arena (Fairness: ${subStatus}-Pool)</h2>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button class="btn-action" style="background:var(--pve-grad); flex:1;" onclick="pveBattle()">🐗 Gegen Monster kämpfen (PvE)</button>
            </div>
            <div class="arena-list" id="arenaList">Lade faire Herausforderer...</div>
            <h3 style="margin-left:10px; color:gold;">⚔️ Schlachtbericht</h3>
            <div id="battleLog">Lade Historie...</div>`;
        renderArenaList();
        loadBattleLogs();
    } else if (b === 'steinbruch') {
        const hasStone = data.inventar['Steinspitzhacke'] > 0 || isAdmin;
        const hasIron = data.inventar['Eisenspitzhacke'] > 0 || isAdmin;
        left.innerHTML = `<h2>Steinbruch</h2><div class="mining-grid">
            <div class="mining-node"><strong>Kiesel</strong><button class="btn-action" onclick="mine('Kiesel')">Abbauen</button></div>
            <div class="mining-node"><strong>Eisenerz</strong><button class="btn-action" ${!hasStone?'disabled':''} onclick="mine('Eisenerz')">Abbauen</button></div>
            <div class="mining-node"><strong>Edelstein</strong><button class="btn-action" ${!hasIron?'disabled':''} onclick="mine('Edelstein')">Schürfen</button></div>
        </div>`;
    } else if (b === 'wald') {
        let h = `<h2>Wald-Schmiede</h2><div class="recipe-grid">`;
        Object.entries(CRAFTING_RECIPES).forEach(([name, r]) => {
            if (isAdmin || r.tier <= (data.stats.totalEvoLevel / 2 + 1)) 
                h += `<div class="recipe-card"><strong>${name}</strong><br><small>Tier ${r.tier} | LXP: ${r.lxp}</small><button class="btn-action" onclick="craft('${name}')">Schmieden</button></div>`;
        });
        left.innerHTML = h + `</div>`;
    } else { left.innerHTML = `<h2>Rathaus</h2><p>Verwalte deine Evolution und deinen Ruf.</p>`; }
}

function renderArenaList() {
    const list = document.getElementById('arenaList'); if(!list) return;
    list.innerHTML = "";
    Object.keys(onlinePlayers).forEach(id => {
        const p = onlinePlayers[id];
        // FAIRNESS-AUTOMATIK: Nur Sub gegen Sub / Follower gegen Follower
        if(id !== myID && p.isSub === data.isSub) {
            list.innerHTML += `<div class="player-card"><strong>${p.name}</strong><br>Stufe: ${p.stats.totalEvoLevel}<button class="btn-action" onclick="pvpBattle('${id}')">Duell</button></div>`;
        }
    });
    if(list.innerHTML === "") list.innerHTML = "<p>Aktuell keine Gegner in deiner Liga online.</p>";
}

// --- BATTLE LOGIC ---
function pveBattle() {
    const win = Math.random() > 0.4; // 60% Winrate für PvE Grinding
    if (win) {
        data.lxp += 15;
        alert("Sieg! Du hast ein Wildschwein besiegt. +15 LXP");
    } else {
        alert("Niederlage! Das Monster war zu stark.");
    }
    save();
}

function pvpBattle(id) {
    const op = onlinePlayers[id];
    let myPower = data.stats.totalEvoLevel + (data.inventar['Eisenschwert']?10:0);
    let opPower = op.stats.totalEvoLevel + (op.inventar?.Eisenschwert?10:0);
    let result = "";
    if(myPower > opPower) {
        data.lxp += 50; result = `${data.name} hat ${op.name} glorreich besiegt!`; alert("Sieg! +50 LXP");
    } else {
        data.lxp = Math.max(0, data.lxp - 25); result = `${op.name} hat ${data.name} in den Staub geschickt!`; alert("Niederlage! -25 LXP");
    }
    db.ref('battleLog').push({ text: result, time: Date.now() });
    save();
}

function loadBattleLogs() {
    const logBox = document.getElementById('battleLog');
    db.ref('battleLog').limitToLast(10).on('value', snap => {
        if(!logBox) return; logBox.innerHTML = "";
        const logs = snap.val();
        if(logs) Object.values(logs).reverse().forEach(l => { logBox.innerHTML += `<div class="log-entry">⚔️ ${l.text}</div>`; });
    });
}

// --- ADMIN / GOD MODE ---
function showEvoTree() {
    document.getElementById('modalLeft').innerHTML = `
        <h2>🌲 Evolutions-Baum (Visual Guide)</h2>
        <div class="evo-tree-v">
            <div class="evo-node-v glow">0: Ei -> 1: Schleim -> 2: Skelett</div>
            <div class="evo-node-v">3: Goblin -> 4: Oger -> 5: Lich</div>
            <div class="evo-node-v">6+: Höheres Wesen</div>
        </div>
        <button class="btn-action" onclick="openAdminPanel()">ZURÜCK</button>`;
}

function openAdminPanel() {
    toggleModal('gameModal', true);
    document.getElementById('modalLeft').innerHTML = `
        <h2>🛠 GÖTTER-MENÜ (ADMIN)</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button class="btn-action" onclick="data.lxp+=1000;save()">+1000 LXP</button>
            <button class="btn-action" onclick="data.isSub=!data.isSub;save();openAdminPanel();">Sub-Status Toggeln</button>
            <button class="btn-action" onclick="data.stats.warrior=5;data.stats.mage=5;save();">Level-Skip (Lvl 10)</button>
            <button class="btn-action" onclick="data.inventar['Steinspitzhacke']=1;data.inventar['Eisenspitzhacke']=1;save();">Tools geben</button>
            <button class="btn-action" style="background:var(--admin-grad); grid-column: span 2;" onclick="showEvoTree()">🌿 Evo-Baum anzeigen</button>
            <button class="btn-action" style="background:#444; grid-column: span 2;" onclick="localStorage.clear();location.reload();">Hard Reset</button>
        </div>
    `;
}

// --- SYSTEM ---
function handleWorldClick(e) {
    if(document.getElementById('gameModal').style.display === 'flex') return;
    const rect = document.getElementById('world').getBoundingClientRect();
    data.x = e.clientX - rect.left; data.y = e.clientY - rect.top;
    if(Math.random()<0.25) {
        const item = LOOT_POOL.wald[Math.floor(Math.random()*LOOT_POOL.wald.length)];
        data.inventar[item] = (data.inventar[item]||0)+1;
    }
    save();
}

window.onload = () => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('user')) data.name = p.get('user');
    if (p.get('bosskey') === 'showtime2026') localStorage.setItem('adminToken', BOSS_TOKEN);
    myID = data.name.replace(/\s+/g, '_');
    db.ref('players/' + myID).onDisconnect().remove();
    if (data.name === BOSS_NAME && localStorage.getItem('adminToken') === BOSS_TOKEN) {
        isAdmin = true; document.getElementById('adminHud').style.display = 'block';
    }
    save();
    db.ref('players').on('value', snap => { 
        onlinePlayers = snap.val() || {}; 
        renderPlayers(onlinePlayers);
        if(document.getElementById('arenaList')) renderArenaList();
    });
};

function renderPlayers(players) {
    const layer = document.getElementById('charLayer'); layer.innerHTML = '';
    Object.keys(players).forEach(id => {
        const p = players[id];
        const div = document.createElement('div'); div.className = 'creature';
        div.style.left = p.x + "px"; div.style.top = p.y + "px";
        const imgUrl = getEvoImage(p.stats?.totalEvoLevel || 0);
        div.innerHTML = `<img src="${imgUrl}" onerror="this.src='Ei.png'"><div class="name-tag" style="${p.isSub?'border-color:gold;':''}">${p.name}</div>`;
        layer.appendChild(div);
    });
}

function mine(item) {
    if (Math.random() < 0.3) { data.inventar[item] = (data.inventar[item] || 0) + 1; alert(item + " gefunden!"); save(); }
    else alert("Nichts gefunden.");
}

function craft(name) {
    const r = CRAFTING_RECIPES[name];
    for (let m in r.needs) if ((data.inventar[m]||0) < r.needs[m]) return alert("Material fehlt!");
    if (data.lxp < r.lxp) return alert("LXP fehlt!");
    data.lxp -= r.lxp;
    for (let m in r.needs) data.inventar[m] -= r.needs[m];
    data.inventar[name] = (data.inventar[name] || 0) + 1;
    save(); openBuilding('wald');
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
</script>
</body>
</html>
