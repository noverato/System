<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 System</title>

<style>
body{
    margin:0;
    background:#050b12;
    font-family:Segoe UI;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* FRAME */
.system{
    width:900px;
    height:500px;
    background:linear-gradient(180deg,#031a30,#000);
    border:3px solid #00c3ff;
    border-radius:20px;
    box-shadow:0 0 40px #00c3ff;
    display:grid;
    grid-template-columns: 1fr 1fr;
    overflow:hidden;
}

/* LEFT: CHARACTER */
.char{
    padding:20px;
    border-right:2px solid #00c3ff;
}
.char-box{
    border:1px solid #00c3ff;
    border-radius:10px;
    padding:15px;
    background:rgba(0,195,255,0.1);
    text-align:center;
    height:100%;
}
.char-icon{
    font-size:80px;
    margin:20px 0;
}
.glow{
    text-shadow:0 0 20px #00c3ff;
}
.rank{
    font-size:22px;
    color:#00c3ff;
}
.xpbar{
    background:#111;
    border:1px solid #00c3ff;
    height:20px;
    border-radius:20px;
    overflow:hidden;
}
.xpfill{
    height:100%;
    background:#00c3ff;
    width:0%;
    transition:1s;
}

/* RIGHT: INVENTORY */
.inv{
    padding:20px;
}
.grid{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
}
.slot{
    height:80px;
    border:1px solid #444;
    border-radius:10px;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    cursor:pointer;
    color:#777;
}
.slot.unlocked{
    border-color:#00c3ff;
    color:white;
    box-shadow:0 0 10px #00c3ff;
    background:rgba(0,195,255,0.2);
}

/* DAILY */
.daily{
    margin-top:15px;
    border:1px solid #00c3ff;
    padding:10px;
    border-radius:10px;
}
button{
    background:#00c3ff;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    font-weight:bold;
}
input{
    width:100%;
    padding:6px;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="system">

<!-- LEFT -->
<div class="char">
<div class="char-box">
<div>JÄGER: <span id="user">Gast</span></div>
<div class="rank" id="rank">EI</div>
<div class="char-icon glow" id="icon">🥚</div>

XP <span id="xp">0</span> / <span id="nextxp">60</span>
<div class="xpbar"><div class="xpfill" id="fill"></div></div>

<div class="daily" id="dailyBox">
<div id="question"></div>
<input id="answer">
<button onclick="submit()">XP holen</button>
</div>
</div>
</div>

<!-- RIGHT -->
<div class="inv">
<h3>Inventar</h3>
<div class="grid" id="inventory"></div>
</div>

</div>

<script>
// ----- CONFIG -----
const stages=[
 {n:"EI",x:0,i:"🥚"},
 {n:"SCHLEIM",x:60,i:"💧"},
 {n:"SKELETT",x:90,i:"💀"},
 {n:"GOBLIN",x:180,i:"👺"},
 {n:"OGER",x:270,i:"👹"},
 {n:"LICH",x:360,i:"🧙‍♂️"},
 {n:"WESEN",x:720,i:"✨"}
];

const items=[
 {n:"Schwert",x:60,i:"⚔️"},
 {n:"Kristall",x:90,i:"💎"},
 {n:"Truhe",x:180,i:"🎁"},
 {n:"Relikt",x:360,i:"🔮"},
 {n:"Krone",x:720,i:"👑"}
];

// ----- USER -----
const params=new URLSearchParams(location.search);
const user=params.get("user")||"Gast";
document.getElementById("user").innerText=user;

const key="spawn_"+user;
let save=JSON.parse(localStorage.getItem(key))||{xp:0,last:""};

// ----- STAGE -----
let cur=stages[0],next=stages[1];
for(let i=0;i<stages.length;i++){
 if(save.xp>=stages[i].x){
   cur=stages[i];
   next=stages[i+1]||stages[i];
 }
}
document.getElementById("rank").innerText=cur.n;
document.getElementById("icon").innerText=cur.i;
document.getElementById("xp").innerText=save.xp;
document.getElementById("nextxp").innerText=next.x;
let p=((save.xp-cur.x)/(next.x-cur.x))*100;
document.getElementById("fill").style.width=Math.min(100,p)+"%";

// ----- INVENTORY -----
const inv=document.getElementById("inventory");
items.forEach(it=>{
 const d=document.createElement("div");
 d.className="slot";
 if(save.xp>=it.x){
   d.classList.add("unlocked");
   d.innerText=it.i;
   d.onclick=()=>alert(it.n+" freigeschaltet!");
 }else{
   d.innerText="🔒";
 }
 inv.appendChild(d);
});

// ----- DAILY -----
const today=new Date().toDateString();
const q="Wie viele Eier sind im Nest?";
const correct=7; // später vom Streamer.bot

if(save.last===today){
 document.getElementById("dailyBox").innerText="Heute schon XP erhalten.";
}else{
 document.getElementById("question").innerText=q;
}

function submit(){
 const a=document.getElementById("answer").value;
 if(parseInt(a)===correct){
   save.xp++;
   save.last=today;
   localStorage.setItem(key,JSON.stringify(save));
   location.reload();
 }else{
   alert("Falsch!");
 }
}

 ----- STREAMER.BOT WEBSOCKET HOOK  -----
     
const ws=new WebSocket("ws://127.0.0.1:8080");
ws.onmessage=e=>{
  const data=JSON.parse(e.data);
  if(data.type==="eggs"){
     correct=data.value;
  }
};
</script>

</body>
</html>
