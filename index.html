<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Overlord Edition 2026 - Reparierter Build</title>
    <style>
        :root { 
            --fantasy-bg: rgba(25, 15, 10, 0.98); 
            --gold: #ffd700; --border: 2px solid #ffd700; 
            --shadow: 0 0 25px rgba(255, 215, 0, 0.6); 
            --btn-grad: linear-gradient(135deg, #b8860b, #8b4513); 
            --hp-color: #ff4444; --mp-color: #3b82f6;
            --warrior: #ef4444; --mage: #3b82f6; --ranger: #22c55e; --craft: #eab308; --shadow-path: #a855f7;
            --ff-blue: rgba(0, 0, 150, 0.9);
        }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; cursor: crosshair; }
        #charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .creature { position: absolute; width: 80px; height: 100px; text-align: center; transform: translate(-50%, -50%); transition: left 0.8s ease-out, top 0.8s ease-out; pointer-events: auto; }
        .creature img { height: 80px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
        .name-tag { font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 12px; border-radius: 6px; border: 1px solid var(--gold); margin-top: 5px; white-space: nowrap; }
        .boss-aura { border: 2px solid #ff0000 !important; color: #ff0000 !important; box-shadow: 0 0 20px #ff0000; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 200px; box-shadow: var(--shadow); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .mmo-panel { width: 1250px; height: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; box-shadow: var(--shadow); }
        .panel-main { flex: 3; padding: 20px; overflow-y: auto; position: relative; }
        .panel-side { flex: 0.8; padding: 25px; background: rgba(20, 15, 10, 0.85); border-left: 2px solid var(--gold); display: flex; flex-direction: column; }
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-action:hover:not(:disabled) { filter: brightness(1.2); transform: scale(1.05); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress-container { width: 100%; height: 20px; background: #222; border: 1px solid var(--gold); border-radius: 10px; margin-top: 15px; display: none; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--gold); transition: width 3s linear; }
        #arenaStage { width: 100%; height: 100%; background: url('./arena_innen.png') no-repeat center; background-size: cover; position: relative; display: flex; align-items: center; justify-content: space-around; overflow: hidden; }
        .combatant-wrap { display: flex; flex-direction: column; align-items: center; width: 300px; z-index: 5; }
        .combatant-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 15px rgba(0,0,0,0.5)); }
        #ffMenu { position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; background: var(--ff-blue); border-top: 4px solid #fff; display: flex; box-sizing: border-box; }
        .ff-buttons { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
        .ff-status { flex: 1; padding: 20px; border-left: 2px solid #fff; display: flex; flex-direction: column; justify-content: center; }
        .bar-wrap { height: 16px; background: #000; border: 2px solid #fff; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        .evo-container { display: flex; flex-direction: column; gap: 30px; align-items: center; padding: 20px; }
        .sub-ray-wrap { width: 100%; background: linear-gradient(90deg, transparent, var(--gold), transparent); padding: 10px; border-radius: 10px; text-align: center; box-shadow: 0 0 15px var(--gold); }
        .evo-tree-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 100%; margin-top: 20px; }
        .path-column { display: flex; flex-direction: column-reverse; gap: 10px; align-items: center; }
        .node { width: 50px; height: 50px; border: 2px solid #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.3s; background: #111; position: relative; }
        .node.active { border-width: 3px; box-shadow: 0 0 15px currentColor; border-color: currentColor; color: #fff; }
        .node-label { position: absolute; right: -40px; font-size: 10px; color: #aaa; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png');" onclick="event.stopPropagation(); openBuilding('wald')"><div class="label">Wald-Schmiede</div></div>
        <div class="building" style="left:300px; top:700px; width:200px; height:200px; background-image:url('./arena.png');" onclick="event.stopPropagation(); openBuilding('arena')"><div class="label">PvP Arena</div></div>
        <div class="building" style="left:1000px; top:600px; width:250px; height:250px; background-image:url('./rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Halle der Evolution</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:gold; font-size: 20px; font-weight:bold;"><span id="playerName">Spawn2909</span></div>
    <div id="hudClass" style="font-size:13px; color: #3b82f6; font-weight: bold;">OVERLORD</div>
    <div style="font-size:12px; color:#4ade80; margin-top: 5px;">💎 LXP: <span id="lxpC">0</span> | ⭐ LVL: <span id="lvlTotal">0</span></div>
    <div style="font-size:10px; color: #aaa;">⏳ Follow: <span id="followDaysDisplay">0</span> Tage</div>
    <div id="adminHud" style="display:none; margin-top:10px;"><button class="btn-action" style="background:var(--admin-grad); width:100%;" onclick="openAdminPanel()">🛠 GÖTTER-MENÜ</button></div>
</div>

<div id="gameModal" class="modal">
    <div class="mmo-panel">
        <div class="panel-main" id="modalLeft"></div>
        <div class="panel-side">
            <h3 style="color:gold; margin-top:0;">🎒 RUCKSACK</h3>
            <div id="miniInv" style="flex-grow: 1; overflow-y: auto;"></div>
            <button class="btn-action" style="width:100%; margin-top:20px;" onclick="toggleModal('gameModal', false)">X SCHLIESSEN</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// --- CONFIG & CONSTANTS ---
const firebaseConfig = { apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8", authDomain: "thenest-81de6.firebaseapp.com", databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com", projectId: "thenest-81de6" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const BOSS_NAME = "Spawn2909";
const EVO_IMGS = ['Ei.png', 'Schleim.png', 'Skelett.png', 'Goblin.png', 'Oger.png', 'Lich.png', 'HoeheresWesen.png'];
const MONSTERS = [
    { name: "Waldschleim", hp: 40, maxHp: 40, lxp: 15, img: 'Monster1.png' },
    { name: "Frost-Wolf", hp: 80, maxHp: 80, lxp: 35, img: 'Monster2.png' },
    { name: "Finster-Goblin", hp: 120, maxHp: 120, lxp: 60, img: 'Monster3.png' }
];
const CRAFTING_DATA = [
    { name: "Spitzhacke", needs: { "Eisenerz": 3 }, minLvl: 0, desc: "Baut Erze ab." },
    { name: "Schwert", needs: { "Eisenerz": 5, "Kupfererz": 2 }, minLvl: 2, desc: "+10 DMG." },
    { name: "Rüstung", needs: { "Eisenerz": 8, "Kupfererz": 5 }, minLvl: 3, desc: "-5 DMG erhalten." },
    { name: "Magierstab", needs: { "Golderz": 3 }, minLvl: 5, subOnly: true, desc: "Sub-Exklusiv." }
];

let data = { 
    name: "Held", x: 960, y: 540, lxp: 0, hp: 100, maxHp: 100, mp: 50, maxMp: 50, 
    followDays: 0, subMonths: 0, isSub: false, inventar: {}, 
    stats: { warrior: 0, mage: 0, ranger: 0, craftsman: 0, shadow: 0, totalEvoLevel: 0, className: "Novize" },
    ...(JSON.parse(localStorage.getItem('nestData')) || {}) 
};
let myID = "", onlinePlayers = {}, isAdmin = false, currentEnemy = null, isActionLocked = false, isMining = false;

// --- ROUTER FIX ---
function openBuilding(b) {
    toggleModal('gameModal', true);
    if (b === 'steinbruch') renderMiningMenu();
    else if (b === 'wald') renderSmithy();
    else if (b === 'arena') renderArenaMatchmaking();
    else if (b === 'rathaus') renderEvoMenu();
}

// --- ARENA MODULE ---
function renderArenaMatchmaking() {
    const left = document.getElementById('modalLeft');
    let html = `<div style="padding:20px;"><h2>🛡️ Arena-Matchmaking</h2>
        <button class="btn-action" style="width:100%;" onclick="startCombat(null, true)">🐗 Monster-Training</button>
        <div id="pvpList" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">`;
    let found = false;
    Object.keys(onlinePlayers).forEach(id => {
        const p = onlinePlayers[id];
        if (id !== myID && p.isSub === data.isSub) {
            html += `<div style="padding:10px; border:1px solid gold; border-radius:5px;">
                <strong>${p.name}</strong><br><button class="btn-action" onclick="startCombat(onlinePlayers['${id}'], false)">Duell</button>
            </div>`;
            found = true;
        }
    });
    if(!found) html += `<p>Warte auf würdige Gegner...</p>`;
    left.innerHTML = html + `</div></div>`;
}

function startCombat(enemy, isMonster) {
    if (isMonster) {
        currentEnemy = { ...MONSTERS[Math.floor(Math.random() * MONSTERS.length)], isMonster: true };
    } else {
        currentEnemy = { ...enemy, isMonster: false, img: EVO_IMGS[enemy.stats.totalEvoLevel] || 'Ei.png' };
    }
    isActionLocked = false;
    renderCombatStage();
}

function renderCombatStage() {
    const left = document.getElementById('modalLeft');
    const isEgg = data.stats.totalEvoLevel === 0;
    left.innerHTML = `
        <div id="arenaStage">
            <div class="combatant-wrap"><img src="${EVO_IMGS[data.stats.totalEvoLevel] || 'Ei.png'}" class="combatant-img"><br><strong>${data.name}</strong></div>
            <div class="combatant-wrap"><img src="${currentEnemy.img || 'Monster1.png'}" class="combatant-img"><br><strong>${currentEnemy.name}</strong></div>
            <div id="ffMenu">
                <div class="ff-buttons">
                    <button class="btn-action" onclick="executeCombatAction('attack')" ${isActionLocked?'disabled':''}>ATTACKE</button>
                    <button class="btn-action" onclick="openBuilding('arena')">FLUCHT</button>
                </div>
                <div class="ff-status" style="visibility: ${isEgg ? 'hidden' : 'visible'};">
                    <span>HP: ${data.hp}/${data.maxHp}</span>
                    <div class="bar-wrap"><div class="hp-bar-fill" style="width:${(data.hp/data.maxHp)*100}%; background:var(--hp-color);"></div></div>
                </div>
            </div>
            <div id="battleLog" style="position:absolute; top:10px; left:10px; color:white;">Kampf beginnt...</div>
        </div>`;
}

function executeCombatAction(type) {
    if(isActionLocked) return;
    isActionLocked = true;
    renderCombatStage();
    const log = document.getElementById('battleLog');
    let dmg = 15 + (data.inventar['Schwert'] ? 10 : 0);
    log.innerHTML = `<div>> ${data.name} trifft für ${dmg} DMG!</div>`;
    setTimeout(() => {
        currentEnemy.hp -= dmg;
        if (currentEnemy.hp <= 0) {
            let lxpGain = currentEnemy.isMonster ? currentEnemy.lxp : 50;
            alert(`Sieg! +${lxpGain} LXP`); data.lxp += lxpGain; save(); return openBuilding('arena');
        }
        setTimeout(() => {
            let eDmg = 12 - (data.inventar['Rüstung'] ? 5 : 0);
            data.hp -= eDmg;
            log.innerHTML += `<div style="color:red;">> ${currentEnemy.name} kontert für ${eDmg}!</div>`;
            if (data.hp <= 0) { data.hp = data.maxHp; alert("Niederlage..."); save(); return openBuilding('arena'); }
            isActionLocked = false; renderCombatStage(); save();
        }, 1000);
    }, 800);
}

// --- MINING MODULE ---
function renderMiningMenu() {
    document.getElementById('modalLeft').innerHTML = `<div style="padding:30px;">
        <h2>Steinbruch</h2><p>Du benötigst eine <b>Spitzhacke</b>.</p>
        <button class="btn-action" id="mineBtn" onclick="startMining()">⛏️ Abbau starten</button>
        <div class="progress-container" id="mineProgress" style="display:block;"><div class="progress-bar" id="mineBar"></div></div>
        <div id="mineLog" style="margin-top:10px;"></div></div>`;
}

function startMining() {
    if (isMining) return;
    if (!data.inventar['Spitzhacke'] && !isAdmin) return document.getElementById('mineLog').innerText = "❌ Keine Spitzhacke!";
    isMining = true; document.getElementById('mineBtn').disabled = true;
    document.getElementById('mineBar').style.width = '100%';
    setTimeout(() => {
        let roll = Math.random();
        let item = roll > 0.9 ? "Golderz" : (roll > 0.6 ? "Kupfererz" : "Eisenerz");
        data.inventar[item] = (data.inventar[item] || 0) + 1;
        data.lxp += 5; save();
        document.getElementById('mineLog').innerText = `✅ Gefunden: ${item}! (+5 LXP)`;
        document.getElementById('mineBar').style.width = '0%';
        document.getElementById('mineBtn').disabled = false; isMining = false;
    }, 3000);
}

// --- SMITHY MODULE ---
function renderSmithy() {
    let html = `<div style="padding:30px;"><h2>Wald-Schmiede</h2>`;
    CRAFTING_DATA.forEach(recipe => {
        const canSee = (data.stats.totalEvoLevel >= recipe.minLvl) && (!recipe.subOnly || data.isSub || isAdmin);
        if (canSee) {
            let canCraft = true;
            Object.entries(recipe.needs).forEach(([item, qty]) => { if((data.inventar[item]||0) < qty) canCraft = false; });
            html += `<div style="border:1px solid gold; padding:10px; margin:5px; display:flex; justify-content:space-between;">
                <div><b>${recipe.name}</b><br><small>${recipe.desc}</small></div>
                <button class="btn-action" ${!canCraft?'disabled':''} onclick="craftItem('${recipe.name}')">SCHMIEDEN</button>
            </div>`;
        }
    });
    document.getElementById('modalLeft').innerHTML = html + `</div>`;
}

function craftItem(name) {
    const r = CRAFTING_DATA.find(i => i.name === name);
    Object.entries(r.needs).forEach(([item, qty]) => data.inventar[item] -= qty);
    data.inventar[name] = (data.inventar[name] || 0) + 1;
    save(); renderSmithy();
}

// --- EVOLUTION MODULE ---
function renderEvoMenu() {
    const left = document.getElementById('modalLeft');
    let html = `<div class="evo-container"><h2>Evolution</h2><div class="evo-tree-grid">`;
    const paths = [{id:'warrior', name:'KRIEGER', color: 'var(--warrior)'}, {id:'mage', name:'MAGIER', color: 'var(--mage)'}, {id:'ranger', name:'RANGER', color: 'var(--ranger)'}, {id:'craftsman', name:'HANDWERK', color: 'var(--craft)'}, {id:'shadow', name:'SCHATTEN', color: 'var(--shadow-path)'}];
    paths.forEach(p => {
        html += `<div class="path-column">`;
        for(let i=1; i<=7; i++) {
            const unlocked = data.stats[p.id] >= i;
            html += `<div class="node" style="border-color:${unlocked?p.color:'#444'}" onclick="tryEvolve('${p.id}', ${i}, ${i*30})">T${i}</div>`;
        }
        html += `<b>${p.name}</b></div>`;
    });
    left.innerHTML = html + `</div></div>`;
}

function tryEvolve(path, tier, days) {
    if(data.followDays < days && !isAdmin) return alert(`${days} Tage benötigt!`);
    data.stats[path] = tier; data.stats.totalEvoLevel++; save(); renderEvoMenu();
}

// --- SYSTEM CORE ---
function save() {
    if (data.name === BOSS_NAME) isAdmin = true;
    localStorage.setItem('nestData', JSON.stringify(data));
    updateUI(); if (myID) db.ref('players/' + myID).update(data);
}

function updateUI() {
    const isBoss = data.name === BOSS_NAME;
    document.getElementById('playerName').innerText = isBoss ? "OVERLORD Spawn2909" : data.name;
    document.getElementById('hudClass').innerText = isBoss ? "SYSTEM-ARCHITEKT" : data.stats.className;
    document.getElementById('lxpC').innerText = data.lxp;
    document.getElementById('lvlTotal').innerText = data.stats.totalEvoLevel;
    document.getElementById('followDaysDisplay').innerText = data.followDays;
    const invDiv = document.getElementById('miniInv'); invDiv.innerHTML = '';
    Object.keys(data.inventar).forEach(i => { if(data.inventar[i]>0) invDiv.innerHTML += `<div style="padding:5px; border-bottom:1px solid #444;">${i} x${data.inventar[i]}</div>`; });
}

function renderPlayers(players) {
    const layer = document.getElementById('charLayer'); layer.innerHTML = '';
    Object.keys(players).forEach(id => {
        const p = players[id];
        const div = document.createElement('div'); div.className = 'creature';
        div.style.left = p.x + "px"; div.style.top = p.y + "px";
        const imgIdx = Math.min(p.stats.totalEvoLevel, 6);
        div.innerHTML = `<img src="${EVO_IMGS[imgIdx]}"><div class="name-tag ${p.name===BOSS_NAME?'boss-aura':''}">${p.name===BOSS_NAME?'OVERLORD':p.name}</div>`;
        layer.appendChild(div);
    });
}

function handleWorldClick(e) {
    if(document.getElementById('gameModal').style.display === 'flex') return;
    const rect = document.getElementById('world').getBoundingClientRect();
    data.x = e.clientX - rect.left; data.y = e.clientY - rect.top; save();
}

function openAdminPanel() {
    toggleModal('gameModal', true);
    document.getElementById('modalLeft').innerHTML = `<h2>🛠 GÖTTER-MENÜ</h2>
    <button class="btn-action" onclick="data.followDays+=30;save()">+30 Tage</button>
    <button class="btn-action" onclick="data.lxp+=5000;save()">+5000 LXP</button>
    <button class="btn-action" onclick="data.inventar['Spitzhacke']=1;save()">Spitzhacke geben</button>`;
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }

window.onload = () => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('user')) data.name = p.get('user');
    myID = data.name.replace(/\s+/g, '_');
    if(data.name === BOSS_NAME) document.getElementById('adminHud').style.display = 'block';
    save();
    db.ref('players').on('value', snap => { onlinePlayers = snap.val() || {}; renderPlayers(onlinePlayers); });
};
</script>
</body>
</html>
