<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isekai Village - Secure Twitch RPG</title>
<style>
/* ===== BASE STYLES ===== */
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #e0d8b0;
    background: #0a0a12;
    position: relative;
}

/* ===== WATERMARK LAYER ===== */
#watermark {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><text x="50%" y="50%" font-family="Arial" font-size="40" fill="%23ffffff" fill-opacity="0.15" text-anchor="middle" transform="rotate(-15 500 300)">Property of Spawn2909 - The Nest</text></svg>');
    background-repeat: repeat;
    background-position: center;
    z-index: 5; /* Über Hintergrund, unter UI */
    pointer-events: none;
    user-select: none;
}

/* ===== BACKGROUND SYSTEM ===== */
#gameWorld {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: url('wald.png');
    background-size: cover;
    background-position: center;
    z-index: 1;
}

/* ===== BUILDING SYSTEM ===== */
.building {
    position: absolute;
    display: none;
    z-index: 2;
    transition: opacity 0.5s;
}
#schmiede { left: 15%; top: 60%; width: 120px; height: 100px; }
#marktplatz { left: 40%; top: 55%; width: 150px; height: 120px; }
#heiligeSchmiede { left: 65%; top: 60%; width: 130px; height: 110px; }
#rathaus { left: 45%; top: 20%; width: 180px; height: 150px; }

/* ===== CREATURE SYSTEM ===== */
.creature {
    position: absolute;
    width: 60px;
    height: 60px;
    z-index: 10;
    transition: all 0.3s ease;
    pointer-events: none;
}
/* ... (Rest des CSS bleibt gleich) ... */
</style>
</head>
<body>
<!-- WATERMARK LAYER -->
<div id="watermark"></div>

<!-- Welt Container -->
<div id="gameWorld">
    <!-- Gebäude -->
    <img id="schmiede" class="building" src="schmiede.png" alt="Schmiede">
    <img id="marktplatz" class="building" src="marktplatz.png" alt="Marktplatz">
    <img id="heiligeSchmiede" class="building" src="heilige_schmiede.png" alt="Heilige Schmiede">
    <img id="rathaus" class="building" src="rathaus.png" alt="Rathaus">
    <div id="creaturesContainer"></div>
</div>

<!-- UI Panels (unverändert) -->
<div id="villageStats" class="ui-panel">...</div>
<div id="craftingMenu" class="ui-panel">...</div>
<div id="bossArena" class="ui-panel">...</div>
<div id="tradeMenu" class="ui-panel">...</div>

<!-- Toggle Buttons -->
<button onclick="togglePanel('craftingMenu')" style="...">⚒</button>
<button onclick="togglePanel('tradeMenu')" style="...">🏪</button>

<!-- SECURITY TOKEN (wird serverseitig generiert) -->
<input type="hidden" id="securityToken" value="">

<script>
// ===== SECURITY CONFIG =====
const SECURITY = {
    // Serverseitig generierter Schlüssel (wird von streamer.bot gesetzt)
    HMAC_SECRET: 'NestWächter2026!',

    // Whitelist für erlaubte WebSocket-Nachrichten-Typen
    ALLOWED_MESSAGE_TYPES: ['follow', 'sub', 'command', 'verify'],

    // WebSocket Origin Check
    WS_ORIGIN: 'ws://127.0.0.1:8080'
};

// ===== OBFUSCATED GAME STATE =====
const _0x3d4b = ['creatures', 'resources', 'village', 'inventory', 'getItem', 'setItem', 'log'];
const gameState = {
    [_0x3d4b[0]]: JSON.parse(localStorage[_0x3d4b[4]](_0x3d4b[0])) || {},
    [_0x3d4b[1]]: JSON.parse(localStorage[_0x3d4b[4]](_0x3d4b[1])) || {gras: 0, holz: 0, stein: 0, erz: 0},
    [_0x3d4b[2]]: JSON.parse(localStorage[_0x3d4b[4]](_0x3d4b[2])) || {
        progress: 0, totalLXP: 0,
        buildings: {
            schmiede: {unlocked: false, requiredLXP: 5000},
            marktplatz: {unlocked: false, requiredLXP: 10000},
            heiligeSchmiede: {unlocked: false, requiredLXP: 20000},
            rathaus: {unlocked: false, requiredLXP: 50000}
        },
        boss: null, health: 100
    },
    [_0x3d4b[3]]: JSON.parse(localStorage[_0x3d4b[4]](_0x3d4b[3])) || {}
};

// ===== SECURITY HELPERS =====
/**
 * Generiert eine HMAC-Signatur für Daten
 */
function generateSignature(data) {
    // In einer echten Implementierung würdest du hier crypto.subtle verwenden
    // Dies ist eine vereinfachte Version für Demonstrationszwecke
    const hmac = CryptoJS.HmacSHA256(JSON.stringify(data), SECURITY.HMAC_SECRET);
    return hmac.toString(CryptoJS.enc.Base64);
}

/**
 * Überprüft die Signatur von empfangenen Daten
 */
function verifySignature(data, signature) {
    const expectedSig = generateSignature(data);
    return signature === expectedSig;
}

/**
 * Verschlüsselt Spielerdaten für die Speicherung
 */
function encryptGameData(data) {
    // In einer Produktionsumgebung würdest du hier echte Verschlüsselung verwenden
    return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}

/**
 * Entschlüsselt Spielerdaten
 */
function decryptGameData(encrypted) {
    try {
        return JSON.parse(decodeURIComponent(escape(atob(encrypted))));
    } catch (e) {
        console.error("Datenmanipulation erkannt!");
        return null;
    }
}

// ===== INITIALIZATION =====
function initGame() {
    // Lade verschlüsselte Daten
    loadEncryptedGameState();
    renderCreatures();
    updateUI();
    checkVillageProgress();

    // Demo-Daten nur wenn leer
    if (Object.keys(gameState[_0x3d4b[0]]).length === 0) {
        addCreature('Streamer', 'sub', Date.now() - (86400000 * 120));
        addCreature('Moderator', 'sub', Date.now() - (86400000 * 60));
        addCreature('Follower1', 'follower', Date.now() - (86400000 * 45));
    }

    // Ressourcen-Sammeln
    setInterval(collectResources, 30000);
    // Auto-Save alle Minute
    setInterval(saveEncryptedGameState, 60000);

    // Setze Security Token (wird von streamer.bot gesetzt)
    document.getElementById('securityToken').value = generateToken();
}

// ===== SECURE DATA HANDLING =====
function saveEncryptedGameState() {
    const encrypted = encryptGameData({
        [_0x3d4b[0]]: gameState[_0x3d4b[0]],
        [_0x3d4b[1]]: gameState[_0x3d4b[1]],
        [_0x3d4b[2]]: gameState[_0x3d4b[2]],
        [_0x3d4b[3]]: gameState[_0x3d4b[3]],
        signature: generateSignature(gameState)
    });
    localStorage[_0x3d4b[5]](_0x3d4b[0], encrypted);
}

function loadEncryptedGameState() {
    const encrypted = localStorage[_0x3d4b[4]](_0x3d4b[0]);
    if (encrypted) {
        const decrypted = decryptGameData(encrypted);
        if (decrypted && verifySignature(
            {creatures: decrypted[_0x3d4b[0]], resources: decrypted[_0x3d4b[1]],
             village: decrypted[_0x3d4b[2]], inventory: decrypted[_0x3d4b[3]]},
            decrypted.signature
        )) {
            gameState[_0x3d4b[0]] = decrypted[_0x3d4b[0]];
            gameState[_0x3d4b[1]] = decrypted[_0x3d4b[1]];
            gameState[_0x3d4b[2]] = decrypted[_0x3d4b[2]];
            gameState[_0x3d4b[3]] = decrypted[_0x3d4b[3]];
        } else {
            console.error("Datenmanipulation erkannt! Setze Standardwerte.");
            localStorage.removeItem(_0x3d4b[0]);
        }
    }
}

// ===== SECURE WEBSOCKET =====
function setupSecureWebSocket() {
    // Überprüfe ob die WebSocket-URL erlaubt ist
    if (!window.location.hostname.includes('127.0.0.1') &&
        !window.location.hostname.includes('localhost')) {
        console.error("WebSocket-Verbindung nur von lokaler Domain erlaubt!");
        return;
    }

    const ws = new WebSocket(SECURITY.WS_ORIGIN);

    ws.onmessage = function(e) {
        try {
            const data = JSON.parse(e.data);

            // 1. Überprüfe den Nachrichtentyp
            if (!SECURITY.ALLOWED_MESSAGE_TYPES.includes(data.type)) {
                console.warn("Unerlaubter Nachrichtentyp:", data.type);
                return;
            }

            // 2. Überprüfe die Signatur (wird von streamer.bot hinzugefügt)
            if (!data.signature || !verifySignature(data.payload, data.signature)) {
                console.warn("Ungültige Signatur in WebSocket-Nachricht!");
                return;
            }

            // 3. Verarbeite die Daten
            const payload = data.payload;

            if (payload.type === 'follow' || payload.type === 'sub') {
                const userType = payload.type === 'sub' ? 'sub' : 'follower';
                if (payload.username && payload.timestamp) {
                    addCreature(payload.username, userType, payload.timestamp);
                }
            }
            else if (payload.type === 'command') {
                handleSecureCommand(payload.username, payload.command, payload.args);
            }

        } catch (error) {
            console.error("Fehler bei WebSocket-Nachricht:", error);
        }
    };

    // Authentifizierung mit Token
    ws.onopen = function() {
        ws.send(JSON.stringify({
            type: 'auth',
            token: document.getElementById('securityToken').value
        }));
    };
}

// ===== SECURE COMMAND HANDLING =====
function handleSecureCommand(username, command, args) {
    // 1. Überprüfe ob der User existiert
    if (!gameState[_0x3d4b[0]][username]) {
        console.warn("Ungültiger Benutzer:", username);
        return;
    }

    // 2. Führe den Befehl sicher aus
    switch (command) {
        case 'path':
            if (calculateEP(gameState[_0x3d4b[0]][username].joinDate) >= 30 &&
                !gameState[_0x3d4b[0]][username].path) {
                gameState[_0x3d4b[0]][username].path = args[0];
                addLog(`🔄 ${username} hat den Pfad ${args[0]} gewählt!`);
                saveEncryptedGameState();
                renderCreatures();
            }
            break;
        // ... (weitere Befehle ähnlich absichern)
    }
}

// ===== OBFUSCATED CORE FUNCTIONS =====
function _0x4f3a(_0x5a2b, _0x1c4d) {
    gameState[_0x3d4b[0]][_0x5a2b] = {
        name: _0x5a2b, type: _0x1c4d,
        joinDate: Date.now(), ep: 0,
        lxp: _0x1c4d === 'sub' ? 100 : 50,
        path: null, equipment: {head: null, hand: null, body: null},
        resources: {gras: 0, holz: 0, stein: 0, erz: 0},
        inventory: {}, battleRole: null, lastAction: Date.now()
    };
    saveEncryptedGameState();
    renderCreatures();
    updateUI();
}

function _0x1a2b() {
    const _0x3c4d = {};
    Object.values(gameState[_0x3d4b[0]]).forEach(_0x5e6f => {
        const _0x1b2c = calculateEP(_0x5e6f.joinDate);
        _0x5e6f.ep = _0x1b2c;
        _0x5e6f.lxp += 1/1440;
        _0x3c4d.gras = (_0x3c4d.gras || 0) + Math.floor(Math.random()*2);
        _0x3c4d.holz = (_0x3c4d.holz || 0) + Math.floor(Math.random());
    });
    gameState[_0x3d4b[1]].gras += _0x3c4d.gras || 0;
    gameState[_0x3d4b[1]].holz += _0x3c4d.holz || 0;
    updateUI();
    saveEncryptedGameState();
}

// ===== START THE GAME =====
window.onload = function() {
    // Lade CryptoJS für HMAC (in Produktion von CDN oder lokal)
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js';
    script.onload = function() {
        initGame();
        setupSecureWebSocket();
        document.getElementById('attackButton').addEventListener('click', () => attackBoss('attack'));
        document.getElementById('healButton').addEventListener('click', () => attackBoss('heal'));
    };
    document.head.appendChild(script);
};
</script>
</body>
