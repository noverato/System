<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Nest: Solo Leveling RPG Master</title>
<style>
    /* ... (Deine bestehenden Styles bleiben gleich) ... */
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: #e0d8b0; }
    #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    #world { width: 1920px; height: 1080px; background: url('wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; transform-origin: center center; }
    .creature { position: absolute; width: 80px; height: 100px; z-index: 1000; transition: left 0.8s ease-out, top 0.8s ease-out; text-align: center; transform: translate(-50%, -50%); }
    .avatar-emoji { font-size: 60px; display: block; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8)); }
    .name-tag { font-size: 14px; font-weight: bold; color: #fff; background: rgba(15, 23, 42, 0.9); padding: 2px 12px; border-radius: 8px; border: 1px solid #3b82f6; margin-top: 5px; }
    .building { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; z-index: 10; transform: translate(-50%, -50%); }
    .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: gold; padding: 2px 8px; border-radius: 5px; font-size: 12px; white-space: nowrap; border: 1px solid gold; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .menu-box { width: 650px; background: #0f172a; border: 3px solid #3b82f6; border-radius: 25px; padding: 25px; text-align: center; color: white; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
    
    /* NEU: Tab-Styles */
    .tab-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #2563eb; color: white; border-color: #60a5fa; }
    
    #hud { position: fixed; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 15px; border: 2px solid #3b82f6; z-index: 5000; }
    .btn-action { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    .inv-slot { background: #1e293b; border: 1px solid #334155; border-radius: 8px; height: 65px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .loot-grid { grid-column: 1 / span 3; display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; margin-top: 15px; }
</style>
</head>
<body>

<div id="arena_scene">
    <div id="combatant_left" style="position:absolute; left:20%; top:50%; transform:translateY(-50%);"></div>
    <div id="combatant_right" style="position:absolute; right:20%; top:50%; transform:translateY(-50%);"></div>
    <div id="battle_ui" style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:80%; height:150px; background:rgba(0,0,150,0.9); border:3px solid white; display:flex;">
        <div style="width:30%; border-right:2px solid white; display:flex; flex-direction:column; padding:10px;">
            <button class="btn-action" style="margin:2px;" onclick="battleAction('Angriff')">⚔️ Angriff</button>
            <button class="btn-action" style="margin:2px;" onclick="battleAction('Flucht')">🏃 Flucht</button>
        </div>
        <div id="arenaLog" style="padding:15px; flex-grow:1; overflow-y:auto; font-family:monospace; color:#4ade80;">Kampf beginnt...</div>
    </div>
</div>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div class="building" style="left:1200px; top:750px; width:220px; height:220px; background-image:url('marktplatz.png');" onclick="event.stopPropagation(); openBuilding('markt')"><div class="label">Marktplatz</div></div>
        <div class="building" style="left:400px; top:300px; width:250px; height:250px; background-image:url('rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Rathaus</div></div>
        <div class="building" style="left:900px; top:200px; width:220px; height:220px; background-image:url('heilige_schmiede.png');" onclick="event.stopPropagation(); openBuilding('h_schmiede')"><div class="label">Heilige Schmiede</div></div>
        <div class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('schmiede.png');" onclick="event.stopPropagation(); openBuilding('schmiede')"><div class="label">Schmiede</div></div>
        <div class="building" style="left:1600px; top:800px; width:280px; height:280px; background-image:url('arena.png');" onclick="event.stopPropagation(); openBuilding('arena')"><div class="label">Arena</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:#facc15; font-weight:bold;">👑 <span id="playerName">Lädt...</span></div>
    <div style="font-size:11px; margin-top:5px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
        <div>❤️ HP: <span id="hpC">100</span></div>
        <div>💎 LXP: <span id="lxpC">0</span></div>
        <div>🪨 Stein: <span id="steinC">0</span></div>
        <div>🪵 Holz: <span id="stockC">0</span></div>
        <div>🍄 Pilz: <span id="pilzC">0</span></div>
        <div>🧪 Trank: <span id="trankC">0</span></div>
    </div>
</div>

<div id="invModal" class="modal">
    <div class="menu-box">
        <h2 style="color: #facc15; margin-top:0;">INVENTAR & ALCHEMIE</h2>
        <div class="inv-container">
            <div><div class="inv-slot">🪖</div><div class="inv-slot">🧥</div><div class="inv-slot">👞</div></div>
            <div style="text-align:center;">
                <div id="invAvatar" style="font-size: 80px;">🥚</div>
                <button class="btn-action" style="font-size:10px; background:#10b981;" onclick="craftPotion()">🧪 Trank brauen</button>
                <p id="invClass" style="font-weight:bold; color:#3b82f6;">Ei</p>
            </div>
            <div><div class="inv-slot">🗡️</div><div class="inv-slot">🛡️</div><div class="inv-slot">💍</div></div>
            <div id="lootGrid" class="loot-grid"></div>
        </div>
        <button class="btn-action" style="margin-top:20px;" onclick="toggleModal('invModal', false)">Schließen</button>
    </div>
</div>

<div id="buildingModal" class="modal">
    <div class="menu-box">
        <h2 id="buildingTitle" style="color:#facc15;">Gebäude</h2>
        <div id="buildingContent"></div>
        <button class="btn-action" style="margin-top:20px; background:#475569;" onclick="toggleModal('buildingModal', false)">Verlassen</button>
    </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('nestData')) || {
    name: "Held", lxp: 0, ep: 0, gras: 0, stock: 0, stein: 0, pilz: 0, blume: 0, trank: 0,
    x: 960, y: 540, currentClass: "Ei", emoji: "🥚", loot: [], hp: 100, maxHp: 100, atk: 10, def: 5
};

let zoom = 1.0;
const world = document.getElementById('world');
let isCombat = false;

// Zoom-Fix (Zentrierung auf Ei)
window.addEventListener('wheel', (e) => {
    if(isCombat) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    zoom = Math.min(Math.max(zoom + delta, 0.52), 2.5);
    world.style.transformOrigin = `${data.x}px ${data.y}px`;
    world.style.transform = `scale(${zoom})`;
}, { passive: false });

function updateUI() {
    document.getElementById('playerName').textContent = data.name;
    document.getElementById('lxpC').textContent = data.lxp;
    document.getElementById('hpC').textContent = data.hp;
    document.getElementById('steinC').textContent = data.stein;
    document.getElementById('stockC').textContent = data.stock;
    document.getElementById('pilzC').textContent = data.pilz || 0;
    document.getElementById('trankC').textContent = data.trank || 0;
    document.getElementById('invAvatar').textContent = data.emoji;
    document.getElementById('invClass').textContent = data.currentClass;
    
    // Loot Grid
    const grid = document.getElementById('lootGrid');
    grid.innerHTML = '';
    const items = [{e:'🌿', c:data.gras}, {e:'🪵', c:data.stock}, {e:'🪨', c:data.stein}, {e:'🍄', c:data.pilz}, {e:'🧪', c:data.trank}];
    items.forEach(i => { if(i.c > 0) { let s = document.createElement('div'); s.className='inv-slot'; s.innerHTML=`${i.e}<br><small>${i.c}</small>`; grid.appendChild(s); }});
    
    renderChar();
}

// MARKTPLATZ LOGIK
function openBuilding(type) {
    if(type === 'markt') {
        showMarketUI();
    } else if(type === 'steinbruch') {
        // ... Steinbruch Modal Logik ...
    } else {
        document.getElementById('buildingTitle').textContent = type.toUpperCase();
        document.getElementById('buildingContent').innerHTML = "Hier entsteht bald das Menü.";
        toggleModal('buildingModal', true);
    }
}

function showMarketUI() {
    document.getElementById('buildingTitle').textContent = "MARKTPLATZ ⚖️";
    document.getElementById('buildingContent').innerHTML = `
        <div class="tab-bar">
            <button id="tabRes" class="tab-btn active" onclick="switchTab('res')">Ressourcenhandel</button>
            <button id="tabPlayer" class="tab-btn" onclick="switchTab('player')">Spielermarkt</button>
        </div>
        <div id="tabContent"></div>
    `;
    switchTab('res');
    toggleModal('buildingModal', true);
}

function switchTab(tab) {
    const content = document.getElementById('tabContent');
    document.getElementById('tabRes').classList.toggle('active', tab === 'res');
    document.getElementById('tabPlayer').classList.toggle('active', tab === 'player');
    
    if(tab === 'res') {
        content.innerHTML = `
            <p>Tausche Ressourcen gegen LXP:</p>
            <div style="display:grid; gap:10px;">
                <button class="btn-action" onclick="tradeMarket('stein', 10, 5)">10x 🪨 Stein ➔ 5 LXP</button>
                <button class="btn-action" onclick="tradeMarket('pilz', 3, 10)">3x 🍄 Pilz ➔ 10 LXP</button>
            </div>
        `;
    } else {
        content.innerHTML = `
            <p>Items für Kanalpunkte (In Vorbereitung):</p>
            <div style="background:#1e293b; padding:15px; border-radius:10px; border:1px dashed #3b82f6;">
                <span style="font-size:40px;">🧪</span><br>
                <b>Heiltrank</b><br>
                <small>Preis: 500 Kanalpunkte</small><br><br>
                <button class="btn-action" style="background:gray;" disabled>Kaufen (Bald verfügbar)</button>
            </div>
        `;
    }
}

function tradeMarket(item, amount, reward) {
    if(data[item] >= amount) {
        data[item] -= amount;
        data.lxp += reward;
        save();
        alert("Erfolgreich gehandelt!");
        switchTab('res');
    } else alert("Nicht genug Material!");
}

function handleWorldClick(e) {
    if(isCombat) return;
    const rect = world.getBoundingClientRect();
    data.x = (e.clientX - rect.left) / zoom;
    data.y = (e.clientY - rect.top) / zoom;
    // Loot Wahrscheinlichkeit erhöht für Pilze (jetzt 20% Chance auf Etwas)
    let r = Math.random() * 100;
    if(r < 5) startPvP("Wildschwein 🐗");
    else if(r < 15) { data.pilz = (data.pilz || 0) + 1; }
    else if(r < 30) { data.stock++; }
    save();
}

function renderChar() { /* Wie zuvor */ const layer = document.getElementById('charLayer'); layer.innerHTML = ''; const char = document.createElement('div'); char.className = 'creature'; char.style.left = data.x + "px"; char.style.top = data.y + "px"; char.innerHTML = `<span class="avatar-emoji">${data.emoji}</span><div class="name-tag">${data.name}</div>`; layer.appendChild(char); }
function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }
function save() { localStorage.setItem('nestData', JSON.stringify(data)); updateUI(); }
function craftPotion() { if(data.gras >= 2 && (data.pilz || 0) >= 1) { data.gras -= 2; data.pilz -= 1; data.trank = (data.trank || 0) + 1; save(); alert("🧪 Trank fertig!"); } else alert("Zutaten fehlen!"); }
window.onload = function() { updateUI(); };
</script>

<button style="position:fixed; bottom:20px; right:20px; z-index:10000;" class="btn-action" onclick="toggleModal('invModal', true)">🎒 INVENTAR</button>
</body>
</html>
