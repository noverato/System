<style>
:root { 
--fantasy-bg: rgba(25, 15, 10, 0.98); 
--gold: #ffd700; --border: 2px solid #ffd700; 
--shadow: 0 0 25px rgba(255, 215, 0, 0.6); 
--btn-grad: linear-gradient(135deg, #b8860b, #8b4513); 
--hp-color: #ff4444; --mp-color: #3b82f6;
--warrior: #ef4444; --mage: #3b82f6; --ranger: #22c55e; --craft: #eab308; --shadow-path: #a855f7;
--ff-blue: rgba(0, 0, 150, 0.9);
--twitch-purple: #9146FF;
}
body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
#viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
#world { width: 1920px; height: 1080px; position: absolute; transition: transform 0.1s ease-out; cursor: crosshair; }
#charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }

.creature { position: absolute; width: 80px; height: 100px; text-align: center; transform: translate(-50%, -50%); transition: all 0.6s ease-out; pointer-events: auto; }
.creature img { height: 80px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
.name-tag { font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 12px; border-radius: 6px; border: 1px solid var(--gold); margin-top: 5px; white-space: nowrap; }
.boss-aura { border: 2px solid #ff0000 !important; color: #ff0000 !important; box-shadow: 0 0 20px #ff0000; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

.building { position: absolute; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; }
.label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }

/* --- UI COMPONENTS --- */
.inventory-container { display: flex; flex-direction: column; gap: 20px; color: #fff; }
.inv-upper { display: grid; grid-template-columns: 120px 1fr 200px; gap: 20px; min-height: 400px; }
.slot { width: 60px; height: 60px; border: 1px solid var(--gold); background: rgba(0,0,0,0.4); border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
.slot:hover { box-shadow: var(--shadow); background: rgba(255,215,0,0.1); }
.slot img { width: 45px; height: 45px; object-fit: contain; }
.avatar-preview { position: relative; border: 1px solid rgba(255,215,0,0.2); background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, rgba(0,0,0,0.5) 70%); border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#avatar-base { height: 320px; z-index: 1; }
#weapon-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.backpack-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; max-height: 250px; overflow-y: auto; padding: 10px; border-top: 2px solid var(--gold); margin-top: 10px; }

.evo-container { padding: 20px; text-align: center; }
.class-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
.class-tile { background: rgba(20, 15, 10, 0.8); border: 1px solid var(--gold); padding: 20px 10px; border-radius: 10px; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; }
.class-tile h4 { margin: 0; color: var(--gold); font-size: 18px; text-align: center; }
.class-tile.locked { filter: grayscale(0.8); opacity: 0.6; cursor: not-allowed; }

#hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 200px; box-shadow: var(--shadow); }
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
.modal.fullscreen { background: #000; backdrop-filter: none; }
.mmo-panel { width: 1250px; height: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; box-shadow: var(--shadow); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
.mmo-panel.fullscreen { width: 100vw; height: 100vh; border-radius: 0; border: none; max-width: 100vw; max-height: 100vh; }
.panel-main { flex: 3; padding: 25px; overflow-y: auto; position: relative; transition: all 0.5s ease; }
.panel-main.fullscreen { padding: 0; }
.panel-side { flex: 0.8; padding: 25px; background: rgba(20, 15, 10, 0.85); border-left: 2px solid var(--gold); display: flex; flex-direction: column; transition: all 0.5s ease; }
.panel-side.fullscreen { flex: 0.3; background: rgba(0, 0, 50, 0.85); }
.btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.ff-tooltip { position: fixed; display: none; z-index: 30000; background: var(--ff-blue); border: 2px solid #fff; border-radius: 8px; padding: 15px; min-width: 220px; pointer-events: none; color: #fff; box-shadow: 0 0 20px #000; }
</style>
</head>
<body>

<div id="viewport">
<div id="world" style="display:none">
<div id="charLayer"></div>
</div>
</div>

<div id="item-tooltip" class="ff-tooltip"></div>

<div id="hud">
<div style="color:gold; font-size: 20px; font-weight:bold;"><span id="playerName">Identifiziere...</span></div>
<div id="hudClass" style="font-size:13px; color: #3b82f6; font-weight: bold;">Klasse...</div>
<div style="font-size:12px; color:#4ade80; margin-top: 5px;">💎 LXP: <span id="lxpC">0</span> | ⭐ LVL: <span id="lvlTotal">0</span></div>
<div id="hudEnv" style="font-size:11px; color:#aaa; margin-top: 5px; border-top: 1px solid rgba(255,215,0,0.2); padding-top: 5px;">
    🕒 <span id="envTime">--:--</span> | 🌤️ <span id="envWeather">Sonnig</span>
</div>

<button id="loginBtn" class="btn-action" style="width:100%; margin-top:10px; background: var(--twitch-purple);" data-action="loginWithTwitch">🔑 TWITCH LOGIN</button>

<button id="inventoryBtn" class="btn-action" style="width:100%; margin-top:10px;" data-action="openInventory">🎒 INVENTAR</button>
<div id="adminHud" style="display:none; margin-top:10px;">
<button id="adminPanelBtn" class="btn-action" style="background:linear-gradient(135deg, #ff0000, #8b0000); width:100%;" data-action="openAdminPanel">🛠 GÖTTER-MENÜ</button>
</div>
</div>

<div id="gameModal" class="modal">
<div class="mmo-panel">
<div class="panel-main" id="modalLeft"></div>
<div class="panel-side">
<h3 style="color:gold; margin-top:0;">🎒 INFO</h3>
<div id="sideContent" style="flex-grow: 1; overflow-y: auto;"></div>
<button id="closeModalBtn" class="btn-action" style="width:100%; margin-top:20px;" data-action="closeGeneralModal">X SCHLIESSEN</button>
</div>
</div>
</div>

<div id="fpModal" class="modal">
        <div class="mmo-panel" style="width: 100vw; height: 100vh; display:flex; flex-direction: column; border: none; border-radius: 0; box-shadow: none;">
            <div id="fpCanvas" style="flex:1; background:#000"></div>
            <div style="display:flex; gap:8px; padding:10px; background: rgba(0,0,0,0.7); border-top: 1px solid rgba(255,215,0,0.3); backdrop-filter: blur(5px);">
      <button id="fpLeft" class="btn-action" style="flex:0 0 auto">←</button>
      <button id="fpForward" class="btn-action" style="flex:1">▲</button>
      <button id="fpRight" class="btn-action" style="flex:0 0 auto">→</button>
      <button id="fpBack" class="btn-action" style="flex:0 0 auto">▼</button>
      <button id="fpInv" class="btn-action" style="background: var(--btn-grad);">🎒 INVENTAR</button>
      <button id="fpAdmin" class="btn-action" style="background: linear-gradient(135deg, #ff0000, #8b0000); display:none;">🛠 GÖTTER</button>
      <button id="fpExit" class="btn-action" style="margin-left:auto">Zurück</button>
    </div>
    <div id="fpInventoryOverlay" style="display:none; position:absolute; inset:20px; background:rgba(0,0,0,0.85); z-index:100; border:2px solid var(--gold); border-radius:15px; padding:20px; overflow-y:auto; backdrop-filter:blur(10px);"></div>
    <div id="fpMarketOverlay" style="display:none; position:absolute; inset:20px; background:rgba(0,0,0,0.85); z-index:110; border:2px solid #4ade80; border-radius:15px; padding:20px; overflow-y:auto; backdrop-filter:blur(10px);"></div>
  </div>
</div>

<template id="inventory-template">
<div class="inventory-container">
<div style="display:flex; justify-content:space-between; align-items:center;">
  <h2 style="color:gold; margin:0;">Helden-Inventar</h2>
  <span id="inv-level-display" style="color:var(--gold); font-weight:bold; font-size:1.2em; border:1px solid var(--gold); padding:2px 10px; border-radius:5px;">Level 1</span>
</div>
<div class="inv-upper">
<div class="equip-slots">
<div class="slot" data-label="Kopf" id="slot-head"></div>
<div class="slot" data-label="Brust" id="slot-chest"></div>
<div class="slot" data-label="Hose" id="slot-legs"></div>
<div class="slot" data-label="Füße" id="slot-feet"></div>
<div class="slot" data-label="Waffe" id="slot-weapon" style="margin-top:10px;"></div>
<div class="slot" data-label="Schild" id="slot-offhand"></div>
</div>
<div class="avatar-preview">
<img id="avatar-base" src="Ei.png">
<div id="weapon-layer"></div>
</div>
<div class="stats-display">
<h3 style="color:gold; margin:0 0 10px 0;">Attribute</h3>
<div class="stat-line"><span>HP:</span> <span id="stat-hp" style="color:var(--hp-color);">0</span></div>
<div class="stat-line"><span>ATK:</span> <span id="stat-atk" style="color:#ffcc00;">0</span></div>
<div class="stat-line"><span>DEF:</span> <span id="stat-def" style="color:#4ade80;">0</span></div>
<div class="stat-line" style="margin-top:15px; border-top:1px solid var(--gold); padding-top:10px;">
<span>Vermögen:</span> <span id="inv-lxp-display" style="color:var(--gold); font-weight:bold;">0 LXP</span>
</div>
</div>
</div>
<div class="backpack-grid" id="backpack-slots"></div>
</div>
</template>

<template id="evo-hall-template">
<div class="evo-container">
<h2 style="color:gold; font-size: 32px; text-shadow: 0 0 15px rgba(255,215,0,0.5);">Halle der Evolution</h2>
<div class="class-grid" id="evo-class-list">
<div class="class-tile locked" id="evo-class-waldlaeufer"><h4>Waldläufer</h4></div>
<div class="class-tile locked" id="evo-class-krieger"><h4>Krieger</h4></div>
<div class="class-tile locked" id="evo-class-druide"><h4>Druide</h4></div>
<div class="class-tile locked" id="evo-class-hueter"><h4>Hüter</h4></div>
<div class="class-tile locked" id="evo-class-sucher"><h4>Sucher</h4></div>
<div class="class-tile locked" id="evo-class-einsiedler"><h4>Einsiedler</h4></div>
<div class="class-tile locked" id="evo-class-waechter"><h4>Wächter</h4></div>
</div>
</div>
</template>

<script src="main_logic.js"></script>
</body>
</html>
