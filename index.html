<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 – RPG Nest</title>

<style>
body{
    margin:0;
    background:#050a05 !important;
    font-family:Verdana, sans-serif;
    overflow:hidden;
    color:white;
}

/* UI Columns */
#uiLeft, #uiRight{
    position:fixed;
    top:0;
    bottom:0;
    width:220px;
    background:#0c140c;
    padding:10px;
    z-index:200;
}
#uiLeft{ left:0; border-right:2px solid #2c3f2c; }
#uiRight{ right:0; border-left:2px solid #2c3f2c; }

/* World */
#world{
    position:absolute;
    left:220px;
    right:220px;
    top:0;
    bottom:0;
    overflow:hidden;
}
#forest{
    position:absolute;
    width:100%;
    height:100%;
    background:#0b180b;
    z-index:0;
}

/* Village */
#village{
    position:absolute;
    width:600px;
    height:600px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#3e5c2f;
    border-radius:50%;
    border:10px solid #5d4037;
    box-shadow: inset 0 0 30px #2a1b10;
    z-index:5;
}

/* Paths */
.path{
    position:absolute;
    background:#7b5a2b;
    z-index:4;
}
#pathNorth{ width:60px; height:200px; left:50%; top:-200px; transform:translateX(-50%);}
#pathSouth{ width:60px; height:200px; left:50%; bottom:-200px; transform:translateX(-50%);}
#pathWest{ height:60px; width:200px; left:-200px; top:50%; transform:translateY(-50%);}
#pathEast{ height:60px; width:200px; right:-200px; top:50%; transform:translateY(-50%);}

/* Buildings */
.building{
    position:absolute;
    width:90px;
    height:90px;
    background:#6d4c41;
    border:3px solid #2a1b10;
    border-radius:8px;
    text-align:center;
    line-height:90px;
    font-size:40px;
    z-index:10;
    cursor:pointer;
}
#forge{ left:120px; top:220px;}
#market{ right:120px; top:220px;}

/* Trees */
.tree{
    position:absolute;
    font-size:28px;
    z-index:0;
}

/* Eggs */
.egg{
    position:absolute;
    font-size:22px;
    z-index:8; /* above village */
    transition: 3s linear;
}

/* Overlay UI */
.overlay{
    position:absolute;
    width:400px;
    height:300px;
    background:#1a1f1a;
    border:3px solid gold;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:300;
    display:none;
    padding:15px;
}
.overlay button{
    position:absolute;
    top:5px;
    right:5px;
}

/* Boss */
#boss{
    position:absolute;
    font-size:100px;
    display:none;
    z-index:3;
}
</style>
</head>

<body>

<div id="uiLeft">
    <h3>🥚 Spawn2909</h3>
    Name: Spawn2909<br>
    Rang: Ei<br>
    XP: <div style="background:#333;height:10px;"><div style="background:#6f6;height:10px;width:40%;"></div></div>
    <h4>🎒 Inventar</h4>
    🗡️ 🧪 🌿
</div>

<div id="uiRight">
    <h3>📜 Dorf</h3>
    Level: 3<br>
    Bewohner: 12 Eier<br>
    Bosse besiegt: 0
</div>

<div id="world">
    <div id="forest"></div>
    <div id="boss">🐲</div>

    <div id="village">
        <div id="pathNorth" class="path"></div>
        <div id="pathSouth" class="path"></div>
        <div id="pathWest" class="path"></div>
        <div id="pathEast" class="path"></div>

        <div id="forge" class="building">⚒️</div>
        <div id="market" class="building">🏪</div>
    </div>
</div>

<!-- Overlays -->
<div id="forgeUI" class="overlay">
    <button onclick="closeUI()">X</button>
    <h3>⚒️ Schmiede</h3>
    Schwerter, Rüstung, Upgrades
</div>

<div id="marketUI" class="overlay">
    <button onclick="closeUI()">X</button>
    <h3>🏪 Marktplatz</h3>
    Tränke & Handel
</div>

<script>
const forest = document.getElementById("forest");
const village = document.getElementById("village");
const boss = document.getElementById("boss");

/* Forest */
function createForest(){
    for(let i=0;i<280;i++){
        const t=document.createElement("div");
        t.className="tree";
        t.textContent=Math.random()>0.5?"🌲":"🌳";
        t.style.left=Math.random()*window.innerWidth+"px";
        t.style.top=Math.random()*window.innerHeight+"px";
        forest.appendChild(t);
    }
}

/* Eggs */
const eggs=[];
function spawnEgg(){
    const e=document.createElement("div");
    e.className="egg";
    e.textContent="🥚";
    forest.appendChild(e);
    eggs.push(e);
    moveEgg(e);
}

function moveEgg(e){
    setInterval(()=>{
        const v=village.getBoundingClientRect();
        let x,y;
        if(Math.random()<0.7){
            x=v.left+Math.random()*v.width;
            y=v.top+Math.random()*v.height;
        }else{
            x=Math.random()*window.innerWidth;
            y=Math.random()*window.innerHeight;
        }
        e.style.left=x+"px";
        e.style.top=y+"px";
    },3000);
}

/* UI */
forge.onclick=()=>{ document.getElementById("forgeUI").style.display="block"; }
market.onclick=()=>{ document.getElementById("marketUI").style.display="block"; }
function closeUI(){
    document.querySelectorAll(".overlay").forEach(o=>o.style.display="none");
}

/* Boss Timer */
setInterval(()=>{
    boss.style.display="block";
    boss.style.left=Math.random()*window.innerWidth+"px";
    boss.style.top=Math.random()*window.innerHeight+"px";
},30000);

/* Init */
createForest();
for(let i=0;i<15;i++) spawnEgg();
</script>

</body>
</html>
