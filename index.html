<style>
:root { 
--fantasy-bg: rgba(25, 15, 10, 0.98); 
--gold: #ffd700; --border: 2px solid #ffd700; 
--shadow: 0 0 25px rgba(255, 215, 0, 0.6); 
--btn-grad: linear-gradient(135deg, #b8860b, #8b4513); 
--hp-color: #ff4444; --mp-color: #3b82f6;
--warrior: #ef4444; --mage: #3b82f6; --ranger: #22c55e; --craft: #eab308; --shadow-path: #a855f7;
--ff-blue: rgba(0, 0, 150, 0.9);
--twitch-purple: #9146FF;
}
body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
#viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
#world { width: 1920px; height: 1080px; position: absolute; transition: transform 0.1s ease-out; cursor: crosshair; }
#charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }

.creature { position: absolute; width: 80px; height: 100px; text-align: center; transform: translate(-50%, -50%); transition: all 0.6s ease-out; pointer-events: auto; }
.creature img { height: 80px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
.name-tag { font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 12px; border-radius: 6px; border: 1px solid var(--gold); margin-top: 5px; white-space: nowrap; }
.boss-aura { border: 2px solid #ff0000 !important; color: #ff0000 !important; box-shadow: 0 0 20px #ff0000; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

.building { position: absolute; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; }
.label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }

/* --- UI COMPONENTS --- */
.inventory-container { display: flex; flex-direction: column; gap: 20px; color: #fff; }
.inv-upper { display: grid; grid-template-columns: 120px 1fr 200px; gap: 20px; min-height: 400px; }
.slot { width: 60px; height: 60px; border: 1px solid var(--gold); background: rgba(0,0,0,0.4); border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
.slot:hover { box-shadow: var(--shadow); background: rgba(255,215,0,0.1); }
.slot img { width: 45px; height: 45px; object-fit: contain; }
.avatar-preview { position: relative; border: 1px solid rgba(255,215,0,0.2); background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, rgba(0,0,0,0.5) 70%); border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#avatar-base { height: 320px; z-index: 1; }
#weapon-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.backpack-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; max-height: 250px; overflow-y: auto; padding: 10px; border-top: 2px solid var(--gold); margin-top: 10px; }

.evo-container { padding: 20px; text-align: center; }
.class-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
.class-tile { background: rgba(20, 15, 10, 0.8); border: 1px solid var(--gold); padding: 20px 10px; border-radius: 10px; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; }
.class-tile h4 { margin: 0; color: var(--gold); font-size: 18px; text-align: center; }
.class-tile.locked { filter: grayscale(0.8); opacity: 0.6; cursor: not-allowed; }

#hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 200px; box-shadow: var(--shadow); }
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
.modal.fullscreen { background: #000; backdrop-filter: none; }
.mmo-panel { width: 1250px; height: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; box-shadow: var(--shadow); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
.mmo-panel.fullscreen { width: 100vw; height: 100vh; border-radius: 0; border: none; max-width: 100vw; max-height: 100vh; }
.panel-main { flex: 3; padding: 25px; overflow-y: auto; position: relative; transition: all 0.5s ease; }
.panel-main.fullscreen { padding: 0; }
.panel-side { flex: 0.8; padding: 25px; background: rgba(20, 15, 10, 0.85); border-left: 2px solid var(--gold); display: flex; flex-direction: column; transition: all 0.5s ease; }
.panel-side.fullscreen { flex: 0.3; background: rgba(0, 0, 50, 0.85); }
.btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.ff-tooltip { position: fixed; display: none; z-index: 30000; background: var(--ff-blue); border: 2px solid #fff; border-radius: 8px; padding: 15px; min-width: 220px; pointer-events: none; color: #fff; box-shadow: 0 0 20px #000; }
</style>
</head>

<script>
// --- SESSION REHYDRATION ---
const savedID = sessionStorage.getItem("verifiedID");
if (!window.isIdentified && savedID) {
window.verifiedID = savedID;
window.isIdentified = true;
window.isAdmin = sessionStorage.getItem("isAdmin") === "true";
console.log("Session rehydrated:", savedID);
}

// --- CORE CONFIG ---
const TWITCH_CLIENT_ID = "futhxsgrshkh2h6cqywavg5cous3q0";
const BROADCASTER_ID = "573773653";
const REDIRECT_URI = "https://noverato.github.io/System";

let isIdentified = window.isIdentified || false;
let twitchToken = "", verifiedID = window.verifiedID || "", onlinePlayers = {}, isAdmin = window.isAdmin || false;
let data = { name: "Held", x: 960, y: 540, lxp: 0, hp: 100, maxHp: 100, stats: { atk: 10, def: 10, currentLevel: 1, className: "Ei" }, inventar: {}, equipment: {}, lxpBuffer: 0 };

// --- RENDERING ENGINE ---
function renderPlayers(players) {
const layer = document.getElementById('charLayer');
if (!layer) return;
window._playerNodes = window._playerNodes || {};
window._playerInterp = window._playerInterp || {};
window._playerLast = window._playerLast || {};

const lp = { ...players };
if (verifiedID) {
    lp[verifiedID] = { ...(players[verifiedID] || {}), ...data, name: data.name, x: data.x, y: data.y, lastSeen: Date.now() };
}

const present = {};
Object.keys(lp).forEach(id => {
    const p = lp[id];
    if (p.hidden || (Date.now() - (p.lastSeen || 0) > 60000)) return;
    present[id] = true;

    let node = window._playerNodes[id];
    const imgSrc = (typeof getCreatureSprite === 'function') ? getCreatureSprite(p, id === BROADCASTER_ID) : 'Ei.png';

    if (!node) {
        const div = document.createElement('div');
        div.className = 'creature';
        div.style.left = p.x + "px";
        div.style.top = p.y + "px";
        div.innerHTML = `<img src="${imgSrc}"><div class="name-tag ${id === BROADCASTER_ID ? 'boss-aura' : ''}">${p.name}</div>`;
        layer.appendChild(div);
        window._playerNodes[id] = div;
        window._playerInterp[id] = { x: p.x, y: p.y, tx: p.x, ty: p.y };
        window._playerLast[id] = p.lastSeen || window._playerLast[id] || 0;
    } else {
        const currentImg = node.querySelector('img');
        const nameTag = node.querySelector('.name-tag');
        if (currentImg && currentImg.getAttribute('src') !== imgSrc) currentImg.setAttribute('src', imgSrc);
        if (nameTag && nameTag.textContent !== p.name) nameTag.textContent = p.name;
        const st = window._playerInterp[id] || { x: p.x, y: p.y, tx: p.x, ty: p.y };
        const incoming = p.lastSeen || 0;
        const known = window._playerLast[id] || 0;
        if (incoming >= known) {
            st.tx = p.x; st.ty = p.y; window._playerLast[id] = incoming;
        }
        window._playerInterp[id] = st;
    }
});

Object.keys(window._playerNodes).forEach(id => {
    if (!present[id]) {
        const el = window._playerNodes[id];
        if (el && el.parentNode === layer) layer.removeChild(el);
        delete window._playerNodes[id];
        delete window._playerInterp[id];
    }
});
}

function updateUI() {
const nameEl = document.getElementById('playerName');
if (nameEl) nameEl.innerText = isAdmin ? "OVERLORD " + data.name : data.name;
const classEl = document.getElementById('hudClass');
if (classEl) classEl.innerText = data.stats.className;
const lxpEl = document.getElementById('lxpC');
if (lxpEl) lxpEl.innerText = data.lxp;
const lvlEl = document.getElementById('lvlTotal');
if (lvlEl) lvlEl.innerText = data.stats.currentLevel;

const loginBtn = document.getElementById('loginBtn');
if (loginBtn) {
    if (isIdentified) {
        loginBtn.style.display = 'none';
        // Automatisch den Wald starten, wenn eingeloggt
        if (typeof startForestIfReady === 'function') startForestIfReady();
    } else {
        loginBtn.style.display = 'block';
    }
}

const adminPanel = document.getElementById('adminHud');
if (adminPanel) adminPanel.style.display = isAdmin ? 'block' : 'none';
}

function clearPanels() {
document.getElementById('modalLeft').innerHTML = '';
document.getElementById('sideContent').innerHTML = '';
}

// --- LOGIC ---
function cleanURL() { if (window.location.hash) window.history.replaceState({}, document.title, window.location.pathname); }

let forestStarted = false;
function startForestIfReady() {
    if (forestStarted) return;
    if (window.isIdentified && window.FPWald) {
        console.log("🌲 Automatischer Start im 3D-Wald...");
        FPWald.open();
        forestStarted = true;
    }
}

function loginWithTwitch() {
window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=user:read:email`;
}

window.onload = async () => {
if (typeof MARKT_WAREN === 'undefined') window.MARKT_WAREN = {};
const params = new URLSearchParams(window.location.hash.substring(1));

if (params.has("access_token")) {
twitchToken = params.get("access_token");
cleanURL();
try {
const resp = await fetch(`https://api.twitch.tv/helix/users`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${twitchToken}` } });
const result = await resp.json();
if (result.data && result.data.length > 0) {
            verifiedID = result.data[0].id;
            data.name = result.data[0].display_name;
            isIdentified = true;
            isAdmin = (verifiedID === BROADCASTER_ID);
            window.verifiedID = verifiedID;
            window.isIdentified = true;
            window.isAdmin = isAdmin;

// PERSIST SESSION
sessionStorage.setItem("verifiedID", verifiedID);
sessionStorage.setItem("isIdentified", "true");
sessionStorage.setItem("isAdmin", isAdmin ? "true" : "false");

        if (typeof window.loadUserData === 'function') {
            await window.loadUserData();
        }
        startForestIfReady();
db.ref('players').on('value', snap => {
window.onlinePlayers = snap.val() || {};
renderPlayers(window.onlinePlayers);
});
db.ref('players').on('child_added', snap => {
const id = snap.key;
const p = snap.val() || {};
window.onlinePlayers = window.onlinePlayers || {};
window.onlinePlayers[id] = p;
window._playerLast = window._playerLast || {}; 
if (p && typeof p.lastSeen === 'number') window._playerLast[id] = Math.max(p.lastSeen, window._playerLast[id] || 0);
renderPlayers(window.onlinePlayers);
});
db.ref('players').on('child_changed', snap => {
const id = snap.key;
const p = snap.val() || {};
window.onlinePlayers = window.onlinePlayers || {};
window.onlinePlayers[id] = { ...window.onlinePlayers[id], ...p };
window._playerLast = window._playerLast || {}; 
const incoming = p.lastSeen || 0;
const known = window._playerLast[id] || 0;
if (incoming >= known && window._playerInterp && window._playerInterp[id]) {
    window._playerInterp[id].tx = p.x;
    window._playerInterp[id].ty = p.y;
    window._playerLast[id] = incoming;
} else {
    renderPlayers(window.onlinePlayers);
}
});
db.ref('players').on('child_removed', snap => {
const id = snap.key;
if (window.onlinePlayers) delete window.onlinePlayers[id];
if (window._playerLast && window._playerLast[id] != null) delete window._playerLast[id];
renderPlayers(window.onlinePlayers);
});

// --- ENVIRONMENT HUD ---
if (window.EventHub) {
    EventHub.on('env:time:update', (payload) => {
        const timeEl = document.getElementById('envTime');
        if (timeEl) {
            // Konvertiere 0..1 in HH:MM (60 min Zyklus)
            const totalSeconds = Math.floor(payload.time * 3600);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            timeEl.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
    });

    EventHub.on('env:weather:update', (payload) => {
        const weatherEl = document.getElementById('envWeather');
        if (weatherEl) {
            const names = {
                'sunny': 'Sonnig',
                'cloudy': 'Bewölkt',
                'rainy': 'Regen',
                'stormy': 'Sturm'
            };
            weatherEl.innerText = names[payload.type] || payload.type;
        }
    });
}
}
} catch (e) { console.error("Twitch Login Error:", e); }
} else {
// Handle rehydrated session
if (isIdentified) {
        if (typeof window.loadUserData === 'function') {
            await window.loadUserData();
        }
db.ref('players').on('value', snap => {
window.onlinePlayers = snap.val() || {};
renderPlayers(window.onlinePlayers);
});
db.ref('players').on('child_added', snap => {
const id = snap.key;
const p = snap.val() || {};
window.onlinePlayers = window.onlinePlayers || {};
window.onlinePlayers[id] = p;
window._playerLast = window._playerLast || {}; 
if (p && typeof p.lastSeen === 'number') window._playerLast[id] = Math.max(p.lastSeen, window._playerLast[id] || 0);
renderPlayers(window.onlinePlayers);
});
db.ref('players').on('child_changed', snap => {
const id = snap.key;
const p = snap.val() || {};
window.onlinePlayers = window.onlinePlayers || {};
window.onlinePlayers[id] = { ...window.onlinePlayers[id], ...p };
window._playerLast = window._playerLast || {}; 
const incoming = p.lastSeen || 0;
const known = window._playerLast[id] || 0;
if (incoming >= known && window._playerInterp && window._playerInterp[id]) {
    window._playerInterp[id].tx = p.x;
    window._playerInterp[id].ty = p.y;
    window._playerLast[id] = incoming;
} else {
    renderPlayers(window.onlinePlayers);
}
});
db.ref('players').on('child_removed', snap => {
const id = snap.key;
if (window.onlinePlayers) delete window.onlinePlayers[id];
if (window._playerLast && window._playerLast[id] != null) delete window._playerLast[id];
renderPlayers(window.onlinePlayers);
});
}
console.log("System bereit.");
updateUI();
}
};

window.addEventListener('beforeunload', () => {
    try {
        if (window.db && window.verifiedID) {
            window.db.ref('players/' + window.verifiedID).update({ hidden: true, lastSeen: Date.now() });
        }
    } catch {}
});

// Wenn wir nicht auf ein Gebäude klicken, öffnen wir den 3D-Wald
        // Dies ersetzt die 2D-Bewegung durch die 3D-Wald-Navigation
        function handleWorldClick(e) {
            if (!isIdentified) return;
            if (window.FPWald) { 
                toggleModal('fpModal', true); 
                FPWald.open(); 
                FPWald.bindUI(); 
            }
        }

let _moveAnim = null;
let _lastSync = 0;
let _renderAnim = null;
function _tickPlayers() {
    const layer = document.getElementById('charLayer');
    if (!layer) { _renderAnim = requestAnimationFrame(_tickPlayers); return; }
    const interp = window._playerInterp || {};
    const nodes = window._playerNodes || {};

    Object.keys(nodes).forEach(id => {
        const st = interp[id];
        if (!st) return;
        const targetX = (id === String(verifiedID)) ? (data.x || st.tx) : st.tx;
        const targetY = (id === String(verifiedID)) ? (data.y || st.ty) : st.ty;
        st.x += (targetX - st.x) * 0.2;
        st.y += (targetY - st.y) * 0.2;
        const el = nodes[id];
        el.style.left = st.x + 'px';
        el.style.top = st.y + 'px';
    });

    _renderAnim = requestAnimationFrame(_tickPlayers);
}
_renderAnim = requestAnimationFrame(_tickPlayers);
function movePlayerTo(tx, ty) {
    if (_moveAnim) cancelAnimationFrame(_moveAnim);
    const sx = data.x || 0;
    const sy = data.y || 0;
    const dx = tx - sx;
    const dy = ty - sy;
    const dist = Math.hypot(dx, dy);
    if (dist < 1) {
        data.x = tx; data.y = ty;
        if (verifiedID) { onlinePlayers[verifiedID] = { ...data, lastSeen: Date.now() }; renderPlayers(onlinePlayers); }
        if (typeof window.save === 'function') window.save();
        return;
    }
    const speed = 600;
    const duration = Math.max(300, Math.floor((dist / speed) * 1000));
    const start = performance.now();
    let traveled = 0;
    const stepSize = 40;
    function step(t) {
        const k = Math.min(1, (t - start) / duration);
        const nx = sx + dx * k;
        const ny = sy + dy * k;
        const inc = Math.hypot(nx - (data.x || 0), ny - (data.y || 0));
        traveled += inc;
        data.x = nx; data.y = ny;
        if (verifiedID) { onlinePlayers[verifiedID] = { ...data, lastSeen: Date.now() }; renderPlayers(onlinePlayers); }
        if (typeof window.save === 'function') {
            const now = t;
            if (now - _lastSync > 250) { window.save(); _lastSync = now; }
        }
        if (window.db && window.verifiedID) {
            const nowMs = Date.now();
            try { window.db.ref('players/' + window.verifiedID).update({ x: data.x, y: data.y, lastSeen: nowMs }); } catch {}
        }
        if (traveled >= stepSize) {
            traveled = 0;
            if (window.EventHub && EventHub.EVENTS && EventHub.EVENTS.ENCOUNTER_STEP) {
                EventHub.emit(EventHub.EVENTS.ENCOUNTER_STEP);
            }
        }
        if (k < 1) { _moveAnim = requestAnimationFrame(step); }
        else { if (typeof window.save === 'function') window.save(); }
    }
    _moveAnim = requestAnimationFrame(step);
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
function closeGeneralModal() { toggleModal('gameModal', false); }

function openBuilding(b) {
toggleModal('gameModal', true);
clearPanels(); 
const left = document.getElementById('modalLeft');
const world = document.getElementById('world');
const targetEl = document.getElementById('b-' + b);
if (world && targetEl) {
    const wr = world.getBoundingClientRect();
    const tr = targetEl.getBoundingClientRect();
    data.x = (tr.left - wr.left) + tr.width / 2;
    data.y = (tr.top - wr.top) + tr.height / 2;
    if (verifiedID) {
        onlinePlayers[verifiedID] = { ...data, lastSeen: Date.now() };
        renderPlayers(onlinePlayers);
    }
    if (typeof window.save === 'function') window.save();
}
if (b === 'steinbruch' && typeof renderMiningMenu === 'function') renderMiningMenu();
else if (b === 'rathaus') {
left.appendChild(document.getElementById('evo-hall-template').content.cloneNode(true));
if (typeof initEvoHallDisplay === 'function') initEvoHallDisplay();
}
else if (b === 'markt' && typeof renderMarketplace === 'function') renderMarketplace();
else if (b === 'arena' && window.PvPEvents) {
PvPEvents.openMenu();
} // Schließt das 'else if' der Arena
} // Schließt die gesamte Funktion 'openBuilding'
