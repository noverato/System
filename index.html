<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 – RPG Nest</title>
<style>
body{
    margin:0;
    background:#050a05 !important;
    font-family:Verdana, sans-serif;
    overflow:hidden;
    color:white;
}

#uiLeft, #uiRight{
    position:fixed;
    top:0;
    bottom:0;
    width:220px;
    background:#0c140c;
    padding:10px;
    z-index:200;
}
#uiLeft{ left:0; border-right:2px solid #2c3f2c; }
#uiRight{ right:0; border-left:2px solid #2c3f2c; }

#world{
    position:absolute;
    left:220px;
    right:220px;
    top:0;
    bottom:0;
    overflow:hidden;
}

/* ===== Forest background ===== */
#forest{
    position:absolute;
    width:100%;
    height:100%;
    background:#0b180b;
    z-index:0;
}

/* ===== Village ===== */
#village{
    position:absolute;
    width:600px;
    height:600px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#3e5c2f;
    border-radius:50%;
    border:10px solid #5d4037;
    box-shadow: inset 0 0 30px #2a1b10;
    z-index:5;
}

/* Paths */
.path{
    position:absolute;
    background:#7b5a2b;
    z-index:4;
}
#pathNorth{ width:60px; height:200px; left:50%; top:-200px; transform:translateX(-50%);}
#pathSouth{ width:60px; height:200px; left:50%; bottom:-200px; transform:translateX(-50%);}
#pathWest{ height:60px; width:200px; left:-200px; top:50%; transform:translateY(-50%);}
#pathEast{ height:60px; width:200px; right:-200px; top:50%; transform:translateY(-50%);}

/* Buildings */
.building{
    position:absolute;
    width:90px;
    height:90px;
    background:#6d4c41;
    border:3px solid #2a1b10;
    border-radius:8px;
    text-align:center;
    line-height:90px;
    font-size:40px;
    z-index:10;
}
#forge{ left:120px; top:220px;}
#market{ right:120px; top:220px;}

/* Trees */
.tree{
    position:absolute;
    font-size:28px;
    z-index:0;
}

/* Eggs */
.egg{
    position:absolute;
    font-size:20px;
    z-index:6;
    transition: 1s linear;
}
</style>
</head>

<body>

<div id="uiLeft">
    <h3>🥚 Status</h3>
    Rang: Ei<br>
    XP: <div style="background:#333;height:10px;"><div style="background:#6f6;height:10px;width:40%;"></div></div>
</div>

<div id="uiRight">
    <h3>📜 Dorf</h3>
    Schmiede bereit<br>
    Markt geöffnet
</div>

<div id="world">
    <div id="forest"></div>

    <div id="village">
        <div id="pathNorth" class="path"></div>
        <div id="pathSouth" class="path"></div>
        <div id="pathWest" class="path"></div>
        <div id="pathEast" class="path"></div>

        <div id="forge" class="building">⚒️</div>
        <div id="market" class="building">🏪</div>
    </div>
</div>

<script>
const world = document.getElementById("forest");
const village = document.getElementById("village");

/* Create forest */
function createForest(){
    for(let i=0;i<180;i++){
        const t = document.createElement("div");
        t.className="tree";
        t.textContent = Math.random()>0.5 ? "🌲":"🌳";
        t.style.left = Math.random()*window.innerWidth + "px";
        t.style.top = Math.random()*window.innerHeight + "px";
        world.appendChild(t);
    }
}

/* Create eggs */
const eggs=[];
function spawnEgg(){
    const e=document.createElement("div");
    e.className="egg";
    e.textContent="🥚";
    world.appendChild(e);
    eggs.push(e);
    moveEgg(e);
}

/* Move eggs between forest & village */
function moveEgg(e){
    setInterval(()=>{
        const vRect = village.getBoundingClientRect();
        let targetX, targetY;

        if(Math.random()<0.6){
            // go inside village
            targetX = vRect.left + Math.random()*vRect.width;
            targetY = vRect.top + Math.random()*vRect.height;
        }else{
            // forest
            targetX = Math.random()*window.innerWidth;
            targetY = Math.random()*window.innerHeight;
        }

        e.style.left = targetX + "px";
        e.style.top = targetY + "px";
    },2000);
}

createForest();
for(let i=0;i<12;i++) spawnEgg();
</script>

</body>
</html>
