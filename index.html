<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 System</title>

<style>
body{
    margin:0;
    background:#050b12;
    font-family:Segoe UI;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.system{
    width:950px;
    height:540px;
    background:linear-gradient(180deg,#031a30,#000);
    border:3px solid #00c3ff;
    border-radius:20px;
    box-shadow:0 0 40px #00c3ff;
    display:grid;
    grid-template-columns: 1fr 1fr;
    overflow:hidden;
}

/* LEFT */
.char{
    padding:20px;
    border-right:2px solid #00c3ff;
}
.char-box{
    border:1px solid #00c3ff;
    border-radius:10px;
    padding:15px;
    background:rgba(0,195,255,0.1);
    text-align:center;
    height:100%;
}

.avatar{
    width:160px;
    height:160px;
    margin:auto;
    border-radius:20px;
    border:2px solid #00c3ff;
    box-shadow:0 0 20px #00c3ff;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}
.avatar img{
    max-width:100%;
    max-height:100%;
}

.rank{
    font-size:22px;
    color:#00c3ff;
    margin-top:10px;
}

.xpbar{
    background:#111;
    border:1px solid #00c3ff;
    height:20px;
    border-radius:20px;
    overflow:hidden;
    margin-top:6px;
}
.xpfill{
    height:100%;
    background:#00c3ff;
    width:0%;
    transition:1s;
}

/* rewards */
.rewards{
    margin-top:10px;
    min-height:40px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}
.reward{
    width:32px;
    height:32px;
}

/* RIGHT */
.inv{
    padding:20px;
}
.grid{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
}
.slot{
    height:90px;
    border:1px solid #444;
    border-radius:10px;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}
.slot img{
    max-width:70%;
    max-height:70%;
    filter:grayscale(100%);
    opacity:0.3;
}
.slot.unlocked{
    border-color:#00c3ff;
    box-shadow:0 0 10px #00c3ff;
    background:rgba(0,195,255,0.2);
}
.slot.unlocked img{
    filter:none;
    opacity:1;
}

.daily{
    margin-top:15px;
    border:1px solid #00c3ff;
    padding:10px;
    border-radius:10px;
}
button{
    background:#00c3ff;
    border:none;
    padding:8px 12px;
    cursor:pointer;
    font-weight:bold;
}
input{
    width:100%;
    padding:6px;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="system">

<!-- LEFT -->
<div class="char">
<div class="char-box">
<div>JÄGER: <span id="user">Gast</span></div>
<div class="rank" id="rank">EI</div>

<div class="avatar">
    <img id="avatarImage" src="img/ei.png">
</div>

XP <span id="xp">0</span> / <span id="nextxp">60</span>
<div class="xpbar"><div class="xpfill" id="fill"></div></div>

<div class="rewards" id="rewards"></div>

<div class="daily" id="dailyBox">
<div id="question"></div>
<input id="answer">
<button onclick="submit()">XP holen</button>
</div>

</div>
</div>

<!-- RIGHT -->
<div class="inv">
<h3>Inventar</h3>
<div class="grid" id="inventory"></div>
</div>

</div>

<script>
/* ================= CONFIG ================= */

const stages=[
 {n:"EI",x:0,img:"img/ei.png"},
 {n:"SCHLEIM",x:60,img:"img/schleim.png"},
 {n:"SKELETT",x:90,img:"img/skelett.png"},
 {n:"GOBLIN",x:180,img:"img/goblin.png"},
 {n:"OGER",x:270,img:"img/oger.png"},
 {n:"LICH",x:360,img:"img/lich.png"},
 {n:"WESEN",x:720,img:"img/wesen.png"}
];

const items=[
 {n:"Schwert",x:60,img:"img/schwert.png",reward:"⚔️"},
 {n:"Kristall",x:90,img:"img/kristall.png",reward:"💎"},
 {n:"Truhe",x:180,img:"img/truhe.png",reward:"🎁"},
 {n:"Relikt",x:360,img:"img/relikt.png",reward:"🔮"},
 {n:"Krone",x:720,img:"img/krone.png",reward:"👑"}
];

const lockedImg="img/locked.png";

/* ================= USER ================= */

const params=new URLSearchParams(location.search);
const user=params.get("user")||"Gast";
document.getElementById("user").innerText=user;
const key="spawn_"+user;
let save=JSON.parse(localStorage.getItem(key))||{xp:0,last:""};

/* ================= STAGE ================= */

let cur=stages[0],next=stages[1];
stages.forEach(s=>{
 if(save.xp>=s.x) cur=s;
});
next=stages[stages.indexOf(cur)+1]||cur;

document.getElementById("rank").innerText=cur.n;
document.getElementById("avatarImage").src=cur.img;
document.getElementById("xp").innerText=save.xp;
document.getElementById("nextxp").innerText=next.x;

let p=((save.xp-cur.x)/(next.x-cur.x))*100;
document.getElementById("fill").style.width=Math.min(100,p)+"%";

/* ================= INVENTORY ================= */

const inv=document.getElementById("inventory");
const rewards=document.getElementById("rewards");

items.forEach(it=>{
 const d=document.createElement("div");
 d.className="slot";
 const img=document.createElement("img");

 if(save.xp>=it.x){
   d.classList.add("unlocked");
   img.src=it.img;
   rewards.innerHTML+=`<div class="reward">${it.reward}</div>`;
   d.onclick=()=>alert(it.n+" freigeschaltet!");
 }else{
   img.src=lockedImg;
 }

 d.appendChild(img);
 inv.appendChild(d);
});

/* ================= DAILY ================= */

const today=new Date().toDateString();
let correct=7;
document.getElementById("question").innerText="Wie viele Eier sind im Nest?";

if(save.last===today){
 document.getElementById("dailyBox").innerText="Heute schon XP erhalten.";
}

function submit(){
 const a=document.getElementById("answer").value;
 if(parseInt(a)===correct){
   save.xp++;
   save.last=today;
   localStorage.setItem(key,JSON.stringify(save));
   location.reload();
 }else{
   alert("Falsch!");
 }
}

/* ================= STREAMER.BOT ================= */

const ws=new WebSocket("ws://127.0.0.1:8080");
ws.onmessage=e=>{
  const data=JSON.parse(e.data);
  if(data.type==="eggs"){
     correct=data.value;
  }
  if(data.type==="xp"){
     save.xp+=data.amount;
     localStorage.setItem(key,JSON.stringify(save));
     location.reload();
  }
};
</script>

</body>
</html>
