<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 | Follower System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    background:#050b12;
    font-family: "Segoe UI", sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.panel {
    width:360px;
    background:linear-gradient(180deg,#021a30,#000);
    border:2px solid #00c3ff;
    border-radius:12px;
    box-shadow:0 0 25px #00c3ff;
    padding:20px;
    text-align:center;
}

.title {
    color:#00c3ff;
    font-size:22px;
    margin-bottom:10px;
}

.user {
    font-size:16px;
    margin-bottom:5px;
}

.status {
    color:#00c3ff;
    font-weight:bold;
    margin-bottom:15px;
}

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.stage {
    border:1px solid #444;
    border-radius:6px;
    padding:8px;
    font-size:13px;
    color:#777;
}

.stage.active {
    border-color:#00c3ff;
    color:white;
    box-shadow:0 0 10px #00c3ff;
    background:rgba(0,195,255,0.15);
}

.bar {
    background:#111;
    border:1px solid #00c3ff;
    border-radius:20px;
    overflow:hidden;
    height:20px;
    margin-top:10px;
}

.fill {
    height:100%;
    background:#00c3ff;
    width:0%;
    transition:1s;
}

.xptext {
    font-size:12px;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="panel">
    <div class="title">SPAWN2909</div>
    <div class="user" id="user">Follower</div>
    <div class="status" id="status">EI</div>

    <div class="grid">
        <div class="stage" id="s0">🥚 EI</div>
        <div class="stage" id="s1">💧 SCHLEIM</div>
        <div class="stage" id="s2">💀 SKELETT</div>
        <div class="stage" id="s3">👺 GOBLIN</div>
        <div class="stage" id="s4">👹 OGER</div>
        <div class="stage" id="s5">🧙‍♂️ LICH</div>
        <div class="stage" id="s6">✨ WESEN</div>
    </div>

    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="xptext"><span id="xp">0</span> / <span id="next">60</span> XP</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("user") || "Gast";
const xp = parseInt(params.get("xp")) || 0;

document.getElementById("user").innerText = "JÄGER: " + name;

let stage = 0;
let next = 60;
let prev = 0;

if(xp >= 720){stage=6; prev=720; next=720;}
else if(xp >= 360){stage=5; prev=360; next=720;}
else if(xp >= 270){stage=4; prev=270; next=360;}
else if(xp >= 180){stage=3; prev=180; next=270;}
else if(xp >= 90){stage=2; prev=90; next=180;}
else if(xp >= 60){stage=1; prev=60; next=90;}

document.getElementById("status").innerText =
["EI","SCHLEIM","SKELETT","GOBLIN","OGER","LICH","WESEN"][stage];

document.getElementById("s"+stage).classList.add("active");

let percent = ((xp-prev)/(next-prev))*100;
document.getElementById("fill").style.width = Math.min(100,Math.max(0,percent))+"%";

document.getElementById("xp").innerText = xp;
document.getElementById("next").innerText = next;
</script>

</body>
</html>
