<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 Loyalty System</title>
<style>
body{
    margin:0;
    background:#050b12;
    color:white;
    font-family:Segoe UI;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.card{
    width:380px;
    background:linear-gradient(180deg,#021b30,#000);
    border:2px solid #00c3ff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 0 25px #00c3ff;
    text-align:center;
}
.title{color:#00c3ff;font-size:22px;margin-bottom:10px;}
.bar{background:#111;border:1px solid #00c3ff;border-radius:20px;height:18px;overflow:hidden;}
.fill{height:100%;background:#00c3ff;width:0%;transition:1s;}
.box{
    border:1px solid #00c3ff;
    padding:10px;
    border-radius:8px;
    background:rgba(0,195,255,.1);
    margin:10px 0;
}
button{
    background:#00c3ff;
    border:none;
    padding:8px 12px;
    font-weight:bold;
    cursor:pointer;
    border-radius:6px;
}
.hidden{display:none;}
</style>
</head>

<body>

<div class="card">
    <div class="title">SPAWN2909</div>

    <div class="box">
        JÄGER: <span id="user"></span><br>
        STATUS: <span id="stage"></span>
    </div>

    <div class="box">
        NÄCHSTE STUFE: <span id="nextStage"></span><br>
        BELohnung: <span id="rewards"></span>
    </div>

    <div class="box">
        XP: <span id="xp"></span> / <span id="nextXp"></span>
        <div class="bar"><div class="fill" id="fill"></div></div>
    </div>

    <div id="dailyBox" class="box hidden">
        <div id="question"></div><br>
        <input id="answer" placeholder="Antwort..." style="width:90%;padding:5px;"><br><br>
        <button onclick="checkAnswer()">XP verdienen</button>
    </div>

    <div id="doneBox" class="box hidden">
        Heute hast du bereits XP erhalten.<br>
        Komm morgen wieder 🐲
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const user = params.get("user") || "Gast";
document.getElementById("user").innerText = user;

// ----- Fake Datenbank (Browser) -----
const key = "spawn_"+user;
let save = JSON.parse(localStorage.getItem(key)) || {xp:0,last:""};

// ----- Stufen -----
const stages=[
 {n:"🥚 EI",x:0,r:[]},
 {n:"💧 SCHLEIM",x:60,r:["💧"]},
 {n:"💀 SKELETT",x:90,r:["💀","🦴"]},
 {n:"👺 GOBLIN",x:180,r:["👺","🗡️"]},
 {n:"👹 OGER",x:270,r:["👹","🔨"]},
 {n:"🧙‍♂️ LICH",x:360,r:["🧙‍♂️","🔮","💀"]},
 {n:"✨ WESEN",x:720,r:["✨","👑","🌌"]}
];

// ----- Aktuelle Stufe -----
let cur=stages[0];
let next=stages[1];
for(let i=0;i<stages.length;i++){
 if(save.xp>=stages[i].x){
    cur=stages[i];
    next=stages[i+1]||stages[i];
 }
}

document.getElementById("stage").innerText=cur.n;
document.getElementById("nextStage").innerText=next.n;
document.getElementById("rewards").innerText=next.r.join(" ");

document.getElementById("xp").innerText=save.xp;
document.getElementById("nextXp").innerText=next.x;

let pct=((save.xp-cur.x)/(next.x-cur.x))*100;
document.getElementById("fill").style.width=Math.min(100,pct)+"%";

// ----- Daily Frage -----
const today=new Date().toDateString();

const questions=[
 {q:"Wie viele Eier sind heute im Nest?",a:"3"},
 {q:"Welches Spiel hat Spawn2909 heute gespielt?",a:"minecraft"},
 {q:"Welche Kreatur bewacht das Nest?",a:"drache"}
];

let q=questions[Math.floor(Math.random()*questions.length)];

if(save.last!==today){
 document.getElementById("dailyBox").classList.remove("hidden");
 document.getElementById("question").innerText=q.q;
}else{
 document.getElementById("doneBox").classList.remove("hidden");
}

function checkAnswer(){
 let a=document.getElementById("answer").value.toLowerCase();
 if(a===q.a){
    save.xp++;
    save.last=today;
    localStorage.setItem(key,JSON.stringify(save));
    location.reload();
 }else{
    alert("Falsch. Nur echte Zuschauer kennen die Antwort 😈");
 }
}
</script>

</body>
</html>
