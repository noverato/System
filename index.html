<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Isekai RPG Edition</title>
    <style>
        :root {
            --fantasy-bg: rgba(40, 30, 20, 0.95);
            --gold: #ffd700;
            --border: 2px solid #ffd700;
            --shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            --btn-grad: linear-gradient(135deg, #b8860b, #8b4513);
        }

        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; transform-origin: center center; }
        
        /* Gebäude & Spieler */
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; transform: translate(-50%, -50%); transition: filter 0.3s; }
        .building:hover { filter: brightness(1.2) drop-shadow(0 0 10px gold); }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        .creature { position: absolute; width: 80px; height: 100px; z-index: 1000; text-align: center; transform: translate(-50%, -50%); transition: left 0.6s ease-out, top 0.6s ease-out; cursor: pointer; }
        .avatar-emoji { font-size: 60px; display: block; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8)); }
        .name-tag { font-size: 14px; font-weight: bold; color: #fff; background: rgba(15, 23, 42, 0.9); padding: 2px 12px; border-radius: 8px; border: 1px solid #3b82f6; margin-top: 5px; }

        /* HUD */
        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); box-shadow: var(--shadow); z-index: 5000; min-width: 180px; }
        
        /* MODAL DESIGN */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .mmo-panel { width: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; box-shadow: var(--shadow); display: flex; overflow: hidden; position: relative; }
        
        /* Split Panels */
        .panel-left { flex: 2; padding: 25px; border-right: 1px solid rgba(255, 215, 0, 0.3); max-height: 80vh; overflow-y: auto; }
        .panel-right { flex: 1; padding: 25px; background: rgba(20, 15, 10, 0.5); display: flex; flex-direction: column; gap: 15px; }
        
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 18px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-action:hover { transform: scale(1.05); filter: brightness(1.3); box-shadow: 0 0 10px gold; }
        .btn-action:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }

        .item-row { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255, 215, 0, 0.2); }
        .resource-badge { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: bold; color: gold; }
        .req-met { color: #4ade80; }
        .req-fail { color: #ef4444; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div class="building" style="left:1200px; top:750px; width:220px; height:220px; background-image:url('./marktplatz.png');" onclick="event.stopPropagation(); openBuilding('markt')"><div class="label">Marktplatz</div></div>
        <div class="building" style="left:400px; top:300px; width:250px; height:250px; background-image:url('./rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Rathaus</div></div>
        <div class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png');" onclick="event.stopPropagation(); openBuilding('schmiede')"><div class="label">Schmiede</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:gold; font-size: 18px; font-weight:bold;">👑 <span id="playerName">Lädt...</span></div>
    <div style="font-size:14px; margin-top:5px;">❤️ HP: <span id="hpC">100</span> | ⚔️ ATK: <span id="atkC">12</span></div>
    <div style="font-size:14px; color:#4ade80;">💎 LXP: <span id="lxpC">0</span></div>
    <button class="btn-action" style="font-size:10px; width:100%; margin-top:10px;" onclick="openBuilding('inventar')">🎒 Inventar</button>
</div>

<div id="gameModal" class="modal">
    <div class="mmo-panel">
        <div class="panel-left" id="modalLeft"></div>
        <div class="panel-right">
            <h3 style="color:gold; border-bottom:1px solid gold; padding-bottom:10px;">🎒 RUCKSACK</h3>
            <div id="miniInv"></div>
            <button class="btn-action" style="margin-top:auto;" onclick="toggleModal('gameModal', false)">Verlassen</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8",
  authDomain: "thenest-81de6.firebaseapp.com",
  databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com",
  projectId: "thenest-81de6",
  storageBucket: "thenest-81de6.firebasestorage.app",
  messagingSenderId: "785821659645",
  appId: "1:785821659645:web:684460a421d3c9dcaee994"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = JSON.parse(localStorage.getItem('nestData')) || {
    name: "Held", x: 960, y: 540, stein: 0, wood: 0, iron: 0, gras: 0, slime: 0, bone: 0, trank: 0, lxp: 0, hp: 100, atk: 12, emoji: "🥚"
};

let otherPlayers = {};
let marketListings = {};
let villageStoneCount = 0;

window.onbeforeunload = () => { db.ref('players/' + data.name.replace(/\s+/g, '_')).remove(); };
db.ref('players').on('value', snap => { otherPlayers = snap.val() || {}; render(); });
db.ref('market').on('value', snap => { marketListings = snap.val() || {}; if(currentBuilding) updateModalContent(); });
db.ref('world/villageStats/totalStone').on('value', snap => { villageStoneCount = snap.val() || 0; if(currentBuilding) updateModalContent(); });

function sync() { db.ref('players/' + data.name.replace(/\s+/g, '_')).set(data); }

function render() {
    const layer = document.getElementById('charLayer');
    layer.innerHTML = '';
    for (let id in otherPlayers) {
        const p = otherPlayers[id];
        const isMe = (p.name === data.name);
        const avatar = document.createElement('div');
        avatar.className = 'creature';
        avatar.style.left = p.x + "px"; avatar.style.top = p.y + "px";
        avatar.style.zIndex = isMe ? "2000" : "1000";
        avatar.innerHTML = `<span>${p.emoji}</span><div class="name-tag" style="${isMe?'border-color:gold;':''}">${p.name} (ATK:${p.atk || 12})</div>`;
        layer.appendChild(avatar);
    }
}

let currentBuilding = null;
function openBuilding(b) { currentBuilding = b; toggleModal('gameModal', true); updateModalContent(); }

function updateModalContent() {
    if(!currentBuilding) return;
    const left = document.getElementById('modalLeft');
    const right = document.getElementById('miniInv');
    
    right.innerHTML = `
        <div class="resource-badge">🪨 Stein: ${data.stein}</div>
        <div class="resource-badge">🪵 Holz: ${data.wood || 0}</div>
        <div class="resource-badge">⛓️ Eisen: ${data.iron || 0}</div>
        <div class="resource-badge">🦴 Knochen: ${data.bone}</div>
    `;

    if(currentBuilding === 'schmiede') {
        left.innerHTML = `<h2 style="color:gold;">⚒️ DIE SCHMIEDE</h2>`;
        left.innerHTML += craftRow('Knochendolch', '+5 ATK', {bone: 5, slime: 2}, 5);
        left.innerHTML += craftRow('Eisenschwert', '+12 ATK', {iron: 8, wood: 5}, 12);
    } 
    else if(currentBuilding === 'markt') {
        left.innerHTML = `<h2 style="color:gold;">⚖️ MARKTPLATZ</h2>
        <h4 style="color:silver;">🏘️ DORF-HANDEL</h4>
        <div class="item-row"><span>10 Steine gegen 5 LXP</span> <button class="btn-action" onclick="tradeWithVillage('stein', 10, 5)">Tauschen</button></div>
        <hr>
        <h4 style="color:silver;">🛒 AUKTIONSHAUS</h4>
        <div id="marketList"></div>
        <button class="btn-action" style="margin-top:10px; background: #22c55e;" onclick="listOwnItem('trank', 25)">🧪 Item inserieren (25 LXP)</button>`;
        const list = document.getElementById('marketList');
        for(let key in marketListings) {
            let item = marketListings[key];
            list.innerHTML += `<div class="item-row"><span>${item.seller}: 1x ${item.type}</span><button class="btn-action" onclick="buyPlayerItem('${key}')">${item.price} LXP</button></div>`;
        }
    }
    else if(currentBuilding === 'rathaus') {
        left.innerHTML = `<h2 style="color:gold;">🏰 RATHAUS DES NESTES</h2>
        <p style="font-style: italic; color: #ccc;">"Hier werden Legenden geboren."</p>
        <div class="item-row">
            <b>📜 DEIN STATUS:</b><br>
            Held: ${data.name}<br>
            Rang: ${data.lxp > 500 ? 'Meister-Ei' : 'Anfänger-Ei'}<br>
            Angriffskraft: ${data.atk}
        </div>
        <div class="item-row" style="border: 1px solid #4ade80;">
            <b>🌍 GEMEINSCHAFT:</b><br>
            Gesammelte Steine: ${villageStoneCount}<br>
            Dorf-Ziel: 500 für das nächste Level!
        </div>`;
    }
    else if(currentBuilding === 'steinbruch') {
        left.innerHTML = `<h2 style="color:gold;">⛏️ STEINBRUCH</h2>
        <div style="font-size:100px; cursor:pointer;" onclick="harvest('stein')">🪨</div>
        <p>Klicke zum Sammeln! (Dorf-Fortschritt: ${villageStoneCount})</p>`;
    }
    else if(currentBuilding === 'inventar') {
        left.innerHTML = `<h2 style="color:gold;">🎒 DEIN RUCKSACK</h2>
        <div class="item-row">Hier siehst du alle Schätze deiner Reise.</div>`;
    }
}

function craftRow(name, bonus, reqs, atkAdd) {
    let metAll = true; let reqHtml = "";
    for(let res in reqs) {
        let has = data[res] || 0; let met = has >= reqs[res]; if(!met) metAll = false;
        reqHtml += `<span class="${met?'req-met':'req-fail'}">${reqs[res]} ${res}</span> | `;
    }
    return `<div class="item-row"><b>${name}</b> (${bonus})<br><small>${reqHtml}</small><br>
        <button class="btn-action" ${!metAll?'disabled':''} onclick="finishCrafting(${atkAdd}, ${JSON.stringify(reqs).replace(/"/g, '&quot;')})">Schmieden</button></div>`;
}

function finishCrafting(add, cost) {
    for(let res in cost) data[res] -= cost[res];
    data.atk += add; save(); sync(); updateModalContent();
}

function tradeWithVillage(item, qty, rew) {
    if(data[item] >= qty) { data[item] -= qty; data.lxp += rew; save(); sync(); updateModalContent(); }
}

function harvest(item) {
    data[item] = (data[item] || 0) + 1;
    if(item === 'stein') db.ref('world/villageStats/totalStone').transaction(c => (c || 0) + 1);
    save(); sync(); updateModalContent();
}

function handleWorldClick(e) {
    const rect = document.getElementById('world').getBoundingClientRect();
    data.x = (e.clientX - rect.left);
    data.y = (e.clientY - rect.top);
    save(); sync();
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; if(!s) currentBuilding = null; }
function updateUI() {
    document.getElementById('playerName').innerText = data.name;
    document.getElementById('hpC').innerText = data.hp;
    document.getElementById('atkC').innerText = data.atk; // FIX: Schaden wird jetzt angezeigt!
    document.getElementById('lxpC').innerText = data.lxp;
}
function save() { localStorage.setItem('nestData', JSON.stringify(data)); updateUI(); }

window.onload = () => {
    const p = new URLSearchParams(window.location.search);
    if(p.get('user')) data.name = p.get('user');
    updateUI();
};
</script>
</body>
</html>
