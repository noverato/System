<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Overlord Edition 2026 - RPG Engine Stable</title>

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&display=swap" rel="stylesheet">

    <script src="items.js"></script> 
    <script src="loot.js"></script>
    <script src="storage.js"></script>
    <script src="avatar_anchors.js"></script> <script src="evolution.js"></script> 
    <script src="mining.js"></script> 
    <script src="inventar.js"></script>
    <script src="markt.js"></script>
    <script src="battle.js"></script>
    <script src="admin.js"></script>

    <style>
        :root { 
            --fantasy-bg: rgba(25, 15, 10, 0.98); 
            --gold: #ffd700; --border: 2px solid #ffd700; 
            --shadow: 0 0 25px rgba(255, 215, 0, 0.6); 
            --btn-grad: linear-gradient(135deg, #b8860b, #8b4513); 
            --hp-color: #ff4444; --mp-color: #3b82f6;
            --ff-blue: rgba(0, 0, 150, 0.9);
        }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; cursor: crosshair; }
        #charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        
        /* --- RPG WORLD UI --- */
        .creature { position: absolute; width: 80px; height: 100px; text-align: center; transform: translate(-50%, -50%); transition: all 0.6s ease-out; pointer-events: auto; }
        .creature img { height: 80px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
        .name-tag { font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 12px; border-radius: 6px; border: 1px solid var(--gold); margin-top: 5px; white-space: nowrap; }
        .boss-aura { border: 2px solid #ff0000 !important; color: #ff0000 !important; box-shadow: 0 0 20px #ff0000; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        
        /* --- RPG INVENTORY INTERFACE --- */
        .inventory-container { display: flex; flex-direction: column; gap: 20px; color: #fff; }
        .inv-upper { display: grid; grid-template-columns: 120px 1fr 200px; gap: 20px; min-height: 400px; }
        .equip-slots { display: flex; flex-direction: column; gap: 10px; }
        .slot { 
            width: 60px; height: 60px; border: 1px solid var(--gold); background: rgba(0,0,0,0.4); 
            border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 10px rgba(255,215,0,0.1); transition: 0.2s; cursor: pointer;
        }
        .slot:hover { box-shadow: var(--shadow); background: rgba(255,215,0,0.1); }
        .slot img { width: 45px; height: 45px; object-fit: contain; }
        .slot::before { content: attr(data-label); position: absolute; font-size: 9px; bottom: -12px; color: var(--gold); white-space: nowrap; }

        .avatar-preview { 
            position: relative; border: 1px solid rgba(255,215,0,0.2); 
            background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, rgba(0,0,0,0.5) 70%);
            border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #avatar-base { height: 320px; z-index: 1; filter: drop-shadow(0 0 15px #000); }
        #weapon-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

        .stats-display { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,215,0,0.3); }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .set-bonus-active { color: #4ade80; font-weight: bold; animation: glow-green 1.5s infinite alternate; font-size: 13px; text-align: center; margin-top: 15px; display: none; }
        @keyframes glow-green { from { text-shadow: 0 0 5px #4ade80; } to { text-shadow: 0 0 15px #4ade80; } }

        .backpack-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; max-height: 250px; overflow-y: auto; padding: 10px; border-top: 2px solid var(--gold); margin-top: 10px; }
        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 200px; box-shadow: var(--shadow); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .mmo-panel { width: 1250px; height: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; box-shadow: var(--shadow); }
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .ff-tooltip { position: fixed; display: none; z-index: 30000; background: var(--ff-blue); border: 2px solid #fff; border-radius: 8px; padding: 15px; min-width: 220px; pointer-events: none; color: #fff; box-shadow: 0 0 20px #000; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div id="b-steinbruch" class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div id="b-schmiede" class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png');" onclick="event.stopPropagation(); openBuilding('schmiede')"><div class="label">Wald-Schmiede</div></div>
        <div id="b-arena" class="building" style="left:300px; top:700px; width:200px; height:200px; background-image:url('./arena.png');" onclick="event.stopPropagation(); openBuilding('arena')"><div class="label">PvP Arena</div></div>
        <div id="b-rathaus" class="building" style="left:1000px; top:600px; width:250px; height:250px; background-image:url('./rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Halle der Evolution</div></div>
        <div id="b-markt" class="building" style="left:1200px; top:800px; width:180px; height:180px; background-image:url('./rathaus.png'); filter:hue-rotate(90deg);" onclick="event.stopPropagation(); openBuilding('markt')"><div class="label">Marktplatz</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="item-tooltip" class="ff-tooltip"></div>

<div id="hud">
    <div style="color:gold; font-size: 20px; font-weight:bold;"><span id="playerName">Identifiziere...</span></div>
    <div id="hudClass" style="font-size:13px; color: #3b82f6; font-weight: bold;">Klasse...</div>
    <div style="font-size:12px; color:#4ade80; margin-top: 5px;">💎 LXP: <span id="lxpC">0</span> | ⭐ LVL: <span id="lvlTotal">0</span></div>
    <button class="btn-action" style="width:100%; margin-top:10px;" onclick="openInventory()">🎒 INVENTAR</button>
    <div id="adminHud" style="display:none; margin-top:10px;"><button class="btn-action" style="background:linear-gradient(135deg, #ff0000, #8b0000); width:100%;" onclick="openAdminPanel()">🛠 GÖTTER-MENÜ</button></div>
</div>

<div id="gameModal" class="modal">
    <div class="mmo-panel">
        <div class="panel-main" id="modalLeft"></div>
        <div class="panel-side">
            <h3 style="color:gold; margin-top:0;">📜 INFO</h3>
            <div id="sideInfo" style="font-size: 14px; color: #ccc;">Wähle eine Aktion.</div>
            <button class="btn-action" style="width:100%; margin-top:auto;" onclick="closeGeneralModal()">X SCHLIESSEN</button>
        </div>
    </div>
</div>

<template id="inventory-template">
    <div class="inventory-container">
        <h2 style="color:gold; margin:0;">Helden-Inventar</h2>
        <div class="inv-upper">
            <div class="equip-slots">
                <div class="slot" data-label="Kopf" id="slot-head"></div>
                <div class="slot" data-label="Brust" id="slot-chest"></div>
                <div class="slot" data-label="Hose" id="slot-legs"></div>
                <div class="slot" data-label="Füße" id="slot-feet"></div>
                <div class="slot" data-label="Waffe" id="slot-weapon" style="margin-top:10px;"></div>
                <div class="slot" data-label="Schild" id="slot-offhand"></div>
            </div>
            <div class="avatar-preview">
                <img id="avatar-base" src="Ei.png">
                <div id="weapon-layer"></div>
            </div>
            <div class="stats-display">
                <h3 style="color:gold; margin:0 0 10px 0;">Attribute</h3>
                <div class="stat-line"><span>HP:</span> <span id="stat-hp" style="color:var(--hp-color);">0</span></div>
                <div class="stat-line"><span>ATK:</span> <span id="stat-atk" style="color:#ffcc00;">0</span></div>
                <div class="stat-line"><span>DEF:</span> <span id="stat-def" style="color:#4ade80;">0</span></div>
                <div id="set-bonus-msg" class="set-bonus-active">✨ SET-BONUS AKTIV ✨</div>
            </div>
        </div>
        <div class="backpack-grid" id="backpack-slots"></div>
    </div>
</template>

<template id="evo-hall-template">
    <div class="evo-container">
        <h2 style="color:gold; font-size: 32px;">Halle der Evolution</h2>
        <div class="requirement-grid">
            <div class="req-box" id="req-lxp">LXP: <span id="evo-lxp-val">0</span> / 5.000</div>
            <div class="req-box" id="req-lvl">Level: <span id="evo-lvl-val">0</span> / 30</div>
            <div class="req-box" id="req-ep">EP (Daily): <span id="evo-ep-val">0</span> / 30</div>
        </div>
        <div style="background:rgba(0,255,255,0.1); border:1px solid #00ffff; padding:12px; border-radius:8px; margin-bottom:20px;">
            ✨ XP-SPEICHER: <span id="evo-buffer-val" style="color:#00ffff; font-weight:bold;">0</span> LXP
        </div>
        <div class="class-grid" id="evo-class-list"></div>
    </div>
</template>

<script>
// --- CORE LOGIC ---
const firebaseConfig = { apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8", authDomain: "thenest-81de6.firebaseapp.com", databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com", projectId: "thenest-81de6" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const TWITCH_CLIENT_ID = "futhxsgrshkh2h6cqywavg5cous3q0";
const BROADCASTER_ID = "573773653";
const REDIRECT_URI = "https://noverato.github.io/System";

let data = { 
    name: "Held", x: 960, y: 540, lxp: 0, hp: 100, maxHp: 100, 
    stats: { atk: 10, def: 10, currentLevel: 1, className: "Ei" }, 
    inventar: {}, equipment: {}, lxpBuffer: 0, setBonusActive: false 
};
let twitchToken = "", verifiedID = "", isIdentified = false, onlinePlayers = {}, isAdmin = false;

// --- AUTH ---
async function checkTwitchAuth() { const hash = window.location.hash.substring(1); const params = new URLSearchParams(hash); if (params.has("access_token")) { twitchToken = params.get("access_token"); return true; } return false; }
async function initTwitchSession() {
    if (!twitchToken) return;
    try {
        const resp = await fetch(`https://api.twitch.tv/helix/users`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${twitchToken}` } });
        const result = await resp.json();
        if (result.data && result.data.length > 0) {
            verifiedID = result.data[0].id;
            data.name = result.data[0].display_name;
            isIdentified = true;
            isAdmin = (verifiedID === BROADCASTER_ID);
            await loadUserData();
        }
    } catch (err) { console.error(err); }
}
async function loadUserData() {
    if (!verifiedID) return;
    const snap = await db.ref('players/' + verifiedID).once('value');
    if (snap.exists()) { Object.assign(data, snap.val()); }
    updateUI();
}
function save() { if (isIdentified) db.ref('players/' + verifiedID).update({ ...data, lastSeen: Date.now() }); }

function updateUI() {
    document.getElementById('playerName').innerText = isAdmin ? "OVERLORD " + data.name : data.name;
    document.getElementById('hudClass').innerText = data.stats.className;
    document.getElementById('lxpC').innerText = data.lxp;
    document.getElementById('lvlTotal').innerText = data.stats.currentLevel;
    document.getElementById('adminHud').style.display = isAdmin ? 'block' : 'none';
}

function renderPlayers(players) {
    const layer = document.getElementById('charLayer'); layer.innerHTML = '';
    Object.keys(players).forEach(id => {
        const p = players[id];
        if (p.hidden || (Date.now() - (p.lastSeen || 0) > 60000)) return;
        const div = document.createElement('div');
        div.className = 'creature';
        div.style.left = p.x + "px"; div.style.top = p.y + "px";
        const imgSrc = (typeof getCreatureSprite === 'function') ? getCreatureSprite(p, id === BROADCASTER_ID) : 'Ei.png';
        div.innerHTML = `<img src="${imgSrc}"><div class="name-tag ${id === BROADCASTER_ID ? 'boss-aura' : ''}">${p.name}</div>`;
        layer.appendChild(div);
    });
}

// --- RPG INVENTORY LOGIC (PIXEL MAPPING) ---
function openInventory() {
    toggleModal('gameModal', true);
    renderInventoryUI();
}

function renderInventoryUI() {
    const main = document.getElementById('modalLeft');
    main.innerHTML = '';
    main.appendChild(document.getElementById('inventory-template').content.cloneNode(true));

    document.getElementById('stat-hp').innerText = data.maxHp;
    document.getElementById('stat-atk').innerText = data.stats.atk;
    document.getElementById('stat-def').innerText = data.stats.def;
    if(data.setBonusActive) document.getElementById('set-bonus-msg').style.display = 'block';

    document.getElementById('avatar-base').src = (typeof getCreatureSprite === 'function') ? getCreatureSprite(data, isAdmin) : 'Ei.png';
    const wLayer = document.getElementById('weapon-layer');
    if (data.equipment.weapon && items[data.equipment.weapon]) {
        // PIXEL-KORREKTUR: Zieht die exakten Ankerpunkte aus der avatar_anchors.js
        const off = (typeof getWeaponOffsets === 'function') ? getWeaponOffsets(data) : { x: 160, y: 160, rotate: 0 };
        const img = document.createElement('img');
        img.src = items[data.equipment.weapon].icon;
        // WICHTIG: CSS-Zuweisung erfolgt konsequent in PX für pixelgenaues Alignment
        img.style.cssText = `position:absolute; left:${off.x}px; top:${off.y}px; transform:translate(-50%,-50%) rotate(${off.rotate}deg); width:65px;`;
        wLayer.appendChild(img);
    }

    ["head", "chest", "legs", "feet", "weapon", "offhand"].forEach(slot => {
        const el = document.getElementById(`slot-${slot}`);
        const id = data.equipment[slot];
        if (id && items[id]) {
            el.innerHTML = `<img src="${items[id].icon}">`;
            el.onclick = () => { if(typeof unequipItem === 'function') unequipItem(slot); renderInventoryUI(); save(); };
            el.onmouseenter = (e) => showTooltip(e, items[id]);
            el.onmouseleave = hideTooltip;
        }
    });

    const grid = document.getElementById('backpack-slots');
    Object.keys(data.inventar || {}).forEach(id => {
        if (data.inventar[id] > 0) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.innerHTML = `<img src="${items[id]?.icon || 'stone.png'}"><span style="position:absolute;bottom:2px;right:4px;font-size:10px;">${data.inventar[id]}</span>`;
            slot.onclick = () => { if(typeof equipItem === 'function') equipItem(id); renderInventoryUI(); save(); };
            slot.onmouseenter = (e) => showTooltip(e, items[id]);
            slot.onmouseleave = hideTooltip;
            grid.appendChild(slot);
        }
    });
}

function showTooltip(e, item) {
    const tt = document.getElementById('item-tooltip');
    tt.innerHTML = `<h4>${item.name}</h4><div>${(typeof getStatPreview === 'function') ? getStatPreview(item) : 'RPG Item'}</div>`;
    tt.style.cssText = `display:block; left:${e.clientX + 20}px; top:${e.clientY + 10}px;`;
}
function hideTooltip() { document.getElementById('item-tooltip').style.display = 'none'; }

function openBuilding(b) {
    toggleModal('gameModal', true);
    const main = document.getElementById('modalLeft');
    main.innerHTML = '';
    if (b === 'rathaus') {
        main.appendChild(document.getElementById('evo-hall-template').content.cloneNode(true));
        if (typeof initEvoHallDisplay === 'function') initEvoHallDisplay();
    } else if (b === 'steinbruch' && typeof renderMiningMenu === 'function') {
        renderMiningMenu();
    }
}

window.onload = async () => {
    if (await checkTwitchAuth()) {
        await initTwitchSession();
        db.ref('players').on('value', snap => {
            onlinePlayers = snap.val() || {};
            renderPlayers(onlinePlayers);
        });
    } else {
        window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=user:read:email`;
    }
};

function handleWorldClick(e) {
    if (!isIdentified) return;
    const rect = document.getElementById('world').getBoundingClientRect();
    data.x = e.clientX - rect.left; data.y = e.clientY - rect.top;
    save();
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
function closeGeneralModal() { toggleModal('gameModal', false); hideTooltip(); }
</script>
</body>
</html>
