<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Isekai Nest V4 - Stream Edition</title>

<style>
body {
    margin: 0;
    background: #050b05;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    height: 100vh;
    width: 100vw;
}

/* Dorf-Hintergrund */
#forest {
    position: absolute;
    inset: 0;
    background-image: url('dorf.jpg');
    background-size: cover;
    background-position: center;
    z-index: 1;
}

/* Creatures */
.creature {
    position: absolute;
    text-align: center;
    font-size: 32px;
    z-index: 50;
    animation: wusel 1.5s ease-in-out infinite alternate;
    transition: all 0.3s ease;
}

.name {
    font-size: 12px;
    color: #ffe7a3;
    text-shadow: 0 0 4px black;
    z-index: 51;
    position: relative;
    margin-top: -5px;
}

/* Wusel-Animation */
@keyframes wusel {
    0% { transform: translate(0px, 0px); }
    25% { transform: translate(2px, -2px); }
    50% { transform: translate(-2px, 2px); }
    75% { transform: translate(2px, 1px); }
    100% { transform: translate(-1px, -2px); }
}

/* UI Panels - Immer sichtbar */
.ui {
    position: absolute;
    top: 20px;
    width: 200px;
    height: calc(100vh - 40px);
    background: rgba(20, 20, 40, 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(218, 165, 32, 0.7);
    border-radius: 10px;
    padding: 15px;
    z-index: 1000;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
}

#leftUI {
    left: 10px;
}

#rightUI {
    right: 10px;
}

/* Close Buttons */
.closeBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(200, 50, 50, 0.8);
    color: white;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    text-align: center;
    line-height: 20px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1001;
    font-size: 12px;
}

.closeBtn:hover {
    background: rgba(255, 50, 50, 0.9);
}

/* Standard Buttons */
button {
    background: rgba(50, 50, 80, 0.8);
    color: white;
    border: 1px solid rgba(218, 165, 32, 0.7);
    border-radius: 6px;
    padding: 8px;
    margin: 5px 0;
    cursor: pointer;
    transition: all 0.2s;
}

button:hover:not(:disabled) {
    background: rgba(70, 70, 100, 0.9);
    transform: scale(1.02);
}

button:disabled {
    background: #555;
    cursor: not-allowed;
    opacity: 0.7;
}

/* Arena Design */
#bossWindow {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    max-width: 90%;
    background: rgba(15, 15, 30, 0.9);
    border: 3px solid rgba(139, 0, 0, 0.8);
    border-radius: 15px;
    padding: 15px;
    display: none;
    z-index: 1000;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
    border-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="none" stroke="%238B0000" stroke-width="3" x="1" y="1" width="98" height="98" rx="10"/></svg>') 10 round;
}

#bossHP {
    display: block;
    width: 100%;
    height: 20px;
    background: #333;
    border-radius: 10px;
    margin: 10px 0;
    overflow: hidden;
    position: relative;
}

#bossHPBar {
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #8B0000);
    width: 100%;
    transition: width 0.5s ease;
}

#party {
    margin: 10px 0;
    min-height: 60px;
    background: rgba(0, 0, 0, 0.3);
    padding: 8px;
    border-radius: 8px;
}

#battleLog {
    height: 100px;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.5);
    padding: 8px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 10px;
}

#attackButton {
    background: rgba(100, 20, 20, 0.8);
    border: 1px solid rgba(180, 50, 50, 0.9);
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 10px;
    padding: 10px;
    font-size: 14px;
}

#attackButton:hover:not(:disabled) {
    background: rgba(150, 30, 30, 0.9);
}
</style>
</head>

<body>
    <div id="forest"></div>

    <!-- Linke UI - Immer sichtbar -->
    <div id="leftUI" class="ui">
        <button class="closeBtn" onclick="document.getElementById('leftUI').style.display='none'">×</button>
        <h3 style="margin-top: 5px; color: #ffd700; text-shadow: 0 0 5px #000;">Dorf-Info</h3>
        <div id="stats" style="margin: 10px 0; font-size: 14px;">
            Bewohner: <span id="residentCount">0</span><br>
            Subs: <span id="subCount">0</span><br>
            Follower: <span id="followerCount">0</span>
        </div>
        <div style="margin-top: auto; font-size: 12px; color: #aaa;">
            Isekai Nest v4.1<br>
            Stream Edition
        </div>
    </div>

    <!-- Rechte UI - Shop -->
    <div id="rightUI" class="ui">
        <button class="closeBtn" onclick="document.getElementById('rightUI').style.display='none'">×</button>
        <h3 style="margin-top: 5px; color: #ffd700; text-shadow: 0 0 5px #000;">Dorf-Shop</h3>

        <button onclick="buyXP('DevUser')">+10 EP (10 LXP)</button>
        <button onclick="buyPotion('DevUser')">Kleiner Trank (5 LXP)</button>
        <button onclick="sharpenSword('DevUser')">Schwert-Schärfen (20 LXP)</button>
        <button onclick="spawnBoss()">Boss rufen</button>

        <div style="margin-top: auto; font-size: 12px; color: #aaa;">
            LXP-Balance:<br>
            <span id="lxpBalance">0</span>
        </div>
    </div>

    <!-- Arena -->
    <div id="bossWindow">
        <button class="closeBtn" onclick="document.getElementById('bossWindow').style.display='none'">×</button>
        <h2 style="color: #ff4444; text-shadow: 0 0 8px #000; margin: 5px 0 15px;">👹 BOSS-KAMPF 👹</h2>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="color: #ffaaaa; font-size: 16px;">Boss-Health:</span>
            <div id="bossHP">
                <div id="bossHPBar"></div>
            </div>
        </div>

        <div id="party"></div>

        <button id="attackButton" onclick="attackBoss()">ANGREIFEN!</button>
        <div id="battleLog"></div>
    </div>

    <!-- Dev Button -->
    <button
        style="position: absolute; bottom: 20px; right: 20px; z-index: 9999; background: rgba(80, 80, 120, 0.8);"
        onclick="spawnEgg('DevUser', 'sub')">
        DEV SPAWN (Sub)
    </button>

    <script>
        // Admin-Funktion: Start-Datum für treue Follower
        const FAKE_JOIN_DATES = {
            "Follower1": Date.now() - (86400000 * 30),
            "Follower2": Date.now() - (86400000 * 45),
            "Follower3": Date.now() - (86400000 * 60),
            "Follower4": Date.now() - (86400000 * 75),
            "Follower5": Date.now() - (86400000 * 90),
            "Follower6": Date.now() - (86400000 * 105),
            "Follower7": Date.now() - (86400000 * 120),
            "Follower8": Date.now() - (86400000 * 135),
        };

        let creatures = JSON.parse(localStorage.getItem("creatures")) || {};
        let boss = null;
        let attackCooldown = false;

        // Initial spawn für Demo
        if (Object.keys(creatures).length === 0) {
            spawnEgg("DevUser", "sub");
            spawnEgg("Follower1");
            spawnEgg("Follower2");
        }

        function save() {
            localStorage.setItem("creatures", JSON.stringify(creatures));
        }

        // Evolution für Follower
        function getFollowerStage(ep) {
            if (ep >= 90) return "🌳"; // Waldwächter
            if (ep >= 30) return "🏺"; // Golem
            return "🥚"; // Ei
        }

        // Evolution für Subs
        function getSubStage(ep) {
            if (ep >= 180) return "👽"; // Höheres Wesen
            if (ep >= 150) return "💀"; // Lich
            if (ep >= 120) return "👹"; // Oger
            if (ep >= 90) return "🎃"; // Goblin
            if (ep >= 60) return "💧"; // Skelett
            if (ep >= 30) return "🟢"; // Schleim
            return "🥚"; // Ei
        }

        function spawnEgg(name, type = "follower") {
            if (creatures[name]) return;

            creatures[name] = {
                name,
                type,
                ep: 0,
                lxp: type === "sub" ? 50 : 10,
                joined: FAKE_JOIN_DATES[name] || Date.now()
            };
            save();
            render();
        }

        function tick() {
            for (let c of Object.values(creatures)) {
                let days = (Date.now() - c.joined) / (1000 * 60 * 60 * 24);
                c.ep = Math.floor(days);
                c.lxp += 1 / 1440; // 1 LXP pro Minute
            }
            save();
            render();
        }

        setInterval(tick, 60000);

        function render() {
            // Statistiken aktualisieren
            const residents = Object.keys(creatures).length;
            const subs = Object.values(creatures).filter(c => c.type === "sub").length;
            const followers = residents - subs;

            document.getElementById("residentCount").textContent = residents;
            document.getElementById("subCount").textContent = subs;
            document.getElementById("followerCount").textContent = followers;

            // LXP-Balance anzeigen (Beispielwert)
            const user = creatures["DevUser"];
            document.getElementById("lxpBalance").textContent = user ? Math.floor(user.lxp) + " LXP" : "0";

            // Creatures rendern
            document.querySelectorAll(".creature").forEach(e => e.remove());

            let i = 0;
            for (let c of Object.values(creatures)) {
                let d = document.createElement("div");
                d.className = "creature";
                d.style.left = (30 + Math.random() * 40) + "%";
                d.style.top = (30 + Math.random() * 40) + "%";
                d.innerHTML = `
                    <div class="name">${c.name}</div>
                    ${c.type === "sub" ? getSubStage(c.ep) : getFollowerStage(c.ep)}
                `;
                document.body.appendChild(d);
                i++;
            }
        }

        /* Boss Kampf */
        function spawnBoss() {
            boss = { hp: 1000, maxHP: 1000 };
            document.getElementById("bossWindow").style.display = "block";
            updateBoss();
        }

        function updateBoss() {
            // HP-Bar aktualisieren
            const hpPercent = (boss.hp / boss.maxHP) * 100;
            document.getElementById("bossHPBar").style.width = hpPercent + "%";

            // Party anzeigen
            document.getElementById("party").innerHTML =
                Object.values(creatures)
                    .map(c => (c.type === "sub" ? getSubStage(c.ep) : getFollowerStage(c.ep)) + " " + c.name)
                    .join("<br>");
        }

        function attackBoss() {
            if (attackCooldown) return;

            attackCooldown = true;
            document.getElementById("attackButton").disabled = true;

            let log = "";
            let dmg = 0;

            for (let c of Object.values(creatures)) {
                let stage = c.type === "sub" ? getSubStage(c.ep) : getFollowerStage(c.ep);
                if (stage === "👽" || stage === "🌳") dmg += 100;
                else if (stage === "💀" || stage === "👹") dmg += 40;
                else if (stage === "🎃" || stage === "💧" || stage === "🏺") dmg += 10;
            }

            boss.hp -= dmg;
            log += `⚔️ Gruppe verursacht <strong>${dmg}</strong> Schaden!<br>`;

            if (boss.hp <= 0) {
                log += "🎉 <strong>BOSS BESIEGT!</strong> 🎉<br>";
                log += "💰 Alle Teilnehmer erhalten 50 LXP!";
                // LXP Belohnung verteilen
                for (let c of Object.values(creatures)) {
                    c.lxp += 50;
                }
                save();

                setTimeout(() => {
                    document.getElementById("bossWindow").style.display = "none";
                }, 3000);
            }

            document.getElementById("battleLog").innerHTML = log + "<br>" + document.getElementById("battleLog").innerHTML;
            updateBoss();

            setTimeout(() => {
                attackCooldown = false;
                document.getElementById("attackButton").disabled = false;
            }, 1000);
        }

        /* Shop Funktionen */
        function buyXP(userName) {
            let user = creatures[userName];
            if (user && user.lxp >= 10) {
                user.lxp -= 10;
                user.ep += 10;
                save();
                render();
                logMessage(`✅ ${userName} kauft +10 EP für 10 LXP!`);
            } else {
                logMessage(`❌ Nicht genug LXP! (Benötigt: 10)`);
            }
        }

        function buyPotion(userName) {
            let user = creatures[userName];
            if (user && user.lxp >= 5) {
                user.lxp -= 5;
                save();
                render();
                logMessage(`🍵 ${userName} kauft einen kleinen Trank für 5 LXP!`);
            } else {
                logMessage(`❌ Nicht genug LXP! (Benötigt: 5)`);
            }
        }

        function sharpenSword(userName) {
            let user = creatures[userName];
            if (user && user.lxp >= 20) {
                user.lxp -= 20;
                user.ep += 5; // Bonus-EP
                save();
                render();
                logMessage(`⚔️ ${userName} schärft sein Schwert für 20 LXP (+5 EP Bonus)!`);
            } else {
                logMessage(`❌ Nicht genug LXP! (Benötigt: 20)`);
            }
        }

        function logMessage(message) {
            const logElement = document.getElementById("battleLog");
            logElement.innerHTML = message + "<br>" + logElement.innerHTML;
        }

        // Initial Render
        render();

        /* WebSocket (Beispiel - muss an deine Backend-Logik angepasst werden) */
        let ws = new WebSocket("ws://localhost:8080");
        ws.onmessage = function(e) {
            let data = JSON.parse(e.data);
            if (data.displayName) {
                spawnEgg(data.displayName, data.isSub ? "sub" : "follower");
            }
        };
    </script>
</body>
</html>
