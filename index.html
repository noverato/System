<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Nest - Mobile RPG Edition</title>
<style>
    /* BASE SETUP */
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0a0a12; color: #e0d8b0; }
    #gameWorld { position: absolute; width: 100%; height: 100%; background: url('wald.png') center/cover; z-index: 1; }
    
    /* CREATURES & BARS */
    .creature { position: absolute; width: 80px; height: 80px; z-index: 10; transition: all 3s ease-in-out; text-align: center; }
    .creature-img { width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: center; margin: 0 auto; position: relative; }
    
    .bar-wrap { width: 60px; height: 4px; background: rgba(0,0,0,0.8); margin: 2px auto; border-radius: 2px; overflow: hidden; }
    .bar-ep { height: 100%; background: #4caf50; width: 0%; transition: width 0.3s; }
    .bar-lxp { height: 100%; background: #2196f3; width: 0%; transition: width 0.3s; }
    .name-tag { font-size: 10px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

    /* BOSS & BATTLE LOG */
    #bossArea { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); text-align: center; z-index: 50; display: none; }
    #bossImg { width: 150px; height: 150px; filter: drop-shadow(0 0 15px red); }
    #attackBtn { background: linear-gradient(#ff4444, #990000); color: white; border: 2px solid #fff; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    
    #battleLog { position: absolute; bottom: 20px; left: 20px; width: 250px; height: 120px; background: rgba(0,0,0,0.7); border: 1px solid #334155; border-radius: 5px; padding: 10px; font-size: 12px; overflow-y: hidden; z-index: 100; pointer-events: none; }

    /* MARKT & SCHMIEDE (HUD) */
    #mainHUD { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
    .hud-btn { background: rgba(15, 23, 42, 0.9); border: 1px solid #3b82f6; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: center; }
    .hud-btn:hover { background: #1e293b; }

    /* OVERLAYS */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal-content { background: #1a1c2c; border: 2px solid #3d4a5d; padding: 25px; border-radius: 15px; width: 300px; text-align: center; }

    /* GEAR VISUAL */
    .gear-sword { position: absolute; width: 40px; height: 40px; right: -15px; top: 0; background: url('schwert.png') no-repeat center/contain; image-rendering: pixelated; }
</style>
</head>
<body>

<div id="gameWorld">
    <div id="creatureLayer"></div>
    
    <div id="bossArea">
        <h2 id="bossName" style="color:red; text-shadow: 0 0 10px black;">BOSS ERSCHIENEN!</h2>
        <div id="bossHpBar" style="width:200px; height:15px; background:black; border:1px solid white; margin: 10px auto;">
            <div id="bossHpFill" style="width:100%; height:100%; background:red;"></div>
        </div>
        <img src="https://i.imgur.com/6M6oVvP.png" id="bossImg" alt="Boss"> <br><br>
        <button id="attackBtn" onclick="doAttack()">⚔️ ATTACK!</button>
    </div>

    <div id="battleLog"></div>

    <div id="mainHUD">
        <div class="hud-btn" onclick="openMenu('inv')">🎒 INVENTAR</div>
        <div class="hud-btn" onclick="openMenu('shop')" style="border-color:#eab308;">⚖️ MARKTPLATZ</div>
        <div class="hud-btn" onclick="openMenu('forge')" style="border-color:#ef4444;">⚒️ SCHMIEDE</div>
        <div style="background:rgba(0,0,0,0.5); padding:5px; border-radius:5px; font-size:12px;">
            🪵: <span id="resWood">0</span> | ✨: <span id="resLXP">0</span>
        </div>
    </div>
</div>

<div id="menuModal" class="modal" onclick="closeMenu(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="menuTitle">Menü</h2>
        <div id="menuBody"></div>
        <br>
        <button onclick="document.getElementById('menuModal').style.display='none'">Schließen</button>
    </div>
</div>

<script>
const BROADCASTER = "spawn2909";
let player = JSON.parse(localStorage.getItem('nestPlayer')) || {
    name: "spawn2909", wood: 0, lxp: 0, ep: 0, gear: null, ownsSword: false
};

let boss = { active: false, hp: 100, maxHp: 100 };

// INITIALISIERUNG
function init() {
    renderPlayer();
    updateHUD();
    startLoops();
    // Test-Boss alle 5 Minuten
    setInterval(spawnBoss, 300000);
}

function updateHUD() {
    document.getElementById('resWood').textContent = Math.floor(player.wood);
    document.getElementById('resLXP').textContent = Math.floor(player.lxp);
}

function renderPlayer() {
    const layer = document.getElementById('creatureLayer');
    layer.innerHTML = '';
    
    const div = document.createElement('div');
    div.className = 'creature';
    div.style.left = "50%"; div.style.top = "50%";
    
    // EP/LXP BARS FIX
    const epWidth = Math.min(100, (player.ep / 30) * 100);
    const lxpWidth = Math.min(100, player.lxp);

    div.innerHTML = `
        <div class="bar-wrap"><div class="bar-ep" style="width:${epWidth}%"></div></div>
        <div class="bar-wrap"><div class="bar-lxp" style="width:${lxpWidth}%"></div></div>
        <div class="creature-img" style="background-image:url('ei.png')">
            ${player.gear === 'sword' ? '<div class="gear-sword"></div>' : ''}
        </div>
        <div class="name-tag">${player.name}</div>
    `;
    layer.appendChild(div);
}

// BATTLE SYSTEM
function spawnBoss() {
    boss.active = true;
    boss.hp = 100;
    document.getElementById('bossArea').style.display = 'block';
    addLog("Ein wildes Monster greift an!");
}

function doAttack() {
    if(!boss.active) return;
    const dmg = player.gear === 'sword' ? 10 : 2;
    boss.hp -= dmg;
    
    document.getElementById('bossHpFill').style.width = boss.hp + "%";
    addLog(`Du triffst für ${dmg} Schaden!`);

    if(boss.hp <= 0) {
        boss.active = false;
        document.getElementById('bossArea').style.display = 'none';
        player.lxp += 20;
        player.wood += 10;
        addLog("SIEG! +20 LXP, +10 Holz erhalten.");
        save();
    }
}

function addLog(txt) {
    const log = document.getElementById('battleLog');
    log.innerHTML += `<div>> ${txt}</div>`;
    log.scrollTop = log.scrollHeight;
}

// MENÜ SYSTEM
function openMenu(type) {
    const modal = document.getElementById('menuModal');
    const title = document.getElementById('menuTitle');
    const body = document.getElementById('menuBody');
    modal.style.display = 'flex';

    if(type === 'forge') {
        title.textContent = "Schmiede";
        body.innerHTML = `
            <p>Ein 16-Bit Schwert schmieden?</p>
            <p style="font-size:12px;">Kosten: 50 Holz</p>
            <button onclick="buy('sword')">SCHMIEDEN</button>
        `;
    } else if(type === 'shop') {
        title.textContent = "Marktplatz";
        body.innerHTML = `<p>Hier kommen bald Items für LXP rein!</p>`;
    } else if(type === 'inv') {
        title.textContent = "Inventar";
        body.innerHTML = `
            <p>Schwert: ${player.ownsSword ? 'Vorhanden' : 'Keins'}</p>
            ${player.ownsSword ? `<button onclick="toggleGear()">${player.gear ? 'Ablegen' : 'Anlegen'}</button>` : ''}
        `;
    }
}

function buy(item) {
    if(item === 'sword' && player.wood >= 50) {
        player.wood -= 50;
        player.ownsSword = true;
        alert("Schwert erhalten!");
        save();
    } else { alert("Nicht genug Holz!"); }
}

function toggleGear() {
    player.gear = player.gear ? null : 'sword';
    save();
    renderPlayer();
}

function save() {
    localStorage.setItem('nestPlayer', JSON.stringify(player));
    updateHUD();
}

function startLoops() {
    // Passives Sammeln
    setInterval(() => {
        player.wood += 0.2;
        player.lxp += 0.05;
        save();
    }, 5000);
}

window.onload = init;
</script>
</body>
</html>
