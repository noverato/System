<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Isekai RPG - Arena Plug-In</title>
    <style>
        /* BESTEHENDES DESIGN (UNANGESETZT) */
        :root { --fantasy-bg: rgba(40, 30, 20, 0.95); --gold: #ffd700; --border: 2px solid #ffd700; --shadow: 0 0 15px rgba(255, 215, 0, 0.4); --btn-grad: linear-gradient(135deg, #b8860b, #8b4513); }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; transform-origin: center center; }
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; transform: translate(-50%, -50%); }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        .creature { position: absolute; width: 80px; height: 100px; z-index: 1000; text-align: center; transform: translate(-50%, -50%); transition: left 0.6s ease-out, top 0.6s ease-out; }
        .name-tag { font-size: 14px; font-weight: bold; color: #fff; background: rgba(15, 23, 42, 0.9); padding: 2px 12px; border-radius: 8px; border: 1px solid #3b82f6; margin-top: 5px; }

        /* NEUES ISOLIERTES ARENA LAYER */
        #arenaLayer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('./arena_innen.png') no-repeat center; background-size: cover;
            z-index: 60000; display: none; flex-direction: column; justify-content: flex-end; align-items: center;
        }
        #battleMenu {
            width: 90%; height: 200px; background: rgba(0, 0, 50, 0.95);
            border: 4px solid #fff; border-radius: 10px; margin-bottom: 20px;
            display: grid; grid-template-columns: 250px 1fr; padding: 10px; box-sizing: border-box;
        }
        .battle-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-battle { 
            background: #000080; color: white; border: 2px solid #fff; 
            font-family: monospace; font-size: 18px; cursor: pointer; text-align: left; padding: 5px 15px;
        }
        .btn-battle:hover { background: #fff; color: #000; }
        #battleLog { 
            border-left: 2px solid #fff; padding: 10px; overflow-y: auto; 
            font-family: monospace; font-size: 16px; color: #00ff00; text-align: left;
        }

        /* HUD & MODALS (STABIL) */
        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 180px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .mmo-panel { width: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; }
        .panel-left { flex: 2; padding: 25px; border-right: 1px solid rgba(255, 215, 0, 0.3); }
        .panel-right { flex: 1; padding: 25px; background: rgba(20, 15, 10, 0.5); }
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 18px; border-radius: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="arenaLayer">
    <div id="enemyDisplay" style="margin-bottom: auto; margin-top: 50px; text-align: center;">
        <div id="enemyEmoji" style="font-size: 120px;">🐗</div>
        <h2 id="enemyName" style="color: white; text-shadow: 2px 2px #000;">Wald-Eber</h2>
        <div id="enemyHPBar" style="width: 300px; height: 20px; background: #500; border: 2px solid #fff;">
            <div id="enemyHPFill" style="width: 100%; height: 100%; background: #f00;"></div>
        </div>
    </div>

    <div id="battleMenu">
        <div class="battle-buttons">
            <button class="btn-battle" onclick="arenaAction('attack')">⚔️ ANGRIFF</button>
            <button class="btn-battle" onclick="arenaAction('magic')">🔮 MAGIE</button>
            <button class="btn-action" style="grid-column: span 2; border: 1px solid #fff;" onclick="arenaAction('item')">🎒 ITEM (Trank)</button>
            <button class="btn-battle" style="grid-column: span 2;" onclick="arenaAction('flee')">🏃 FLUCHT</button>
        </div>
        <div id="battleLog">> Arena betreten...</div>
    </div>
</div>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div class="building" style="left:1200px; top:750px; width:220px; height:220px; background-image:url('./marktplatz.png');" onclick="event.stopPropagation(); openBuilding('markt')"><div class="label">Marktplatz</div></div>
        <div class="building" style="left:400px; top:300px; width:250px; height:250px; background-image:url('./rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Rathaus</div></div>
        <div class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png');" onclick="event.stopPropagation(); openBuilding('schmiede')"><div class="label">Schmiede</div></div>
        
        <div class="building" style="left:1600px; top:800px; width:280px; height:280px; background-image:url('./arena.png');" onclick="event.stopPropagation(); openBuilding('arena')"><div class="label">Arena</div></div>
        
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:gold; font-size: 18px; font-weight:bold;">👑 <span id="playerName">Lädt...</span></div>
    <div style="font-size:14px; margin-top:5px;">❤️ HP: <span id="hpC">100</span> | ⚔️ ATK: <span id="atkC">12</span></div>
    <div style="font-size:14px; color:#4ade80;">💎 LXP: <span id="lxpC">0</span></div>
</div>

<div id="gameModal" class="modal">
    <div class="mmo-panel">
        <div class="panel-left" id="modalLeft"></div>
        <div class="panel-right" id="miniInv"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8",
  authDomain: "thenest-81de6.firebaseapp.com",
  databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com",
  projectId: "thenest-81de6",
  storageBucket: "thenest-81de6.firebasestorage.app",
  messagingSenderId: "785821659645",
  appId: "1:785821659645:web:684460a421d3c9dcaee994"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = JSON.parse(localStorage.getItem('nestData')) || {
    name: "Held", x: 960, y: 540, stein: 0, wood: 0, iron: 0, gras: 0, slime: 0, bone: 0, trank: 0, lxp: 0, hp: 100, atk: 12, emoji: "🥚"
};

// ARENA STATE (ISOLIERT)
let combat = { active: false, enemyHP: 0, enemyMaxHP: 0, enemyName: "" };

window.onbeforeunload = () => { db.ref('players/' + data.name.replace(/\s+/g, '_')).remove(); };
db.ref('players').on('value', snap => { renderPlayers(snap.val()); });

function sync() { db.ref('players/' + data.name.replace(/\s+/g, '_')).set(data); }

/* --- ARENA MODUL --- */
function startArenaFight() {
    combat.active = true;
    combat.enemyName = Math.random() > 0.5 ? "Wald-Schleim" : "Skelett-Späher";
    combat.enemyEmoji = combat.enemyName === "Wald-Schleim" ? "🟢" : "💀";
    combat.enemyMaxHP = combat.enemyName === "Wald-Schleim" ? 40 : 75;
    combat.enemyHP = combat.enemyMaxHP;
    
    document.getElementById('arenaLayer').style.display = 'flex';
    document.getElementById('enemyName').innerText = combat.enemyName;
    document.getElementById('enemyEmoji').innerText = combat.enemyEmoji;
    document.getElementById('battleLog').innerHTML = `> Ein wilder ${combat.enemyName} erscheint!`;
    updateArenaUI();
}

function arenaAction(type) {
    const log = document.getElementById('battleLog');
    if(type === 'flee') {
        document.getElementById('arenaLayer').style.display = 'none';
        combat.active = false;
        return;
    }
    
    if(type === 'attack') {
        let dmg = Math.floor(Math.random() * data.atk) + 5;
        combat.enemyHP -= dmg;
        log.innerHTML += `<br>> Du greifst an: ${dmg} Schaden!`;
    }
    if(type === 'magic') {
        let dmg = 20;
        combat.enemyHP -= dmg;
        log.innerHTML += `<br>> Magie-Explosion: ${dmg} Schaden!`;
    }
    if(type === 'item') {
        if(data.trank > 0) {
            data.hp = 100; data.trank--;
            log.innerHTML += `<br>> Trank genutzt! HP voll.`;
        } else { log.innerHTML += `<br>> Kein Trank im Beutel!`; }
    }

    if(combat.enemyHP <= 0) {
        log.innerHTML += `<br>> GEGNER BESIEGT! +5 LXP erhalten.`;
        data.lxp += 5;
        save(); sync();
        setTimeout(() => { document.getElementById('arenaLayer').style.display = 'none'; combat.active = false; }, 2000);
    }
    updateArenaUI();
    log.scrollTop = log.scrollHeight;
}

function updateArenaUI() {
    let perc = (combat.enemyHP / combat.enemyMaxHP) * 100;
    document.getElementById('enemyHPFill').style.width = Math.max(0, perc) + "%";
}

/* --- DORF LOGIK (EINGEFROREN) --- */
function openBuilding(b) {
    if(b === 'arena') { startArenaFight(); return; }
    document.getElementById('gameModal').style.display = 'flex';
    const left = document.getElementById('modalLeft');
    if(b === 'steinbruch') left.innerHTML = `<h2>Steinbruch</h2><button class="btn-action" onclick="harvest()">Hauen!</button>`;
    if(b === 'markt') left.innerHTML = `<h2>Markt</h2><p>Handel aktiv...</p>`;
    if(b === 'schmiede') left.innerHTML = `<h2>Schmiede</h2><p>Amboss glüht...</p>`;
    if(b === 'rathaus') left.innerHTML = `<h2>Rathaus</h2><p>Dorf-Status...</p>`;
    if(b === 'inventar') left.innerHTML = `<h2>Inventar</h2><p>Rucksack-Inhalt...</p>`;
}

function harvest() { data.stein++; save(); sync(); }
function handleWorldClick(e) {
    if(combat.active) return;
    const rect = document.getElementById('world').getBoundingClientRect();
    data.x = (e.clientX - rect.left);
    data.y = (e.clientY - rect.top);
    save(); sync();
}
function renderPlayers(players) {
    const layer = document.getElementById('charLayer'); layer.innerHTML = '';
    for(let id in players) {
        const p = players[id]; const isMe = (p.name === data.name);
        const div = document.createElement('div'); div.className = 'creature';
        div.style.left = p.x + "px"; div.style.top = p.y + "px";
        div.innerHTML = `<span>${p.emoji}</span><div class="name-tag">${p.name}</div>`;
        layer.appendChild(div);
    }
}
function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
function updateUI() {
    document.getElementById('playerName').innerText = data.name;
    document.getElementById('hpC').innerText = data.hp;
    document.getElementById('atkC').innerText = data.atk;
    document.getElementById('lxpC').innerText = data.lxp;
}
function save() { localStorage.setItem('nestData', JSON.stringify(data)); updateUI(); }
window.onload = () => { 
    const p = new URLSearchParams(window.location.search);
    if(p.get('user')) data.name = p.get('user');
    updateUI(); 
};
</script>
</body>
</html>
