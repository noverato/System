<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isekai Village - The Nest: Adventure Edition</title>
<style>
    /* ===== BASE & LAYER SYSTEM ===== */
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #e0d8b0; background: #0a0a12; position: relative; }
    #watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600"><text x="50%" y="50%" font-family="Arial" font-size="40" fill="%23ffffff" fill-opacity="0.06" text-anchor="middle" transform="rotate(-15 500 300)">Property of Spawn2909 - The Nest</text></svg>'); z-index: 5; pointer-events: none; }
    #gameWorld { position: absolute; width: 100%; height: 100%; background-image: url('wald.png'); background-size: cover; z-index: 1; }
    
    /* ===== BOSS RAID UI (OPTIMIERT) ===== */
    #bossUI { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(30, 5, 5, 0.95); border: 2px solid #ff4444; border-radius: 15px; padding: 20px; display: none; z-index: 150; box-shadow: 0 0 30px #ff0000; text-align: center; }
    #bossHPBar { height: 25px; width: 100%; background: #222; border-radius: 12px; margin: 15px 0; overflow: hidden; border: 1px solid #ff4444; }
    #bossHPFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff0000, #990000); transition: width 0.3s; }
    
    /* RIESIGER ATTACK BUTTON */
    #attackBtn { 
        background: linear-gradient(180deg, #ff4444, #990000); 
        color: white; border: 2px solid #fff; 
        padding: 20px 40px; border-radius: 10px; 
        font-size: 24px; font-weight: bold; cursor: pointer; 
        display: none; margin-top: 15px; width: 100%;
        text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 5px 15px rgba(255,0,0,0.4);
        transition: transform 0.1s;
    }
    #attackBtn:active { transform: scale(0.95); }
    
    /* BATTLE LOG */
    #battleLog { height: 120px; overflow-y: hidden; font-size: 0.9em; color: #ffaaaa; margin-top: 15px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; text-align: left; border: 1px solid rgba(255,68,68,0.3); }
    .log-name { color: #ffd700; font-weight: bold; }
    .log-dmg { color: #ffffff; font-weight: bold; }

    #raidTimerDisplay { position: fixed; bottom: 20px; left: 10px; font-size: 14px; color: rgba(255,255,255,0.6); z-index: 100; background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; }

    /* ===== CREATURES & UI ===== */
    .creature { position: absolute; width: 70px; height: 70px; z-index: 10; pointer-events: none; }
    .creature-base { width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; }
    .name-tag { position: absolute; bottom: -25px; width: 160%; left: -30%; text-align: center; font-size: 11px; font-weight: bold; color: #ffeb3b; text-shadow: 2px 2px 2px black; }
    .ui-panel { position: absolute; background: rgba(18, 22, 30, 0.9); border: 1px solid rgba(184, 134, 11, 0.7); border-radius: 8px; padding: 12px; z-index: 100; backdrop-filter: blur(5px); }
    #villageStats { left: 10px; top: 10px; width: 220px; }
</style>
</head>
<body>

<div id="watermark"></div>
<div id="raidTimerDisplay">Nächster Raid in: --:--</div>

<div id="bossUI">
    <h2 style="margin:0; color:#ff4444;">👹 BOSS-RAID AKTIV!</h2>
    <div id="bossHPBar"><div id="bossHPFill"></div></div>
    <div id="battleLog">Warte auf den ersten Schlag...</div>
    <button id="attackBtn" onclick="handleManualAttack()">⚔ ANGRIFF! ⚔</button>
</div>

<div id="gameWorld">
    <div id="creaturesContainer"></div>
</div>

<div id="villageStats" class="ui-panel">
    <h3>🏡 Dorf-Statistik</h3>
    <div id="currentUserDisplay" style="color:#ffd700; font-weight:bold; margin-bottom:10px;">Spieler: -</div>
    <div>Einwohner: <span id="resCount">0</span></div>
    <div>Gold: <span id="resGold">0</span> 💰</div>
</div>

<script>
// ===== CONFIG & STORAGE =====
const SECURITY = { HMAC_SECRET: 'NestWächter2026!', WS_ORIGIN: 'ws://127.0.0.1:8080' };

const gameState = {
    creatures: JSON.parse(localStorage.getItem('creatures')) || {},
    resources: JSON.parse(localStorage.getItem('resources')) || { gold: 0 },
    boss: { active: false, hp: 0, maxHp: 0, name: "Feuer-Drache" },
    raidTimer: parseInt(localStorage.getItem('nextRaidTime')) || 0,
    playerName: localStorage.getItem('nestPlayerName') || null
};

// ===== IDENTITY LOGIC =====
function checkIdentity() {
    if (!gameState.playerName) {
        let name = prompt("Willkommen im Nest! Wie lautet dein Abenteurer-Name?", "Abenteurer");
        if (!name || name.trim() === "") name = "Unbekannter";
        gameState.playerName = name.trim();
        localStorage.setItem('nestPlayerName', gameState.playerName);
    }
    document.getElementById('currentUserDisplay').textContent = "Held: " + gameState.playerName;
    
    // Den Spieler auch visuell ins Dorf einfügen, falls nicht vorhanden
    if (!gameState.creatures[gameState.playerName]) {
        addCreature(gameState.playerName, 'follower', Date.now());
    }
}

// ===== RAID TIMER LOGIC =====
function getRaidInterval() {
    const day = new Date().getDay();
    return (day >= 1 && day <= 4 || day === 0) ? 2700000 : 3600000;
}

function initRaidTimer() {
    if (!gameState.raidTimer || gameState.raidTimer < Date.now()) setNextRaid();
    setInterval(checkRaidTime, 1000);
}

function setNextRaid() {
    gameState.raidTimer = Date.now() + getRaidInterval();
    localStorage.setItem('nextRaidTime', gameState.raidTimer);
}

function checkRaidTime() {
    if (gameState.boss.active) return;
    const timeLeft = gameState.raidTimer - Date.now();
    if (timeLeft <= 0) triggerBoss();
    else updateTimerDisplay(timeLeft);
}

function updateTimerDisplay(ms) {
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    document.getElementById('raidTimerDisplay').textContent = `Nächster Raid in: ${m}:${s < 10 ? '0' : ''}${s}`;
}

// ===== COMBAT LOGIC =====
function triggerBoss() {
    gameState.boss.active = true;
    gameState.boss.maxHp = 2000 + (Object.keys(gameState.creatures).length * 150);
    gameState.boss.hp = gameState.boss.maxHp;
    document.getElementById('bossUI').style.display = 'block';
    document.getElementById('attackBtn').style.display = 'block';
    addLog(`Der <span class="log-name">${gameState.boss.name}</span> greift an!`);
    updateBossUI();
}

function handleManualAttack() {
    if (!gameState.boss.active) return;
    
    const dmg = 45 + Math.floor(Math.random() * 20);
    gameState.boss.hp -= dmg;
    
    // Nutzt den lokal gespeicherten Namen
    addLog(`<span class="log-name">${gameState.playerName}</span> landet einen Treffer: <span class="log-dmg">${dmg}</span> Schaden!`);

    // XP/LXP Belohnung
    if (gameState.creatures[gameState.playerName]) {
        gameState.creatures[gameState.playerName].xp = (gameState.creatures[gameState.playerName].xp || 0) + 5;
        gameState.creatures[gameState.playerName].lxp = (gameState.creatures[gameState.playerName].lxp || 0) + 2;
    }

    updateBossUI();
    if (gameState.boss.hp <= 0) victory();
}

function victory() {
    gameState.boss.active = false;
    addLog(`SIEG! Der Boss wurde besiegt!`);
    document.getElementById('attackBtn').style.display = 'none';
    setTimeout(() => { 
        document.getElementById('bossUI').style.display = 'none'; 
        setNextRaid(); 
    }, 4000);
    saveGameState();
}

function addLog(msg) {
    const log = document.getElementById('battleLog');
    const entry = document.createElement('div');
    entry.innerHTML = `> ${msg}`;
    log.prepend(entry);
}

// ===== ENGINE & RENDER =====
function addCreature(name, type, timestamp) {
    if (!gameState.creatures[name]) {
        gameState.creatures[name] = { name, type, xp: 0, lxp: 50, joinDate: timestamp };
        renderCreatures();
        saveGameState();
    }
}

function renderCreatures() {
    const container = document.getElementById('creaturesContainer');
    container.innerHTML = '';
    Object.values(gameState.creatures).forEach(c => {
        const el = document.createElement('div');
        el.className = 'creature';
        el.id = `creature-${c.name}`;
        el.innerHTML = `<div class="creature-base" style="background-image: url('${c.type==='sub'?'ei.png':'follower.png'}')"></div><div class="name-tag">${c.name}</div>`;
        container.appendChild(el);
    });
}

function updateBossUI() {
    const p = (gameState.boss.hp / gameState.boss.maxHp) * 100;
    document.getElementById('bossHPFill').style.width = Math.max(0, p) + "%";
}

function updateUI() {
    document.getElementById('resCount').textContent = Object.keys(gameState.creatures).length;
    document.getElementById('resGold').textContent = gameState.resources.gold;
}

function saveGameState() { 
    localStorage.setItem('creatures', JSON.stringify(gameState.creatures)); 
    localStorage.setItem('resources', JSON.stringify(gameState.resources)); 
}

window.onload = () => {
    checkIdentity(); // Namen abfragen oder laden
    renderCreatures();
    initRaidTimer();
    updateUI();
    
    // Einfache Bewegung
    setInterval(() => {
        Object.values(gameState.creatures).forEach(c => {
            const el = document.getElementById(`creature-${c.name}`);
            if(!el) return;
            if(!c.curX) { c.curX = 20+Math.random()*60; c.curY = 30+Math.random()*50; }
            c.curX += (Math.random()-0.5)*0.3; c.curY += (Math.random()-0.5)*0.3;
            el.style.left = c.curX + "%"; el.style.top = c.curY + "%";
        });
    }, 100);
};
</script>
</body>
</html>
