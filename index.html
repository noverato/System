<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: MMORPG Edition</title>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0d8b0; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; transform-origin: center center; }
        
        /* Gebäude */
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; transform: translate(-50%, -50%); }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: gold; padding: 2px 8px; border-radius: 5px; font-size: 12px; white-space: nowrap; border: 1px solid gold; }
        
        /* Spieler */
        .creature { position: absolute; width: 80px; height: 100px; z-index: 1000; text-align: center; transform: translate(-50%, -50%); transition: left 0.6s ease-out, top 0.6s ease-out; }
        .avatar-emoji { font-size: 60px; display: block; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8)); }
        .name-tag { font-size: 14px; font-weight: bold; color: #fff; background: rgba(15, 23, 42, 0.9); padding: 2px 12px; border-radius: 8px; border: 1px solid #3b82f6; margin-top: 5px; }
        
        /* Das neue MMORPG Inventar Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .mmo-inv { width: 800px; height: 500px; background: #0f172a; border: 3px solid gold; border-radius: 20px; position: relative; display: grid; grid-template-columns: 100px 1fr 100px; grid-template-rows: 1fr 100px; padding: 20px; box-shadow: 0 0 50px rgba(0,0,0,1); }
        
        .inv-side-col { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .inv-slot { width: 60px; height: 60px; background: #1e293b; border: 2px solid #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; position: relative; }
        .inv-slot span.count { position: absolute; bottom: 2px; right: 5px; font-size: 12px; color: gold; font-weight: bold; }
        
        .inv-center { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .inv-bottom-row { grid-column: 1 / 4; display: flex; justify-content: center; gap: 10px; align-items: center; border-top: 1px solid #334155; padding-top: 10px; }
        
        .btn-close { background: #ef4444; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-action { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* HUD */
        #hud { position: fixed; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 15px; border: 2px solid #3b82f6; z-index: 5000; }
        #arena_scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: url('./arena_innen.png') no-repeat center; background-size: cover; display: none; z-index: 50000; }
        .market-item { background: #1e293b; padding: 10px; border-radius: 8px; margin: 5px 0; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png'); z-index:11;" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div class="building" style="left:1200px; top:750px; width:220px; height:220px; background-image:url('./marktplatz.png'); z-index:15;" onclick="event.stopPropagation(); openBuilding('markt')"><div class="label">Marktplatz</div></div>
        <div class="building" style="left:400px; top:300px; width:250px; height:250px; background-image:url('./rathaus.png'); z-index:11;" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Rathaus</div></div>
        <div class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png'); z-index:12;" onclick="event.stopPropagation(); openBuilding('schmiede')"><div class="label">Schmiede</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:gold; font-weight:bold;">👑 <span id="playerName">Lädt...</span></div>
    <div style="font-size:11px;">❤️ HP: <span id="hpC">100</span> | ⚔️ ATK: <span id="atkC">12</span></div>
    <button class="btn-action" style="font-size:10px; width:100%; margin-top:5px;" onclick="openBuilding('inventar')">🎒 Inventar</button>
</div>

<div id="invModal" class="modal">
    <div class="mmo-inv">
        <div class="inv-side-col">
            <div class="inv-slot">🪖</div>
            <div class="inv-slot">🛡️</div>
            <div class="inv-slot">🧥</div>
            <div class="inv-slot">👞</div>
            <div class="inv-slot">💍</div>
        </div>
        
        <div class="inv-center">
            <div style="font-size:100px;" id="invAvatar">🥚</div>
            <h2 id="invName" style="color:gold; margin:10px 0;">Held</h2>
            <button class="btn-close" onclick="toggleModal('invModal', false)">Schließen</button>
        </div>
        
        <div class="inv-side-col">
            <div class="inv-slot">💎<span class="count" id="invLXP">0</span></div>
            <div class="inv-slot">👑<span class="count">1</span></div>
            <div class="inv-slot">🦴<span class="count" id="invBone">0</span></div>
            <div class="inv-slot">🟢<span class="count" id="invSlime">0</span></div>
            <div class="inv-slot">🩸<span class="count" id="invBlood">0</span></div>
        </div>
        
        <div class="inv-bottom-row" id="invBag">
            <div class="inv-slot" id="slot_stein">🪨<span class="count" id="count_stein">0</span></div>
            <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
            <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
        </div>
    </div>
</div>

<div id="marketModal" class="modal">
    <div class="menu-box">
        <h2 style="color:gold;">⚖️ MARKTPLATZ</h2>
        <div style="display:flex; gap:10px; justify-content:center; margin-bottom:15px;">
            <button class="btn-action" onclick="showMarketTab('sell')">Dorf-Handel</button>
            <button class="btn-action" onclick="showMarketTab('buy')">Auktionshaus (PvP)</button>
        </div>
        <div id="marketContent"></div>
        <br><button class="btn-action" onclick="toggleModal('marketModal', false)">Schließen</button>
    </div>
</div>

<div id="rathausModal" class="modal">
    <div class="menu-box">
        <h2 style="color:gold;">🏆 RATHAUS - BESTENLISTE</h2>
        <div id="leaderboardContent">Lade Helden...</div>
        <br><button class="btn-action" onclick="toggleModal('rathausModal', false)">Schließen</button>
    </div>
</div>

<div id="schmiedeModal" class="modal">
    <div class="menu-box">
        <h2 style="color:gold;">⚒️ SCHMIEDE</h2>
        <div style="background:#1e293b; padding:15px; border-radius:15px; border:1px solid gold;">
            <span>🦴 Knochendolch (+5 ATK)</span><br>
            <button class="btn-action" onclick="craftEquipment('dagger', {bone:5, slime:2}, 5)">Schmieden</button>
        </div>
        <br><button class="btn-action" onclick="toggleModal('schmiedeModal', false)">Schließen</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8",
  authDomain: "thenest-81de6.firebaseapp.com",
  databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com",
  projectId: "thenest-81de6",
  storageBucket: "thenest-81de6.firebasestorage.app",
  messagingSenderId: "785821659645",
  appId: "1:785821659645:web:684460a421d3c9dcaee994"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = JSON.parse(localStorage.getItem('nestData')) || {
    name: "Held", x: 960, y: 540, stein: 0, gras: 0, slime: 0, bone: 0, blood: 0, trank: 0, lxp: 0, hp: 100, atk: 12, emoji: "🥚"
};

let otherPlayers = {};
let marketListings = {};
let zoom = 1.0;

window.onbeforeunload = () => { db.ref('players/' + data.name.replace(/\s+/g, '_')).remove(); };
db.ref('players').on('value', snap => { otherPlayers = snap.val() || {}; render(); updateLeaderboard(); });
db.ref('market').on('value', snap => { marketListings = snap.val() || {}; });

function sync() { db.ref('players/' + data.name.replace(/\s+/g, '_')).set(data); }

function render() {
    const layer = document.getElementById('charLayer');
    layer.innerHTML = '';
    for (let id in otherPlayers) {
        const p = otherPlayers[id];
        const isMe = (p.name === data.name);
        const avatar = document.createElement('div');
        avatar.className = 'creature';
        avatar.style.left = p.x + "px"; avatar.style.top = p.y + "px";
        avatar.style.zIndex = isMe ? "2000" : "1000";
        avatar.style.transform = `translate(-50%, -50%) scale(${1/zoom})`;
        avatar.innerHTML = `<span class="avatar-emoji">${p.emoji}</span><div class="name-tag" style="${isMe?'border-color:gold;':''}">${p.name} (ATK:${p.atk || 12})</div>`;
        layer.appendChild(avatar);
    }
}

function openBuilding(b) {
    if(b === 'steinbruch') toggleModal('marketModal', true); // Oder Steinbruch-Modal
    else if(b === 'markt') { toggleModal('marketModal', true); showMarketTab('sell'); }
    else if(b === 'rathaus') toggleModal('rathausModal', true);
    else if(b === 'schmiede') toggleModal('schmiedeModal', true);
    else if(b === 'inventar') {
        toggleModal('invModal', true);
        updateInvUI();
    }
}

function updateInvUI() {
    document.getElementById('invName').innerText = data.name;
    document.getElementById('invAvatar').innerText = data.emoji;
    document.getElementById('invLXP').innerText = data.lxp;
    document.getElementById('invBone').innerText = data.bone;
    document.getElementById('invSlime').innerText = data.slime;
    document.getElementById('invBlood').innerText = data.blood;
    document.getElementById('count_stein').innerText = data.stein;
}

function showMarketTab(tab) {
    const content = document.getElementById('marketContent');
    if(tab === 'sell') {
        content.innerHTML = `<h3>An Dorf verkaufen</h3><div class="market-item"><span>10 Steine ➔ 5 LXP</span><button class="btn-action" onclick="sell('stein', 10, 5)">Verkaufen</button></div>`;
    } else {
        content.innerHTML = `<h3>Spieler-Auktionshaus</h3>`;
        for(let key in marketListings) {
            let item = marketListings[key];
            content.innerHTML += `<div class="market-item"><span>${item.seller}: ${item.type}</span><button class="btn-action" onclick="buy('${key}')">${item.price} LXP</button></div>`;
        }
        content.innerHTML += `<hr><button class="btn-action" onclick="list('trank', 20)">🧪 Trank für 20 LXP inserieren</button>`;
    }
}

function sell(item, qty, rew) { if(data[item] >= qty) { data[item] -= qty; data.lxp += rew; save(); sync(); showMarketTab('sell'); } }
function list(type, price) { if(data[type] >= 1) { data[type]--; db.ref('market').push({seller: data.name, type: type, price: price}); save(); sync(); showMarketTab('buy'); } }
function buy(key) {
    const item = marketListings[key];
    if(data.lxp >= item.price) {
        data.lxp -= item.price; data[item.type] = (data[item.type] || 0) + 1;
        db.ref('players/' + item.seller.replace(/\s+/g, '_') + '/lxp').transaction(c => (c || 0) + item.price);
        db.ref('market/' + key).remove();
        save(); sync(); showMarketTab('buy');
    }
}

function updateLeaderboard() {
    let sorted = Object.values(otherPlayers).sort((a,b) => (b.atk||0) - (a.atk||0)).slice(0,5);
    let html = "";
    sorted.forEach((p, i) => html += `<div class="market-item">#${i+1} ${p.name} - ${p.atk||12} ATK</div>`);
    document.getElementById('leaderboardContent').innerHTML = html;
}

function handleWorldClick(e) {
    const rect = document.getElementById('world').getBoundingClientRect();
    data.x = (e.clientX - rect.left) / zoom;
    data.y = (e.clientY - rect.top) / zoom;
    save(); sync();
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
function updateUI() {
    document.getElementById('playerName').innerText = data.name;
    document.getElementById('hpC').innerText = data.hp;
    document.getElementById('atkC').innerText = data.atk;
}
function save() { localStorage.setItem('nestData', JSON.stringify(data)); updateUI(); }

window.onload = () => {
    const p = new URLSearchParams(window.location.search);
    if(p.get('user')) data.name = p.get('user');
    updateUI();
};
</script>
</body>
</html>
