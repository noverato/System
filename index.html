<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 – RPG Nest</title>

<style>
body{
    margin:0;
    background:#050a05 !important;
    font-family:Verdana, sans-serif;
    overflow:hidden;
    color:white;
}

/* UI Columns */
#uiLeft, #uiRight{
    position:fixed;
    top:0;
    bottom:0;
    width:220px;
    background:#0c140c;
    padding:10px;
    z-index:200;
}
#uiLeft{ left:0; border-right:2px solid #2c3f2c; }
#uiRight{ right:0; border-left:2px solid #2c3f2c; }

/* World */
#world{
    position:absolute;
    left:220px;
    right:220px;
    top:0;
    bottom:0;
    overflow:hidden;
}
#forest{
    position:absolute;
    width:100%;
    height:100%;
    background:#0b180b;
    z-index:0;
}

/* Village */
#village{
    position:absolute;
    width:600px;
    height:600px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#3e5c2f;
    border-radius:50%;
    border:10px solid #5d4037;
    box-shadow: inset 0 0 30px #2a1b10;
    z-index:10;
}

/* Paths */
.path{
    position:absolute;
    background:#7b5a2b;
    z-index:9;
}
#pathNorth{ width:60px; height:200px; left:50%; top:-200px; transform:translateX(-50%);}
#pathSouth{ width:60px; height:200px; left:50%; bottom:-200px; transform:translateX(-50%);}
#pathWest{ height:60px; width:200px; left:-200px; top:50%; transform:translateY(-50%);}
#pathEast{ height:60px; width:200px; right:-200px; top:50%; transform:translateY(-50%);}

/* Buildings */
.building{
    position:absolute;
    width:90px;
    height:90px;
    background:#6d4c41;
    border:3px solid #2a1b10;
    border-radius:8px;
    text-align:center;
    line-height:90px;
    font-size:40px;
    z-index:20;
    cursor:pointer;
}
#forge{ left:120px; top:220px;}
#market{ right:120px; top:220px;}

/* Trees */
.tree{
    position:absolute;
    font-size:28px;
    z-index:1;
}

/* Eggs */
.egg{
    position:absolute;
    font-size:22px;
    z-index:50;
    transition: left 6s linear, top 6s linear;
}

/* Name tag */
.nameTag{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    background:rgba(0,0,0,0.6);
    padding:2px 6px;
    border-radius:6px;
    white-space:nowrap;
    z-index:60;
    pointer-events:none;
}

/* Overlay UI */
.overlay{
    position:absolute;
    width:400px;
    height:300px;
    background:#1a1f1a;
    border:3px solid gold;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:300;
    display:none;
    padding:15px;
}
.overlay button{
    position:absolute;
    top:5px;
    right:5px;
}

/* Boss */
#boss{
    position:absolute;
    font-size:100px;
    display:none;
    z-index:5;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="uiLeft">
    <h3>🥚 Spawn2909</h3>
    Name: Spawn2909<br>
    Rang: Ei<br><br>

    <h4>🎒 Inventar</h4>
    <div id="inventory">🗡️ 🧪 🌿</div>
</div>

<div id="uiRight">
    <h3>📜 Dorf</h3>
    Follower: <span id="followerCount">0</span><br>
    Dorf-Level: <span id="villageLevel">0</span><br>
    Bosse besiegt: <span id="bossKills">0</span>
</div>

<div id="world">
    <div id="forest"></div>
    <div id="boss">🐲</div>

    <div id="village">
        <div id="pathNorth" class="path"></div>
        <div id="pathSouth" class="path"></div>
        <div id="pathWest" class="path"></div>
        <div id="pathEast" class="path"></div>

        <div id="forge" class="building">⚒️</div>
        <div id="market" class="building">🏪</div>
    </div>
</div>

<!-- Overlays -->
<div id="forgeUI" class="overlay">
    <button onclick="closeUI()">X</button>
    <h3>⚒️ Schmiede</h3>
    <button onclick="addItem('🗡️')">Schwert kaufen</button><br><br>
    <button onclick="addItem('🛡️')">Rüstung kaufen</button>
</div>

<div id="marketUI" class="overlay">
    <button onclick="closeUI()">X</button>
    <h3>🏪 Marktplatz</h3>
    <button onclick="buyPotion()">🧪 Trank kaufen</button>
</div>

<script>
const forest = document.getElementById("forest");
const village = document.getElementById("village");
const boss = document.getElementById("boss");
const inventory = document.getElementById("inventory");
const bossKills = document.getElementById("bossKills");

let activeEggs = {};   // name -> egg element

/* =============================
   🌲 Forest
============================= */
function createForest(){
    for(let i=0;i<300;i++){
        const t=document.createElement("div");
        t.className="tree";
        t.textContent=Math.random()>0.5?"🌲":"🌳";
        t.style.left=Math.random()*window.innerWidth+"px";
        t.style.top=Math.random()*window.innerHeight+"px";
        forest.appendChild(t);
    }
}

/* =============================
   🥚 Egg System
============================= */
function spawnEgg(name){
    if(activeEggs[name]) return; // Dubletten verhindern

    const e=document.createElement("div");
    e.className="egg";
    e.textContent="🥚";
    e.xp = 0;

    const tag=document.createElement("span");
    tag.className="nameTag";
    tag.textContent=name;
    e.appendChild(tag);

    forest.appendChild(e);
    activeEggs[name] = e;

    updateStats();

    setInterval(()=>{
        e.xp++;
        if(e.xp>100) e.textContent="💀";
        else if(e.xp>50) e.textContent="💧";
        e.appendChild(tag);
    },10000);

    moveEgg(e);
}

function moveEgg(e){
    setInterval(()=>{
        const v=village.getBoundingClientRect();
        let x,y;
        if(Math.random()<0.7){
            x=v.left+Math.random()*v.width;
            y=v.top+Math.random()*v.height;
        }else{
            x=Math.random()*window.innerWidth;
            y=Math.random()*window.innerHeight;
        }
        e.style.transitionDuration = (5+Math.random()*3)+"s";
        e.style.left=x+"px";
        e.style.top=y+"px";
    },6000);
}

/* =============================
   📊 Stats
============================= */
function updateStats(){
    const count = Object.keys(activeEggs).length;
    document.getElementById("followerCount").textContent = count;
    document.getElementById("villageLevel").textContent = Math.floor(count/2);
}

/* =============================
   🧙 UI
============================= */
forge.onclick=()=>{ document.getElementById("forgeUI").style.display="block"; }
market.onclick=()=>{ document.getElementById("marketUI").style.display="block"; }
function closeUI(){
    document.querySelectorAll(".overlay").forEach(o=>o.style.display="none");
}
function addItem(icon){ inventory.innerHTML += " " + icon; }
function buyPotion(){ addItem("🧪"); alert("Trank gekauft!"); }

/* =============================
   🐲 Boss
============================= */
let kills=0;
boss.onclick=()=>{
    kills++;
    bossKills.textContent=kills;
    boss.style.display="none";
    setTimeout(()=>{ boss.style.display="block"; },10000);
};
setInterval(()=>{
    boss.style.display="block";
    boss.style.left=Math.random()*window.innerWidth+"px";
    boss.style.top=Math.random()*window.innerHeight+"px";
},30000);

/* =============================
   🔌 Streamer.bot WebSocket
============================= */
const ws = new WebSocket("ws://127.0.0.1:8080/");

ws.onopen = () => {
    console.log("🟢 Connected to streamer.bot");
};

ws.onmessage = (event) => {
    try{
        const data = JSON.parse(event.data);

        // streamer.bot sends many events – we extract any username we can find
        if(data?.event?.user){
            spawnEgg(data.event.user);
        }
        if(data?.data?.userName){
            spawnEgg(data.data.userName);
        }
        if(data?.data?.displayName){
            spawnEgg(data.data.displayName);
        }

    }catch(e){
        console.log("Non-JSON message:", event.data);
    }
};

/* =============================
   Init
============================= */
createForest();
</script>

</body>
</html>
