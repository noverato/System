<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Overlord Edition 2026 - Divine Bridge Build</title>
    <style>
        :root { 
            --fantasy-bg: rgba(25, 15, 10, 0.98); 
            --gold: #ffd700; --border: 2px solid #ffd700; 
            --shadow: 0 0 25px rgba(255, 215, 0, 0.6); 
            --btn-grad: linear-gradient(135deg, #b8860b, #8b4513); 
            --hp-color: #ff4444; --mp-color: #3b82f6;
            --warrior: #ef4444; --mage: #3b82f6; --ranger: #22c55e; --craft: #eab308; --shadow-path: #a855f7;
            --ff-blue: rgba(0, 0, 150, 0.9);
        }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; cursor: crosshair; }
        #charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        
        .creature { 
            position: absolute; 
            width: 80px; 
            height: 100px; 
            text-align: center; 
            transform: translate(-50%, -50%); 
            transition: all 0.6s ease-out; 
            pointer-events: auto; 
        }
        
        .creature img { height: 80px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
        .name-tag { font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 12px; border-radius: 6px; border: 1px solid var(--gold); margin-top: 5px; white-space: nowrap; }
        .boss-aura { border: 2px solid #ff0000 !important; color: #ff0000 !important; box-shadow: 0 0 20px #ff0000; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        
        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 200px; box-shadow: var(--shadow); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .mmo-panel { width: 1250px; height: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; box-shadow: var(--shadow); }
        .panel-main { flex: 3; padding: 20px; overflow-y: auto; position: relative; }
        .panel-side { flex: 0.8; padding: 25px; background: rgba(20, 15, 10, 0.85); border-left: 2px solid var(--gold); display: flex; flex-direction: column; }
        
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-action:hover:not(:disabled) { filter: brightness(1.2); transform: scale(1.05); }
        .btn-action:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(1); }

        #battleInvite { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--ff-blue); border: 3px solid #fff; padding: 30px; z-index: 30000; display: none; text-align: center; box-shadow: 0 0 50px #000; border-radius: 15px; }

        #arenaStage { width: 100%; height: 100%; background: url('./arena_innen.png') no-repeat center; background-size: cover; position: relative; display: flex; align-items: center; justify-content: space-around; overflow: hidden; }
        .combatant-wrap { display: flex; flex-direction: column; align-items: center; width: 300px; z-index: 5; }
        .combatant-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 15px rgba(0,0,0,0.5)); }
        #ffMenu { position: absolute; bottom: 0; left: 0; width: 100%; height: 220px; background: var(--ff-blue); border-top: 4px solid #fff; display: flex; box-sizing: border-box; }
        .ff-buttons { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
        .ff-status { flex: 1.2; padding: 20px; border-left: 2px solid #fff; display: flex; flex-direction: column; justify-content: center; }
        .bar-wrap { height: 18px; background: #000; border: 2px solid #fff; border-radius: 4px; overflow: hidden; margin-bottom: 10px; position: relative; }
        
        #playerHpFill { background: linear-gradient(to right, #8a2be2, #4b0082) !important; box-shadow: 0 0 15px #8a2be2; height: 100%; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #enemyHpFill { background: linear-gradient(to right, #ff4500, #ff0000) !important; box-shadow: 0 0 15px #ff4500; height: 100%; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .evo-choice-box { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .evo-card { background: rgba(0,0,0,0.5); border: 1px solid gold; padding: 20px; border-radius: 10px; text-align: center; width: 200px; cursor: pointer; transition: 0.3s; }
        .evo-card:hover { transform: translateY(-10px); background: rgba(255,215,0,0.1); }
    </style>

function checkTwitchAuth() {
    const hash = window.location.hash.substring(1);
    if (!hash) return false;
    const params = new URLSearchParams(hash);
    if (params.has("access_token")) {
        twitchToken = params.get("access_token");
        window.history.replaceState({}, document.title, window.location.pathname);
        return true;
    }
    return false;
}

function redirectToTwitch() {
    const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=moderator:read:followers`;
    window.location.href = authUrl;
}

async function initTwitchSession() {
    if (!twitchToken) return;
    try {
        const resp = await fetch(`https://api.twitch.tv/helix/users`, {
            headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${twitchToken}` }
        });
        const result = await resp.json();
        if (result.data && result.data.length > 0) {
            const twitchUser = result.data[0];
            verifiedID = twitchUser.id; 
            data.name = twitchUser.display_name;
            isIdentified = true; 
            isAdmin = (verifiedID === BROADCASTER_ID); 
            await loadUserData(); 
            await validateTwitchFollower(verifiedID);
            updateBaseStats(); 
        }
    } catch (err) { console.error("Twitch Session Error:", err); }
    updateUI();
}

async function validateTwitchFollower(userID) {
    try {
        const followUrl = `https://api.twitch.tv/helix/channels/followers?broadcaster_id=${BROADCASTER_ID}&user_id=${userID}`;
        const resp = await fetch(followUrl, {
            headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${twitchToken}` }
        });
        const followData = await resp.json();
        if (followData.data && followData.data.length > 0) {
            data.isFollower = true;
            const followDate = new Date(followData.data[0].followed_at);
            data.followDays = Math.ceil(Math.abs(new Date() - followDate) / (1000 * 60 * 60 * 24));
        } else {
            data.isFollower = false;
        }
    } catch (err) { console.error("Follow Check Error:", err); }
    finally {
        isLoadingFollower = false;
        updateUI();
    }
}

async function loadUserData() {
    if (!verifiedID) return;
    try {
        const snapshot = await db.ref('players/' + verifiedID).once('value');
        if (snapshot.exists()) {
            const dbData = snapshot.val();
            data.lxp = dbData.lxp || 0;
            data.stats = dbData.stats || data.stats;
            data.inventar = dbData.inventar || {};
            data.hp = dbData.hp || data.maxHp;
            data.maxHp = dbData.maxHp || data.maxHp;
            data.x = dbData.x || 960;
            data.y = dbData.y || 540;
        }
    } catch (err) { console.error("Load Error:", err); }
    updateUI();
}

function save() {
    if (!isIdentified || !verifiedID || isLoadingFollower) return;
    updateBaseStats(); 
    updateUI(); 
    db.ref('players/' + verifiedID).update({
        hp: data.hp, maxHp: data.maxHp, lxp: data.lxp, x: data.x, y: data.y, name: data.name,
        stats: data.stats, inventar: data.inventar, 
        isFollower: data.isFollower, followDays: data.followDays, 
        battleAction: data.battleAction, battleReady: data.battleReady, hidden: data.hidden,
        lastSeen: Date.now()
    });
}

function updateUI() {
    isAdmin = (verifiedID === BROADCASTER_ID);
    document.getElementById('playerName').innerText = isAdmin ? "OVERLORD Spawn2909" : (isLoadingFollower ? "Magie wirkt..." : data.name);
    let title = data.stats.className || "Novize";
    document.getElementById('hudClass').innerText = isAdmin ? "SYSTEM-ARCHITEKT" : title;
    document.getElementById('lxpC').innerText = data.lxp;
    document.getElementById('lvlTotal').innerText = data.stats.currentLevel;
    document.getElementById('followDaysDisplay').innerText = data.followDays;
    const followDisplay = document.getElementById('isFollower');
    followDisplay.innerText = isLoadingFollower ? "Prüfe..." : (data.isFollower ? "Ja" : "Nein");
    
    if(isAdmin) document.getElementById('adminHud').style.display = 'block';
    else document.getElementById('adminHud').style.display = 'none';

    const invDiv = document.getElementById('miniInv'); invDiv.innerHTML = '';
    if(data.inventar) {
        Object.keys(data.inventar).forEach(i => { if(data.inventar[i]>0) invDiv.innerHTML += `<div style="padding:5px; border-bottom:1px solid #444;">${i} x${data.inventar[i]}</div>`; });
    }
}

function exitGame() {
    if(verifiedID) {
        db.ref('players/' + verifiedID).remove().then(() => {
            localStorage.removeItem('nestData');
            location.href = REDIRECT_URI;
        });
    }
}

function renderPlayers(players) {
    const layer = document.getElementById('charLayer'); layer.innerHTML = '';
    Object.keys(players).forEach(id => {
        const p = players[id];
        if (p.hidden || !p.name || (Date.now() - (p.lastSeen || 0) > 60000)) return;
        const div = document.createElement('div'); 
        div.className = 'creature';
        div.setAttribute('data-id', id); 
        div.style.left = p.x + "px"; 
        div.style.top = p.y + "px";
        const isBoss = (id === BROADCASTER_ID);
        const imgIdx = Math.min(Math.max((p.stats?.totalEvoLevel || 0), 0), 6);
        const imgSrc = isBoss ? 'Overlord.png' : EVO_IMGS[imgIdx];
        div.innerHTML = `<img src="${imgSrc}" onerror="this.src='Ei.png'"><div class="name-tag ${isBoss?'boss-aura':''}">${isBoss?'OVERLORD':p.name}</div>`;
        layer.appendChild(div);
    });
}

function listenForChallenges() {
    if (!verifiedID) return;
    db.ref('battles').on('value', snap => {
        const allBattles = snap.val() || {};
        if (activeBattleID) {
            const b = allBattles[activeBattleID];
            if (!b || b.status === 'finished') {
                activeBattleID = null; currentEnemy = null; isActionLocked = false;
                toggleModal('gameModal', false); return;
            }
        }
        Object.keys(allBattles).forEach(bID => {
            const battle = allBattles[bID];
            if (battle.defenderID === verifiedID && battle.status === 'pending' && !activeBattleID) {
                document.getElementById('battleInvite').style.display = 'block';
                document.getElementById('inviteText').innerText = battle.attackerName + " fordert dich!";
                document.getElementById('btnAcceptInvite').onclick = () => {
                    db.ref('battles/' + bID).update({ status: 'active' });
                    document.getElementById('battleInvite').style.display = 'none';
                };
            }
            if ((battle.attackerID === verifiedID || battle.defenderID === verifiedID) && battle.status === 'active') {
                if (!currentEnemy || activeBattleID !== bID) {
                    activeBattleID = bID;
                    const oppID = (battle.attackerID === verifiedID) ? battle.defenderID : battle.attackerID;
                    if(onlinePlayers[oppID]) {
                        toggleModal('gameModal', true);
                        startCombat(onlinePlayers[oppID], false, oppID);
                        db.ref(`battles/${bID}/actions/${verifiedID}`).update({ inArena: true });
                    }
                }
            }
        });
    });
}

function startCombat(enemy, isMonster, enemyID = null) {
    if(document.getElementById('gameModal').style.display !== 'flex') toggleModal('gameModal', true);
    isActionLocked = false;
    healsUsedInCombat = 0; 
    if (isMonster) {
        const baseAtk = 25;
        const variation = 0.9 + Math.random() * 0.2; 
        currentEnemy = { 
            name: "Waldschleim", hp: 50, maxHp: 50, 
            atk: Math.floor(baseAtk * variation), 
            def: 10, isMonster: true, img: 'Monster1.png' 
        };
    } else {
        const isBoss = (enemyID === BROADCASTER_ID);
        currentEnemy = { ...enemy, id: enemyID, isMonster: false, img: (isBoss ? 'Overlord.png' : EVO_IMGS[enemy.stats?.totalEvoLevel || 0]) };
    }
    renderCombatStage();
}

function renderCombatStage() {
    const left = document.getElementById('modalLeft');
    const myImg = (isAdmin ? 'Overlord.png' : EVO_IMGS[data.stats?.totalEvoLevel || 0]);
    left.innerHTML = `<div id="arenaStage">
        <div class="combatant-wrap">
            <img src="${myImg}" onerror="this.src='Ei.png'" class="combatant-img">
            <br><strong>${data.name}</strong>
            <div style="font-size:12px; color:gold;">⚔️ ATK: ${isAdmin ? 999 : data.stats.atk} | 🛡️ DEF: ${data.stats.def}</div>
        </div>
        <div class="combatant-wrap">
            <img src="${currentEnemy.img || 'Monster1.png'}" onerror="this.src='Ei.png'" class="combatant-img">
            <br><strong>${currentEnemy.name}</strong>
            <div style="font-size:12px; color:#ff4444;">⚔️ ATK: ${currentEnemy.atk} | 🛡️ DEF: ${currentEnemy.def}</div>
        </div>
        <div id="ffMenu">
            <div class="ff-buttons">
                <button id="btnAtk" class="btn-action" onclick="executeCombatAction('attack')">ATTACKE</button>
                <button id="btnHeal" class="btn-action" onclick="executeCombatAction('heal')">HEILUNG (${3 - healsUsedInCombat})</button>
                <button class="btn-action" onclick="endCombat()">FLUCHT</button>
            </div>
            <div class="ff-status">
                <div class="bar-wrap"><div id="playerHpFill" style="width:${(data.hp/data.maxHp)*100}%;"></div></div>
                <div class="bar-wrap"><div id="enemyHpFill" style="width:${(currentEnemy.hp/currentEnemy.maxHp)*100}%;"></div></div>
            </div>
        </div>
        <div id="battleLog">Warte auf Magie...</div>
    </div>`;
}

function executeCombatAction(type) {
    if (isActionLocked) return;
    if (type === 'heal') {
        if (healsUsedInCombat >= 3) { alert("Keine Heilung mehr!"); return; }
        healsUsedInCombat++;
    }
    isActionLocked = true;
    if (currentEnemy.isMonster) {
        data.battleAction = type;
        setTimeout(resolveBattleTurn, 1200);
    } else {
        db.ref(`battles/${activeBattleID}/actions/${verifiedID}`).update({ type: type, ready: true });
    }
}

function resolveBattleTurn() {
    const playerAtk = isAdmin ? 999 : (data.stats.atk || 5);
    const playerDef = data.stats.def || 5;
    const monsterAtk = currentEnemy.atk || 20;
    const log = document.getElementById('battleLog');
    let turnReport = "";

    if (data.battleAction === 'heal') {
        const healAmt = Math.floor(data.maxHp * 0.25);
        data.hp = Math.min(data.maxHp, data.hp + healAmt);
        turnReport += `<div style="color:cyan;">Du heilst dich um ${healAmt} HP!</div>`;
    } else {
        let isCrit = Math.random() < 0.1;
        let pDmg = Math.floor(playerAtk * 0.5);
        if (isCrit) { pDmg *= 2; turnReport += `<div style="color:gold; font-weight:bold;">KRITISCHER TREFFER!</div>`; }
        currentEnemy.hp -= pDmg;
        turnReport += `<div style="color:#4ade80;">Du triffst für ${pDmg} Schaden!</div>`;
    }

    let mDmg = isAdmin ? 0 : Math.max(2, Math.floor(monsterAtk - playerDef * 0.2));
    data.hp -= mDmg;
    turnReport += `<div style="color:#ff4444;">${currentEnemy.name} trifft dich für ${mDmg} Schaden!</div>`;
    log.innerHTML = turnReport;

    let cap = (data.stats.totalEvoLevel === 0) ? 1 : (data.stats.totalEvoLevel * 30);
    if (data.stats.currentLevel < cap) data.stats.currentLevel += 2;

    setTimeout(() => {
        if (currentEnemy.hp <= 0) { 
            data.lxp += 50; 
            log.innerHTML += `<div style="color:gold;">SIEG! +50 LXP</div>`;
            setTimeout(endCombat, 1500);
        } else if (data.hp <= 0) { 
            data.hp = data.maxHp; 
            alert("Gefallen!"); endCombat(); 
        } else { isActionLocked = false; renderCombatStage(); }
    }, 2000);
}

function endCombat() {
    activeBattleID = null; currentEnemy = null; isActionLocked = false; healsUsedInCombat = 0;
    toggleModal('gameModal', false); save();
}

function closeGeneralModal() { if (activeBattleID || currentEnemy) endCombat(); else toggleModal('gameModal', false); }

function renderEvoMenu() {
    const left = document.getElementById('modalLeft');
    const curEvo = data.stats.totalEvoLevel;
    const ep = data.followDays;
    const lvl = data.stats.currentLevel;
    let html = `<div style="padding:30px; text-align:center;">
        <h2 style="color:gold; font-size:32px;">Halle der Evolution</h2>
        <p style="color:#aaa;">Form: <b style="color:cyan;">${data.stats.className}</b> | Pfad: <b style="color:cyan;">${data.stats.path}</b></p>
        <p style="color:#ffd700;">Stats: HP ${data.maxHp} | ATK ${data.stats.atk} | DEF ${data.stats.def}</p>
        <hr style="border-color:gold; margin:20px 0;">`;

    if (curEvo === 0) {
        html += `<h3>Stufe 1: Das Schlüpfen</h3><p>5.000 LXP benötigt.</p><button class="btn-action" onclick="tryEvolve(1)">SCHLÜPFEN</button>`;
    } else if (curEvo === 1) {
        html += `<h3>Stufe 2: Die Hauptklasse</h3><p>Tag 30 & Level 30 benötigt.</p><p>Status: Tag ${ep}/30 | Level ${lvl}/30</p>
                 <div class="evo-choice-box">
                    <div class="evo-card" onclick="chooseClass('Krieger')"><h4>KRIEGER</h4></div>
                    <div class="evo-card" onclick="chooseClass('Waldläufer')"><h4>WALDLÄUFER</h4></div>
                    <div class="evo-card" onclick="chooseClass('Druide')"><h4>DRUIDE</h4></div>
                    <div class="evo-card" onclick="chooseClass('Hüter')"><h4>HÜTER</h4></div>
                    <div class="evo-card" onclick="chooseClass('Sucher')"><h4>SUCHER</h4></div>
                    <div class="evo-card" onclick="chooseClass('Einsiedler')"><h4>EINSIEDLER</h4></div>
                    <div class="evo-card" onclick="chooseClass('Wächter')"><h4>WÄCHTER</h4></div>
                 </div>`;
    } else if (curEvo === 2) {
        html += `<h3>Stufe 3: Die Gesinnung</h3><p>Tag 60 & Level 60 benötigt.</p>
                 <div class="evo-choice-box">
                    <div class="evo-card" onclick="choosePath('Licht')"><h4>LICHT-PFAD</h4></div>
                    <div class="evo-card" onclick="choosePath('Dunkel')"><h4>DUNKEL-PFAD</h4></div>
                 </div>`;
    } else if (curEvo < 7) {
        const next = (curEvo) * 30;
        html += `<h3>Stufe ${curEvo + 1}: Aufstieg</h3><p>Tag ${next} & Level ${next}.</p><button class="btn-action" onclick="tryEvolve(${curEvo + 1})">EVOLVIEREN</button>`;
    } else { html += `<h2>MAXIMALSTUFE</h2>`; }
    left.innerHTML = html + `</div>`;
}

function tryEvolve(tier) {
    if (tier === 1 && data.lxp >= 5000) { data.lxp -= 5000; data.stats.totalEvoLevel = 1; updateBaseStats(); data.hp = data.maxHp; save(); renderEvoMenu(); }
    else if (tier > 1) {
        const req = tier * 30;
        if (data.followDays >= req && data.stats.currentLevel >= req) { data.stats.totalEvoLevel = tier; updateBaseStats(); save(); renderEvoMenu(); }
    }
}

function chooseClass(n) { if (data.stats.totalEvoLevel === 1) { data.stats.className = n; data.stats.totalEvoLevel = 2; updateBaseStats(); data.hp = data.maxHp; save(); renderEvoMenu(); } }
function choosePath(p) { if (data.stats.totalEvoLevel === 2) { data.stats.path = p; data.stats.totalEvoLevel = 3; updateBaseStats(); data.hp = data.maxHp; save(); renderEvoMenu(); } }

function handleWorldClick(e) { 
    if(document.getElementById('gameModal').style.display === 'flex') return; 
    const rect = document.getElementById('world').getBoundingClientRect(); 
    data.x = e.clientX - rect.left; 
    data.y = e.clientY - rect.top; 
    if(verifiedID) {
        const myChar = document.querySelector(`.creature[data-id="${verifiedID}"]`);
        if(myChar) { myChar.style.left = data.x + "px"; myChar.style.top = data.y + "px"; }
    }
    save(); 
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }

// FIX 2: openBuilding erweitert
function openBuilding(b) { 
    toggleModal('gameModal', true); 
    if (b === 'steinbruch') renderMiningMenu(); 
    else if (b === 'rathaus') renderEvoMenu(); 
    else if (b === 'arena') renderArenaMatchmaking(); 
    else if (b === 'schmiede') renderCraftingMenu();
}

function renderMiningMenu() { document.getElementById('modalLeft').innerHTML = `<div style="padding:30px;"><h2>Steinbruch</h2><button class="btn-action" onclick="startMining()">⛏️ Abbau</button></div>`; }

// FIX 3: Schmiede-Menü hinzugefügt
function renderCraftingMenu() { 
    document.getElementById('modalLeft').innerHTML = `<div style="padding:30px;"><h2>Wald-Schmiede</h2><p>Hier kannst du bald Ausrüstung herstellen.</p><button class="btn-action" disabled>Hammer schwingen (In Kürze)</button></div>`; 
}

function startMining() { 
    data.lxp += 10; 
    let cap = (data.stats.totalEvoLevel === 0) ? 1 : (data.stats.totalEvoLevel * 30);
    if (data.stats.currentLevel < cap) data.stats.currentLevel += 1;
    save(); 
}

function openAdminPanel() { 
    if (verifiedID !== BROADCASTER_ID) { alert("Zugriff verweigert!"); return; }
    toggleModal('gameModal', true); 
    document.getElementById('modalLeft').innerHTML = `
        <h2>🛠 GÖTTER-KONSOLE</h2>
        <div style="background: rgba(255,215,0,0.1); padding:15px; border:1px solid gold; border-radius:10px;">
            <p>Admin Status: <b style="color:#4ade80;">VERIFIZIERT</b></p>
            <button class="btn-action" onclick="data.followDays+=30;save();renderEvoMenu()">+30 Tage</button><br><br>
            <button class="btn-action" onclick="data.lxp+=5000;save();renderEvoMenu()">+5000 LXP</button><br><br>
            <button class="btn-action" onclick="adminAddLevel(30)">+30 Level (Cap Check)</button>
        </div>
    `; 
}

function adminAddLevel(amt) {
    let cap = (data.stats.totalEvoLevel === 0) ? 1 : (data.stats.totalEvoLevel * 30);
    data.stats.currentLevel = Math.min(cap, data.stats.currentLevel + amt);
    save();
}

function renderArenaMatchmaking() {
    document.getElementById('modalLeft').innerHTML = `<div style="padding:20px;"><h2>🛡️ Arena</h2><button class="btn-action" onclick="startCombat(null, true)">🐗 Monsterkampf</button></div>`;
}

window.onload = async () => {
    if (checkTwitchAuth()) await initTwitchSession();
    else redirectToTwitch();
    db.ref('players').on('value', snap => {
        onlinePlayers = snap.val() || {};
        renderPlayers(onlinePlayers);
        if(verifiedID && onlinePlayers[verifiedID]) updateUI();
    });
    setInterval(save, 30000);
};
</script>
