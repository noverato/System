<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn2909 - System Interface</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .system-frame {
            border: 4px solid #00c3ff;
            background: rgba(0, 30, 60, 0.8);
            box-shadow: 0 0 20px #00c3ff, inset 0 0 15px #00c3ff;
            padding: 30px;
            width: 80%;
            max-width: 600px;
            border-radius: 15px;
            text-align: center;
            position: relative;
        }
        h1 { font-size: 1.5rem; color: #00c3ff; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 2px; }
        .info-box { border: 1px solid #00c3ff; margin-bottom: 20px; padding: 10px; background: rgba(0, 195, 255, 0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stage { border: 1px solid #444; padding: 10px; font-size: 0.8rem; border-radius: 5px; color: #777; }
        /* Die aktive Stufe leuchtet blau */
        .active { border-color: #00c3ff; color: #fff; background: rgba(0, 195, 255, 0.3); box-shadow: 0 0 10px #00c3ff; }
    </style>
</head>
<body>

<div class="system-frame">
    <h1>Willkommen, <span id="userName">Jäger</span></h1>
    
    <div class="info-box">
        <div>STATUS: <span id="currentStatus" style="color:#00c3ff;">Lädt...</span></div>
        <div>LOYALITÄT: <span id="loyaltyDays">0</span> TAGE</div>
    </div>

    <div class="grid">
        <div id="stage0" class="stage">EI (0d)</div>
        <div id="stage1" class="stage">SCHLEIM (60d)</div>
        <div id="stage2" class="stage">SKELETT (90d)</div>
        <div id="stage3" class="stage">GOBLIN (180d)</div>
        <div id="stage4" class="stage">OGER (270d)</div>
        <div id="stage5" class="stage">LICH (360d)</div>
        <div id="stage6" class="stage">WESEN (720d)</div>
    </div>
</div>

<script>
    // Funktion um Daten aus dem Link zu lesen
    function updateSystem() {
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('user') || 'Spawn2909';
        const days = parseInt(urlParams.get('days')) || 0;

        document.getElementById('userName').innerText = name;
        document.getElementById('loyaltyDays').innerText = days;

        // Evolution Logik basierend auf deinen Daten [cite: 2026-01-18]
        let currentId = "stage0";
        let statusText = "EI";

        if (days >= 720) { currentId = "stage6"; statusText = "HÖHERES WESEN"; }
        else if (days >= 360) { currentId = "stage5"; statusText = "LICH"; }
        else if (days >= 270) { currentId = "stage4"; statusText = "OGER"; }
        else if (days >= 180) { currentId = "stage3"; statusText = "GOBLIN"; }
        else if (days >= 90) { currentId = "stage2"; statusText = "SKELETT"; }
        else if (days >= 60) { currentId = "stage1"; statusText = "SCHLEIM"; }

        document.getElementById(currentId).classList.add('active');
        document.getElementById('currentStatus').innerText = statusText;
    }

    updateSystem();
</script>

</body>
</html>
