<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Nest: Solo Leveling Master Edition</title>
<style>
    /* ===== BASIS DESIGN ===== */
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: #e0d8b0; touch-action: none; }
    
    #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    
    #world { 
        width: 1920px; height: 1080px; 
        background: url('wald.png') no-repeat center; 
        background-size: contain;
        position: relative;
        transform-origin: center center;
        transition: transform 0.1s ease-out;
    }

    /* CHARAKTER DESIGN */
    .creature { 
        position: absolute; width: 120px; height: 120px; z-index: 10; 
        transition: left 2s linear, top 2s linear; 
        text-align: center; pointer-events: none; 
        transform: translate(-50%, -50%); 
    }
    .avatar-emoji { font-size: 60px; display: block; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5)); }
    .weapon-layer { position: absolute; right: 10px; top: 20px; font-size: 30px; }
    .name-tag { 
        font-size: 14px; font-weight: bold; color: #fff; 
        background: rgba(0,0,0,0.7); padding: 2px 10px; 
        border-radius: 5px; display: inline-block; margin-top: 5px;
        border: 1px solid #3b82f6; white-space: nowrap;
    }

    /* MONSTER */
    .monster { position: absolute; font-size: 50px; cursor: pointer; transform: translate(-50%, -50%); z-index: 9; transition: opacity 0.3s; }

    /* UI OVERLAYS */
    .ui-overlay { position: fixed; z-index: 1000; pointer-events: auto; }
    #hud { top: 15px; left: 15px; background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 12px; border: 1px solid #3b82f6; backdrop-filter: blur(8px); }
    #battleLog { bottom: 90px; left: 15px; width: 240px; height: 120px; background: rgba(10,15,25,0.95); border: 1px solid #3b82f6; border-radius: 10px; padding: 10px; font-size: 11px; overflow-y: auto; display: none; color: white; }
    .inv-btn { bottom: 25px; right: 25px; padding: 18px 35px; background: #2563eb; color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

    /* MODAL / INVENTAR / KLASSENWAHL */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 2000; align-items: center; justify-content: center; }
    .inv-box { width: 90%; max-width: 400px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border: 2px solid #3b82f6; border-radius: 20px; padding: 30px; text-align: center; }
    .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
    .class-card { background: #020617; border: 1px solid #334155; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .class-card:hover { border-color: #3b82f6; background: #0f172a; }
</style>
</head>
<body>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div id="charLayer"></div>
        <div id="monsterLayer"></div>
    </div>
</div>

<div class="ui-overlay" id="hud">
    <div style="font-weight: bold; color: #3b82f6; font-size: 18px;"><span id="playerNameDisplay">Abenteurer</span></div>
    <div style="font-size: 11px; color: #94a3b8;">Klasse: <span id="classDisplay">Ei</span></div>
    <div style="font-size: 12px; margin-top:5px;">✨ LXP: <span id="lxpDisplay">0</span> | 📈 EP: <span id="epDisplay">0</span></div>
</div>

<div class="ui-overlay" id="battleLog"></div>

<button class="ui-overlay inv-btn" onclick="toggleInv(true)">🎒 INVENTAR</button>

<div id="invModal" class="modal">
    <div class="inv-box">
        <h2 style="color:#facc15; margin-top:0;">STATUS</h2>
        <div id="invPlayerName" style="font-weight:bold; margin-bottom:10px; color:white;">-</div>
        <div style="font-size: 60px; margin-bottom: 20px;" id="invAvatar">🥚</div>
        
        <div id="classChoiceArea" style="display:none;">
            <p style="color:#facc15; font-size:12px; font-weight:bold;">WÄHLE DEINE KLASSE:</p>
            <div class="class-grid">
                <div class="class-card" onclick="chooseClass('Krieger', '🗡️')">🗡️ Krieger</div>
                <div class="class-card" onclick="chooseClass('Magier', '🪄')">🪄 Magier</div>
                <div class="class-card" onclick="chooseClass('Waldläufer', '🏹')">🏹 Waldläufer</div>
                <div class="class-card" onclick="chooseClass('Dunkel-Elf', '🌑')">🌑 Dunkel-Elf</div>
            </div>
        </div>

        <button id="craftBtn" onclick="tryCraft()" style="width:100%; padding:15px; background:#eab308; border:none; border-radius:10px; font-weight:bold; display:none;">🗡️ SCHWERT SCHMIEDEN (20 LXP)</button>
        <br><br>
        <button onclick="toggleInv(false)" style="width:100%; padding:10px; background:#475569; color:white; border:none; border-radius:10px;">ZURÜCK</button>
    </div>
</div>

<script>
// --- SPEICHER & STATE ---
let data = JSON.parse(localStorage.getItem('nestData')) || {
    name: "Held", lxp: 0, ep: 0, x: 960, y: 540,
    currentClass: "Ei", emoji: "🥚", hasSword: false, equipped: false, hasChosen: false
};

let zoom = 1.0;
const world = document.getElementById('world');

// --- ZOOM FUNKTION ---
window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    zoom = Math.min(Math.max(zoom + delta, 0.3), 3.0);
    world.style.transform = `scale(${zoom})`;
}, { passive: false });

// --- INITIALISIERUNG ---
function init() {
    const p = new URLSearchParams(window.location.search);
    const user = p.get('user');
    if (user) data.name = user;

    updateUI();
    setInterval(spawnMonster, 20000);
}

function updateUI() {
    // Evolutions-Check
    if (!data.hasChosen) {
        if (data.ep >= 50) {
            data.currentClass = "Bereit zur Wahl";
        } else if (data.ep >= 20) {
            data.currentClass = "Gras-Wesen";
            data.emoji = "🌱";
        }
    }

    // UI Texte
    const safeName = (data.name && data.name !== "undefined") ? data.name : "Held";
    document.getElementById('playerNameDisplay').textContent = safeName;
    document.getElementById('classDisplay').textContent = data.currentClass;
    document.getElementById('lxpDisplay').textContent = Math.floor(data.lxp);
    document.getElementById('epDisplay').textContent = Math.floor(data.ep);
    
    document.getElementById('invPlayerName').textContent = safeName;
    document.getElementById('invAvatar').textContent = data.emoji;
    
    // Buttons steuern
    document.getElementById('craftBtn').style.display = (data.lxp >= 20 && !data.hasSword) ? "block" : "none";
    document.getElementById('classChoiceArea').style.display = (data.ep >= 50 && !data.hasChosen) ? "block" : "none";

    renderChar();
}

function renderChar() {
    const layer = document.getElementById('charLayer');
    layer.innerHTML = '';
    const char = document.createElement('div');
    char.className = 'creature';
    char.style.left = data.x + "px"; 
    char.style.top = data.y + "px";
    
    const safeName = (data.name && data.name !== "undefined") ? data.name : "Held";
    
    char.innerHTML = `
        <span class="avatar-emoji">${data.emoji}</span>
        ${data.equipped ? '<span class="weapon-layer">🗡️</span>' : ''}
        <div class="name-tag">${safeName}</div>
    `;
    layer.appendChild(char);
}

function handleWorldClick(e) {
    const rect = world.getBoundingClientRect();
    data.x = (e.clientX - rect.left) / zoom;
    data.y = (e.clientY - rect.top) / zoom;
    save();
}

function spawnMonster() {
    if (document.querySelectorAll('.monster').length > 3) return;
    const m = document.createElement('div');
    m.className = 'monster';
    m.style.left = (Math.random() * 1600 + 100) + "px";
    m.style.top = (Math.random() * 800 + 100) + "px";
    m.innerHTML = "👾";
    m.onclick = (e) => {
        e.stopPropagation();
        startBattle(m);
    };
    document.getElementById('monsterLayer').appendChild(m);
}

function startBattle(mEl) {
    const log = document.getElementById('battleLog');
    log.style.display = "block";
    log.innerHTML = "<b>KAMPF...</b><br>";
    let mHP = 30;
    const i = setInterval(() => {
        const dmg = data.equipped ? 10 : 3;
        mHP -= dmg;
        log.innerHTML += `<div>> Treffer: ${dmg} DMG</div>`;
        log.scrollTop = log.scrollHeight;
        if(mHP <= 0) {
            clearInterval(i);
            data.lxp += 10; data.ep += 5; save();
            mEl.remove();
            log.innerHTML = "<b>SIEG! +10 LXP</b>";
            setTimeout(() => log.style.display="none", 2000);
        }
    }, 1000);
}

function chooseClass(name, emoji) {
    data.currentClass = name;
    data.emoji = emoji;
    data.hasChosen = true;
    save();
    alert("Du bist nun ein " + name + "!");
}

function tryCraft() {
    if(data.lxp >= 20) {
        data.lxp -= 20; data.hasSword = true; data.equipped = true;
        save();
        alert("Schwert geschmiedet!");
    }
}

function toggleInv(s) { document.getElementById('invModal').style.display = s ? 'flex' : 'none'; }
function save() { localStorage.setItem('nestData', JSON.stringify(data)); updateUI(); }

window.onload = init;
</script>
</body>
</html>
