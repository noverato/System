<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isekai Village - The Nest: Custom Gear Edition</title>
<style>
    /* ===== BASE & PROTECTION ===== */
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #e0d8b0; background: #0a0a12; }
    #watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600"><text x="50%" y="50%" font-family="Arial" font-size="36" fill="%23ffffff" fill-opacity="0.08" text-anchor="middle" transform="rotate(-15 500 300)">Property of Spawn2909 - The Nest</text></svg>'); z-index: 5; pointer-events: none; }
    #gameWorld { position: absolute; width: 100%; height: 100%; background-image: url('wald.png'); background-size: 100% 100%; z-index: 1; }

    /* ===== CREATURES & EQUIPMENT LAYERS ===== */
    .creature { position: absolute; width: 85px; height: 85px; z-index: 10; transition: left 2.5s ease-in-out, top 2.5s ease-in-out; cursor: pointer; }
    .creature-base { width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; position: relative; }
    
    /* Der Ausrüstungs-Layer (Schwert, Hut, etc.) */
    .equipment-layer { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        background-size: contain; background-repeat: no-repeat; background-position: center;
        pointer-events: none; z-index: 12; 
    }

    .name-tag { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 11px; font-weight: bold; color: #ffeb3b; text-shadow: 2px 2px 4px black; }

    /* ===== UI PANELS ===== */
    .ui-panel { position: absolute; background: rgba(18, 22, 30, 0.95); border: 1px solid rgba(184, 134, 11, 0.7); border-radius: 8px; padding: 12px; z-index: 100; backdrop-filter: blur(5px); }
    #inventoryPanel { right: 10px; top: 10px; width: 260px; cursor: pointer; }
    
    .slot-container { display: flex; gap: 5px; margin-top: 10px; justify-content: center; }
    .item-slot { width: 50px; height: 50px; background: rgba(0,0,0,0.5); border: 1px solid #8d6e63; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

    .btn-action { width: 100%; background: #5d4037; color: white; border: 1px solid #8d6e63; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; font-size: 11px; }
    .btn-action:disabled { opacity: 0.4; }
</style>
</head>
<body>

<div id="watermark"></div>

<div id="gameWorld"><div id="creaturesContainer"></div></div>

<div id="inventoryPanel" class="ui-panel" onclick="handleInventoryClick(event)">
    <h3 style="margin:0; font-size: 14px;">🎒 Charakter & Inventar</h3>
    <div id="invContent" style="display:none; margin-top:10px; font-size:12px;">
        <div style="text-align:center; background:rgba(0,0,0,0.3); padding:5px; border-radius:5px;">
            <b>Ausrüstung-Slots:</b>
            <div class="slot-container">
                <div class="item-slot" id="slot-hand" title="Hand">👊</div>
                <div class="item-slot" id="slot-head" title="Kopf">🧢</div>
            </div>
        </div>
        
        <p>🪵 Holz: <span id="invHolz">0</span> | 🪨 Stein: <span id="invStein">0</span></p>
        <p>Aktuelle Waffe: <span id="curWeapon" style="color:#ffd700;">Faust</span></p>
        
        <button id="btnSchmieden" class="btn-action" onclick="craftItem('holzschwert', event)">⚔ Holzschwert schmieden (50 Holz)</button>
        <button id="btnEquip" class="btn-action" onclick="toggleEquip(event)">👕 Ausrüstung an/ausziehen</button>
    </div>
</div>

<script>
const BROADCASTER_NAME = "spawn2909";

const gameState = {
    creatures: JSON.parse(localStorage.getItem('creatures')) || {},
    resources: JSON.parse(localStorage.getItem('resources')) || { gold: 0 },
    playerName: null
};

// ===== RPG LOGIK: LOOT & GEAR =====
const ITEM_POOL = {
    holzschwert: { name: "Holzschwert", img: "schwert.png", cost: { wood: 50, stone: 20 }, slot: "hand" }
};

function craftItem(itemKey, event) {
    event.stopPropagation();
    const item = ITEM_POOL[itemKey];
    const p = gameState.creatures[gameState.playerName];

    if (p.wood >= item.cost.wood && p.stone >= item.cost.stone) {
        p.wood -= item.cost.wood;
        p.stone -= item.cost.stone;
        
        // Neues Item ins Inventar-Array (Loot-Gedanke)
        if(!p.ownedItems) p.ownedItems = [];
        p.ownedItems.push(itemKey);
        
        alert(`Erfolg! ${item.name} geschmiedet.`);
        saveGameState(); updateUI();
    }
}

function toggleEquip(event) {
    event.stopPropagation();
    const p = gameState.creatures[gameState.playerName];
    
    // Einfache Logik: Wenn er ein Schwert besitzt, zieht er es an/aus
    if (p.ownedItems && p.ownedItems.includes('holzschwert')) {
        p.equippedHand = (p.equippedHand === 'holzschwert') ? null : 'holzschwert';
        saveGameState();
        renderCreatures(); // Visuelles Update auf der Map
        updateUI();
    }
}

// ===== RENDER SYSTEM (MIT LAYERN) =====
function renderCreatures() {
    const container = document.getElementById('creaturesContainer');
    container.innerHTML = '';
    
    Object.values(gameState.creatures).forEach(c => {
        const el = document.createElement('div');
        el.className = 'creature';
        el.id = `creature-${c.name}`;
        
        // Basis Ei
        const days = Math.floor((Date.now() - (c.joinDate || Date.now())) / 86400000);
        let baseImg = (c.type === 'sub') ? (days >= 30 ? 'schleim.png' : 'ei.png') : 'follower.png';

        // Ausrüstungs-HTML (Layered)
        let gearHtml = '';
        if (c.equippedHand === 'holzschwert') {
            gearHtml = `<div class="equipment-layer" style="background-image: url('schwert.png');"></div>`;
        }

        el.innerHTML = `
            <div class="creature-base" style="background-image: url('${baseImg}');">
                ${gearHtml}
                <div class="name-tag">${c.name}</div>
            </div>
        `;
        container.appendChild(el);
    });
}

// ===== UTILS & ENGINE =====
function checkIdentity() {
    const urlParams = new URLSearchParams(window.location.search);
    gameState.playerName = (urlParams.get('user') || localStorage.getItem('nestPlayerName') || "Held").toLowerCase();
    localStorage.setItem('nestPlayerName', gameState.playerName);

    if (!gameState.creatures[gameState.playerName]) {
        gameState.creatures[gameState.playerName] = { 
            name: gameState.playerName, type: 'sub', joinDate: Date.now(), 
            wood: 0, stone: 0, ownedItems: [], equippedHand: null 
        };
    }
}

function updateUI() {
    const me = gameState.creatures[gameState.playerName];
    if (me) {
        document.getElementById('invHolz').textContent = Math.floor(me.wood || 0);
        document.getElementById('invStein').textContent = Math.floor(me.stone || 0);
        document.getElementById('curWeapon').textContent = me.equippedHand ? "Holzschwert" : "Faust";
        document.getElementById('slot-hand').textContent = me.equippedHand ? "⚔️" : "👊";
        
        document.getElementById('btnSchmieden').disabled = (me.wood < 50);
        document.getElementById('btnEquip').style.display = (me.ownedItems && me.ownedItems.length > 0) ? "block" : "none";
    }
    document.getElementById('resCount').textContent = Object.keys(gameState.creatures).length;
}

function handleInventoryClick(event) { if (event.target.tagName !== 'BUTTON') toggleInventory(); }
function toggleInventory() { const c = document.getElementById('invContent'); c.style.display = c.style.display === 'none' ? 'block' : 'none'; }
function saveGameState() { localStorage.setItem('creatures', JSON.stringify(gameState.creatures)); }

window.onload = () => {
    checkIdentity();
    renderCreatures();
    setInterval(() => {
        Object.values(gameState.creatures).forEach(c => {
            c.wood = (c.wood || 0) + 0.5;
            c.stone = (c.stone || 0) + 0.2;
        });
        updateUI(); saveGameState();
    }, 5000);
    setInterval(() => {
        Object.values(gameState.creatures).forEach(c => {
            const el = document.getElementById(`creature-${c.name}`);
            if(el) {
                el.style.left = (15 + Math.random() * 70) + "%";
                el.style.top = (25 + Math.random() * 55) + "%";
            }
        });
    }, 4000);
    updateUI();
};
</script>
</body>
</html>
