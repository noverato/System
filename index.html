<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Nest: Solo Leveling Final</title>
<style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0a0a12; color: #e0d8b0; }
    #gameWorld { position: absolute; width: 100%; height: 100%; background: url('wald.png') center/cover; z-index: 1; cursor: crosshair; }

    /* CHARAKTER */
    .creature { position: absolute; width: 80px; height: 80px; z-index: 10; transition: left 2s linear, top 2s linear; text-align: center; }
    .creature-img { width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: center; margin: 0 auto; position: relative; }
    
    /* BATTLE LOG (Snake Style) */
    #battleLog { position: fixed; bottom: 80px; left: 10px; width: 220px; height: 100px; background: rgba(0,0,0,0.8); border: 1px solid #ff4444; border-radius: 5px; font-size: 10px; padding: 5px; overflow-y: hidden; z-index: 100; display: none; }

    /* UI PANELS */
    #hud { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; border: 1px solid #3b82f6; }
    .inv-btn { position: fixed; bottom: 20px; right: 20px; z-index: 100; padding: 15px 25px; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }

    /* ADMIN PANEL */
    #adminPanel { position: fixed; bottom: 10px; left: 10px; z-index: 1000; background: rgba(255, 0, 0, 0.4); border: 1px solid red; padding: 10px; border-radius: 5px; display: none; }

    /* MODAL (INVENTAR) */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .inv-box { width: 90%; max-width: 500px; background: #1a1c2c; border: 2px solid #3d4a5d; border-radius: 15px; padding: 20px; text-align: center; }
    .slot-row { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
    .slot { width: 60px; height: 60px; background: #0f172a; border: 2px solid #3b82f6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 25px; }
    .btn-craft { background: #eab308; color: black; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
    .guest-lock { color: #ff4444; font-size: 12px; margin-top: 10px; font-style: italic; }
</style>
</head>
<body>

<div id="gameWorld" onclick="handleWorldClick(event)">
    <div id="charLayer"></div>
    <div id="monsterLayer"></div>
</div>

<div id="battleLog"></div>

<div id="hud">
    <div id="playerStatus">Gat: <span id="userRole">Besucher</span></div>
    ✨ LXP: <span id="lxpVal">0</span> | 📈 EP: <span id="epVal">0</span><br>
    🌿 <span id="resGras">0</span> | 🪵 <span id="resStock">0</span>
</div>

<div id="adminPanel">
    <b style="color:white">ADMIN PANEL</b><br>
    <button onclick="addRes('ep', 10)">+10 EP (Evo)</button>
    <button onclick="addRes('lxp', 50)">+50 LXP</button>
    <button onclick="toggleFollowerStatus()">Follower simulieren</button>
</div>

<button class="inv-btn" onclick="toggleInv(true)">🎒 INVENTAR & SCHMIEDE</button>

<div id="invModal" class="modal">
    <div class="inv-box">
        <h2 id="invTitle" style="color:#facc15; margin-top:0;">CHARAKTER STATUS</h2>
        <div class="slot-row">
            <div class="slot" id="slot-head">🌑</div>
            <div class="slot" id="slot-body">🌑</div>
            <div class="slot" id="slot-hand">🌑</div>
        </div>
        <div id="craftingArea">
            <button class="btn-craft" onclick="craft('hand', '⚔️', 20)">Schmieden: ⚔️ Schwert (20 LXP)</button>
            <div id="lockMessage" class="guest-lock"></div>
        </div>
        <br>
        <button onclick="toggleInv(false)" style="background:#444; color:white; border:none; padding:10px 20px; border-radius:5px;">Schließen</button>
    </div>
</div>

<script>
// INITIALISIERUNG
let data = JSON.parse(localStorage.getItem('nestData')) || {
    lxp: 0, ep: 0, gras: 0, stock: 0, 
    isFollower: false, 
    equipped: { hand: null }
};

const BROADCASTER_NAME = "spawn2909";

function save() {
    localStorage.setItem('nestData', JSON.stringify(data));
    updateUI();
}

function updateUI() {
    document.getElementById('lxpVal').textContent = Math.floor(data.lxp);
    document.getElementById('epVal').textContent = Math.floor(data.ep);
    document.getElementById('resGras').textContent = data.gras;
    document.getElementById('resStock').textContent = data.stock;
    document.getElementById('userRole').textContent = data.isFollower ? "Follower" : "Gast";
    document.getElementById('userRole').style.color = data.isFollower ? "#44ff44" : "#ff4444";
    
    const lockMsg = document.getElementById('lockMessage');
    if(!data.isFollower) {
        lockMsg.textContent = "⚠️ Nur Follower können sammeln & schmieden!";
    } else {
        lockMsg.textContent = "";
    }
    renderChar();
}

function toggleInv(show) {
    document.getElementById('invModal').style.display = show ? 'flex' : 'none';
}

function handleWorldClick(e) {
    const el = document.getElementById('myChar');
    if(!el) return;
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    el.style.left = (x - 4) + "%";
    el.style.top = (y - 4) + "%";
}

function renderChar() {
    const layer = document.getElementById('charLayer');
    if(layer.children.length === 0) {
        const char = document.createElement('div');
        char.className = 'creature';
        char.id = "myChar";
        char.style.left = "50%"; char.style.top = "50%";
        layer.appendChild(char);
    }
    const char = document.getElementById('myChar');
    let img = data.ep >= 30 ? 'schleim.png' : 'ei.png';
    char.innerHTML = `
        <div style="width:50px; height:4px; background:black; margin:auto;"><div style="background:#4caf50; height:100%; width:${Math.min(100, (data.ep/30)*100)}%"></div></div>
        <div class="creature-img" style="background-image:url('${img}')">
            ${data.equipped.hand ? '<div style="position:absolute; right:-10px; top:10px; font-size:20px;">' + data.equipped.hand + '</div>' : ''}
        </div>
        <div style="font-size:10px; font-weight:bold;">${BROADCASTER_NAME}</div>
    `;
}

// BATTLE SYSTEM (1 Minute)
function spawnMonster() {
    const layer = document.getElementById('monsterLayer');
    const m = document.createElement('div');
    m.innerHTML = '👾';
    m.style.position = 'absolute';
    m.style.left = (10 + Math.random() * 80) + "%";
    m.style.top = (10 + Math.random() * 80) + "%";
    m.style.fontSize = "30px";
    m.style.cursor = "pointer";
    
    m.onclick = (e) => {
        e.stopPropagation();
        if(!data.isFollower) { alert("Folge dem Stream, um zu kämpfen!"); return; }
        startBattle(m);
    };
    layer.appendChild(m);
}

function startBattle(monsterEl) {
    const log = document.getElementById('battleLog');
    log.style.display = 'block';
    log.innerHTML = "<b>KAMPF STARTET (60s)...</b>";
    monsterEl.style.filter = "hue-rotate(90deg) scale(1.5)";
    
    let timer = 60;
    const interval = setInterval(() => {
        timer--;
        const dmg = data.equipped.hand ? 5 : 1;
        log.innerHTML += `<div>> Treffer! -${dmg} HP</div>`;
        log.scrollTop = log.scrollHeight;
        
        if(timer <= 0) {
            clearInterval(interval);
            log.innerHTML = "<b>SIEG! +5 LXP</b>";
            data.lxp += 5;
            save();
            monsterEl.remove();
            setTimeout(() => log.style.display = 'none', 5000);
        }
    }, 1000);
}

// ADMIN TOOLS
function addRes(type, val) {
    if(type === 'ep') data.ep += val;
    if(type === 'lxp') data.lxp += val;
    save();
}

function toggleFollowerStatus() {
    data.isFollower = !data.isFollower;
    save();
}

function craft(item, emoji, cost) {
    if(!data.isFollower) return;
    if(data.lxp >= cost) {
        data.lxp -= cost;
        data.equipped.hand = emoji;
        save();
        alert("Gegenstand angelegt!");
    } else { alert("Zu wenig LXP!"); }
}

window.onload = () => {
    // Admin Check
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('admin') === 'true') {
        document.getElementById('adminPanel').style.display = 'block';
    }
    
    updateUI();
    setInterval(spawnMonster, 20000);
    
    // Ressourcen Tick NUR für Follower
    setInterval(() => {
        if(data.isFollower) {
            data.gras += 1;
            save();
        }
    }, 10000);
};
</script>
</body>
</html>
