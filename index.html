<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spawn2909 – Nest RPG (Release)</title>

<style>
body,html{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background-color:#050a05 !important;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
    display:flex;
}

/* Layout */
#statusColumn,#worldColumn,#infoColumn{
    padding:10px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
}
#statusColumn{width:240px;background:rgba(0,0,0,.55);border-right:1px solid #444}
#worldColumn{flex:1;position:relative;overflow:hidden}
#infoColumn{width:260px;background:rgba(0,0,0,.55);border-left:1px solid #444}

/* Dorf */
.village-ground{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:600px;
    height:400px;
    border-radius:50%;
    background:#3d2b1f;
    border:10px solid #5d4037;
    box-shadow:inset 0 0 20px #2a1b10;
    z-index:1;
    transition:0.5s;
}
.village-ground.stone{
    border-color:#777;
    box-shadow:inset 0 0 25px #333;
}

/* Wald */
.tree{
    position:absolute;
    z-index:0;
    user-select:none;
}

/* Eier */
.eggAvatar{
    position:absolute;
    font-size:32px;
    transition:all 5s linear;
    z-index:5;
    text-align:center;
}
.avatarName{display:block;font-size:11px}

/* Gebäude */
.building{
    position:absolute;
    font-size:40px;
    z-index:10;
    cursor:pointer;
}

/* UI Overlay */
.uiBackdrop{
    position:absolute;
    left:0;top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    z-index:99;
    display:none;
}
.overlayUI{
    position:absolute;
    width:400px;
    height:300px;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.9);
    border:3px solid gold;
    z-index:100;
    padding:20px;
    display:none;
}
.overlayUI button{
    position:absolute;
    right:8px;
    top:8px;
}

/* Player */
#playerEgg{font-size:48px;text-align:center}
#xpBar{height:16px;background:#222;border-radius:8px;overflow:hidden}
#xpProgress{height:100%;background:gold;width:0%}

/* News */
#newsTicker{margin-top:auto;padding:6px;background:rgba(0,0,0,.6)}
#newsHistory{font-size:13px;margin-top:10px}
</style>
</head>

<body>

<div id="statusColumn">
    <div id="playerEgg">🥚</div>
    <div id="playerName">Spawn2909</div>
    <div id="playerRank">Rang: Ei</div>
    <div id="xpBar"><div id="xpProgress"></div></div>
</div>

<div id="worldColumn">
    <div id="villageCenter" class="village-ground"></div>
    <div id="villageMap"></div>

    <div id="uiBackdrop" class="uiBackdrop"></div>

    <div id="marketUI" class="overlayUI">
        Marktplatz
        <button onclick="closeUI()">X</button>
    </div>
    <div id="forgeUI" class="overlayUI">
        Schmiede
        <button onclick="closeUI()">X</button>
    </div>
</div>

<div id="infoColumn">
    <div id="followerStats">Dorf-Level: 0</div>
    <div id="newsHistory"></div>
</div>

<script>
const villageMap=document.getElementById("villageMap");
const village=document.getElementById("villageCenter");
const stats=document.getElementById("followerStats");
const eggs={};
let followerCount=0;
let xp=0, xpLimit=10;
let news=[];

/* --------- FOREST FIX --------- */
function createForest(){
    villageMap.innerHTML="";
    for(let i=0;i<150;i++){
        const t=document.createElement("div");
        t.className="tree";
        t.textContent=Math.random()<.5?"🌲":"🌳";
        t.style.left=Math.random()*villageMap.clientWidth+"px";
        t.style.top=Math.random()*villageMap.clientHeight+"px";
        t.style.fontSize=12+Math.random()*20+"px";
        villageMap.appendChild(t);
    }
}
window.addEventListener("load",createForest);
window.addEventListener("resize",createForest);

/* --------- SPAWN EGG --------- */
function spawnEgg(name){
    const e=document.createElement("div");
    e.className="eggAvatar";
    e.innerHTML="🥚<span class='avatarName'>"+name+"</span>";
    villageMap.appendChild(e);
    eggs[name]=e;
    followerCount++;
    updateVillage();
    moveEgg(name);
}

/* --------- MOVEMENT (70% Dorf) --------- */
function moveEgg(name){
    const e=eggs[name];
    const map=villageMap.getBoundingClientRect();
    const v=village.getBoundingClientRect();
    let x,y;

    if(Math.random()<0.7){
        x=v.left-map.left+Math.random()*v.width;
        y=v.top-map.top+Math.random()*v.height;
    }else{
        x=Math.random()*map.width;
        y=Math.random()*map.height;
    }

    e.style.left=x+"px";
    e.style.top=y+"px";

    setTimeout(()=>moveEgg(name),5000);
}

/* --------- UI --------- */
function openUI(id){
    document.getElementById("uiBackdrop").style.display="block";
    document.getElementById(id).style.display="block";
}
function closeUI(){
    document.getElementById("uiBackdrop").style.display="none";
    document.querySelectorAll(".overlayUI").forEach(e=>e.style.display="none");
}

/* --------- Village Evolution --------- */
function updateVillage(){
    stats.textContent="Dorf-Level: "+followerCount;
    if(followerCount>=10) village.classList.add("stone");
}

/* --------- XP & Rank --------- */
function addXP(v){
    xp+=v;
    if(xp>=xpLimit){
        document.getElementById("playerEgg").textContent="💧";
        document.getElementById("playerRank").textContent="Rang: Schleim";
        xpLimit=50;
        xp=0;
    }
    document.getElementById("xpProgress").style.width=(xp/xpLimit*100)+"%";
}

/* --------- NEWS --------- */
function addNews(t){
    news.unshift(t);
    if(news.length>3)news.pop();
    document.getElementById("newsHistory").innerHTML=news.join("<br>");
}

/* TEST USERS */
spawnEgg("Raphael");
spawnEgg("Luna");
spawnEgg("Kai");
</script>

</body>
</html>
