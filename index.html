<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Isekai Nest V4</title>

<style>
body{
    margin:0;
    background:#050b05;
    overflow:hidden;
    font-family:Segoe UI, sans-serif;
    color:white;
}

/* Forest mit Bild-Hintergrund */
#forest{
    position:absolute;
    inset:0;
    background-image: url('DEIN_BILD_LINK'); /* Platzhalter */
    background-size: cover;
    background-position: center;
    z-index:1;
}

/* Nest */
#nest{
    position:absolute;
    left:50%;
    top:50%;
    width:260px;
    height:260px;
    margin:-130px;
    border-radius:50%;
    background:radial-gradient(circle,#1c3f1c,#050b05);
    box-shadow:0 0 40px #5eff5e55;
    z-index:10;
}

/* Creatures */
.creature{
    position:absolute;
    text-align:center;
    font-size:32px;
    z-index:100; /* Immer über dem Boss-Fenster */
    animation: wusel 1.5s ease-in-out infinite alternate;
}
.name{
    font-size:12px;
    color:#ffe7a3;
    text-shadow:0 0 4px black;
    z-index:101; /* Namen immer ganz oben */
    position:relative;
}

/* Wusel-Animation */
@keyframes wusel {
    0% { transform: translate(0px,0px); }
    25% { transform: translate(2px,-2px); }
    50% { transform: translate(-2px,2px); }
    75% { transform: translate(2px,1px); }
    100% { transform: translate(-1px,-2px); }
}

/* UI Panels */
.ui{
    position:absolute;
    top:10px;
    width:220px;
    background:rgba(40,40,60,.4);
    backdrop-filter: blur(6px);
    border:2px solid gold;
    border-radius:10px;
    padding:10px;
    z-index:9999;
}

#leftUI{left:10px;}
#rightUI{right:10px;}

/* Close Buttons */
.closeBtn{
    position:absolute;
    top:5px;
    right:5px;
    background:red;
    color:white;
    border:none;
    border-radius:50%;
    width:20px;
    height:20px;
    text-align:center;
    line-height:18px;
    font-weight:bold;
    cursor:pointer;
    z-index:10000;
}

button{
    background:#333;
    color:white;
    border:1px solid gold;
    border-radius:6px;
    padding:6px;
    margin-top:5px;
    cursor:pointer;
}

button:disabled{
    background:#555;
    cursor:not-allowed;
}

/* Boss Window */
#bossWindow{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:500px;
    background:rgba(20,20,30,.85);
    border:2px solid crimson;
    padding:10px;
    display:none;
    z-index:99; /* Unter den Creatures */
}
#battleLog{
    height:120px;
    overflow-y:auto;
    background:black;
    padding:5px;
    font-size:12px;
}
</style>
</head>

<body>

<div id="forest"></div>
<div id="nest"></div>

<div id="leftUI" class="ui">
    <button class="closeBtn" onclick="document.getElementById('leftUI').style.display='none'">X</button>
    <b>Dorf</b><br>
    <div id="stats"></div>
</div>

<div id="rightUI" class="ui">
    <button class="closeBtn" onclick="document.getElementById('rightUI').style.display='none'">X</button>
    <b>Shop</b><br>
    <button onclick="buyXP('DevUser')">+10 XP (10 LXP)</button>
    <button onclick="spawnBoss()">Boss rufen</button>
</div>

<div id="bossWindow">
    <button class="closeBtn" onclick="document.getElementById('bossWindow').style.display='none'">X</button>
    <b>👾 Boss</b> <span id="bossHP"></span><br>
    <div id="party"></div>
    <button id="attackButton" onclick="attackBoss()">ANGREIFEN</button>
    <div id="battleLog"></div>
</div>

<button style="position:absolute;bottom:10px;right:10px;z-index:9999" onclick="spawnEgg('DevUser')">DEV SPAWN</button>

<script>
// Admin-Funktion: Start-Datum für treue Follower setzen (in Millisekunden seit 1970)
const FAKE_JOIN_DATES = {
    "Follower1": Date.now() - (86400000 * 30), // 30 Tage alt
    "Follower2": Date.now() - (86400000 * 45), // 45 Tage alt
    "Follower3": Date.now() - (86400000 * 60), // 60 Tage alt
    "Follower4": Date.now() - (86400000 * 75), // 75 Tage alt
    "Follower5": Date.now() - (86400000 * 90), // 90 Tage alt
    "Follower6": Date.now() - (86400000 * 105), // 105 Tage alt
    "Follower7": Date.now() - (86400000 * 120), // 120 Tage alt
    "Follower8": Date.now() - (86400000 * 135), // 135 Tage alt
};

let creatures = JSON.parse(localStorage.getItem("creatures")||"{}");
let boss=null;
let attackCooldown = false;

function save(){localStorage.setItem("creatures",JSON.stringify(creatures));}

// Evolution für Follower
function getFollowerStage(ep) {
    if(ep >= 90) return "🌳"; // Waldwächter
    if(ep >= 30) return "🏺"; // Golem
    return "🥚"; // Ei
}

// Evolution für Subs
function getSubStage(ep) {
    if(ep >= 180) return "👽"; // Höheres Wesen
    if(ep >= 150) return "💀"; // Lich
    if(ep >= 120) return "👹"; // Oger
    if(ep >= 90) return "🎃"; // Goblin
    if(ep >= 60) return "💧"; // Skelett
    if(ep >= 30) return "🟢"; // Schleim
    return "🥚"; // Ei
}

function spawnEgg(name,type="follower"){
    if(creatures[name]) return;
    creatures[name]={
        name,type,
        ep:0, // Evolutions-Punkte
        lxp:type=="sub"?50:10,
        joined:FAKE_JOIN_DATES[name] || Date.now()
    };
    save();
}

function tick(){
    for(let c of Object.values(creatures)){
        let days = (Date.now() - c.joined) / (1000 * 60 * 60 * 24);
        c.ep = Math.floor(days); // 1 EP pro Tag
        c.lxp += 1/1440; // 1 LXP pro Minute
    }
    save();
    render();
}
setInterval(tick, 60000); // Alle 60 Sekunden aktualisieren

function render(){
    document.querySelectorAll(".creature").forEach(e=>e.remove());
    for(let c of Object.values(creatures)){
        let d=document.createElement("div");
        d.className="creature";
        // Zufällige Position im Dorfbereich (40%-60% der Bildschirmgröße)
        d.style.left = (40 + Math.random() * 20) + "%";
        d.style.top = (40 + Math.random() * 20) + "%";
        d.innerHTML=`<div class="name">${c.name}</div>${c.type=="sub" ? getSubStage(c.ep) : getFollowerStage(c.ep)}`;
        document.body.appendChild(d);
    }
    document.getElementById("stats").innerText=
        "Bewohner: "+Object.keys(creatures).length;
}
render();

/* Boss */
function spawnBoss(){
    boss={hp:1000};
    document.getElementById("bossWindow").style.display="block";
    updateBoss();
}
function updateBoss(){
    document.getElementById("bossHP").innerText="HP "+boss.hp;
    document.getElementById("party").innerHTML=
        Object.values(creatures).map(c=>(c.type=="sub" ? getSubStage(c.ep) : getFollowerStage(c.ep))+" "+c.name).join("<br>");
}
function attackBoss(){
    if (attackCooldown) return;
    attackCooldown = true;
    document.getElementById("attackButton").disabled = true;

    let log="";
    let dmg=0;
    for(let c of Object.values(creatures)){
        let stage = c.type=="sub" ? getSubStage(c.ep) : getFollowerStage(c.ep);
        if(stage=="🌳" || stage=="👽") dmg+=100;
        else if(stage=="🏺" || stage=="👹" || stage=="💀") dmg+=40;
        else if(stage=="💧" || stage=="🎃") dmg+=10;
    }
    boss.hp-=dmg;
    log+="Gruppe verursacht "+dmg+" Schaden<br>";
    if(boss.hp<=0){
        log+="Boss besiegt!";
        document.getElementById("bossWindow").style.display="none";
    }
    document.getElementById("battleLog").innerHTML+=log;
    updateBoss();

    setTimeout(() => {
        attackCooldown = false;
        document.getElementById("attackButton").disabled = false;
    }, 1000);
}

/* Shop */
function buyXP(userName){
    let user = creatures[userName];
    if(user && user.lxp >= 10){
        user.lxp -= 10;
        user.ep += 10; // 10 EP für 10 LXP
        save();
        render();
    }
}

/* WebSocket */
let ws=new WebSocket("ws://localhost:8080");
ws.onmessage=e=>{
    let data=JSON.parse(e.data);
    if(data.displayName){
        spawnEgg(data.displayName,data.isSub?"sub":"follower");
    }
};
</script>

</body>
</html>
