<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Nest: Solo Leveling RPG Master</title>
<style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: #e0d8b0; }
    #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
    #world { 
        width: 1920px; height: 1080px; 
        background: url('wald.png') no-repeat center; 
        background-size: cover;
        position: absolute; transform-origin: 0 0; transition: transform 0.1s ease-out;
    }

    /* CHARAKTER */
    .creature { position: absolute; width: 80px; height: 100px; z-index: 100; transition: left 0.8s ease-out, top 0.8s ease-out; text-align: center; transform: translate(-50%, -50%); }
    .avatar-emoji { font-size: 60px; display: block; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8)); }
    .name-tag { font-size: 14px; font-weight: bold; color: #fff; background: rgba(15, 23, 42, 0.9); padding: 2px 12px; border-radius: 8px; border: 1px solid #3b82f6; margin-top: 5px; }

    /* GEBÄUDE */
    .building { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; z-index: 10; transform: translate(-50%, -50%); }
    .label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 5px; font-size: 11px; white-space: nowrap; }

    /* BATTLE POPUP */
    #battlePopup { 
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.95); border: 3px solid red; padding: 40px;
        z-index: 100000; display: none; text-align: center; border-radius: 20px;
        box-shadow: 0 0 50px red;
    }

    /* MASTER INVENTAR */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 20000; align-items: center; justify-content: center; }
    .inv-container { 
        display: grid; grid-template-columns: 100px 1fr 100px; grid-template-rows: 1fr 150px;
        gap: 15px; width: 600px; background: #111827; border: 3px solid #3b82f6; border-radius: 25px; padding: 20px;
    }
    .inv-slot { background: rgba(255,255,255,0.05); border: 2px solid #374151; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .center-char { grid-column: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .bottom-grid { grid-column: 1 / span 3; display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }

    /* UI */
    #hud { position: fixed; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 15px; border: 2px solid #3b82f6; z-index: 10000; }
    #adminPanel { position: fixed; top: 20px; right: 20px; background: rgba(153, 27, 27, 0.9); padding: 10px; border-radius: 10px; border: 2px solid #ef4444; z-index: 10000; }
</style>
</head>
<body>

<div id="battlePopup">
    <h2 style="color:red; margin:0;">⚔️ KAMPF STARTET...</h2>
    <p id="battleText">Ein Monster greift an!</p>
</div>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left: 1500px; top: 200px; width: 220px; height: 220px; background-image: url('steinbruch.png');" id="quarry"><div class="label">Steinbruch</div></div>
        <div class="building" style="left: 1200px; top: 750px; width: 220px; height: 220px; background-image: url('marktplatz.png');" onclick="toggleMarket(true)"><div class="label">Marktplatz</div></div>
        <div class="building" style="left: 400px; top: 300px; width: 250px; height: 250px; background-image: url('rathaus.png');"><div class="label">Rathaus</div></div>
        <div class="building" style="left: 900px; top: 200px; width: 200px; height: 200px; background-image: url('heilige_schmiede.png');"><div class="label">Heilige Schmiede</div></div>
        <div class="building" style="left: 700px; top: 500px; width: 180px; height: 180px; background-image: url('schmiede.png');"><div class="label">Schmiede</div></div>
        
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="font-weight: bold; color: #facc15;"><span id="playerName">Lädt...</span></div>
    <div style="font-size: 12px; color: #94a3b8;">LXP: <span id="lxp">0</span> | EP: <span id="ep">0</span> | 🪨 <span id="stein">0</span></div>
</div>

<div id="adminPanel" style="display:none;">
    <button onclick="addRes('lxp', 100)">+100 LXP</button>
    <button onclick="localStorage.clear(); location.reload();">RESET</button>
</div>

<button style="position:fixed; bottom:20px; right:20px; z-index:10000; padding:15px 30px; border-radius:15px; background:#2563eb; color:white; border:none; font-weight:bold; cursor:pointer;" onclick="toggleInv(true)">🎒 STATUS & LOOT</button>

<div id="invModal" class="modal">
    <div class="inv-container">
        <div style="display:flex; flex-direction:column; gap:5px;">
            <div class="inv-slot">🪖</div><div class="inv-slot">🛡️</div><div class="inv-slot">🧥</div><div class="inv-slot">👞</div><div class="inv-slot">💍</div>
        </div>
        
        <div class="center-char">
            <div id="invAvatar" style="font-size: 100px;">🥚</div>
            <div id="invClass" style="color:#3b82f6; font-weight:bold;">Ei</div>
        </div>

        <div style="display:flex; flex-direction:column; gap:5px;">
            <div class="inv-slot" title="Boss Loot">💎</div><div class="inv-slot">👑</div><div class="inv-slot">🔥</div><div class="inv-slot">🌀</div><div class="inv-slot">🦴</div>
        </div>

        <div class="bottom-grid" id="mainInventory">
            </div>

        <button style="grid-column: 2; margin-top:10px; background:#ef4444; color:white; border:none; border-radius:5px; padding:5px;" onclick="toggleInv(false)">Schließen</button>
    </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('nestData')) || {
    name: "Held", lxp: 0, ep: 0, gras: 0, stock: 0, stein: 0, x: 960, y: 540,
    currentClass: "Ei", emoji: "🥚", loot: []
};

let zoom = 1.0;
const world = document.getElementById('world');

window.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom = Math.min(Math.max(zoom + (e.deltaY > 0 ? -0.1 : 0.1), 0.3), 2.5);
    world.style.transform = `scale(${zoom})`;
}, { passive: false });

function init() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('user')) data.name = p.get('user');
    if (p.get('admin') === 'true' && data.name.toLowerCase() === "spawn2909") {
        document.getElementById('adminPanel').style.display = 'block';
    }
    updateUI();
    setInterval(autoCollect, 5000); // Alle 5 Sek Steine sammeln
}

function updateUI() {
    document.getElementById('playerName').textContent = data.name;
    document.getElementById('lxp').textContent = data.lxp;
    document.getElementById('ep').textContent = data.ep;
    document.getElementById('stein').textContent = data.stein;
    document.getElementById('invAvatar').textContent = data.emoji;
    document.getElementById('invClass').textContent = data.currentClass;
    
    // Inventar Slots füllen
    const grid = document.getElementById('mainInventory');
    grid.innerHTML = '';
    for(let i=0; i<9; i++) {
        const slot = document.createElement('div');
        slot.className = 'inv-slot';
        slot.innerHTML = data.loot[i] || "";
        grid.appendChild(slot);
    }
    renderChar();
}

function renderChar() {
    const layer = document.getElementById('charLayer');
    layer.innerHTML = '';
    const char = document.createElement('div');
    char.className = 'creature';
    char.style.left = data.x + "px"; char.style.top = data.y + "px";
    char.innerHTML = `<span class="avatar-emoji">${data.emoji}</span><div class="name-tag">${data.name}</div>`;
    layer.appendChild(char);
}

function handleWorldClick(e) {
    const rect = world.getBoundingClientRect();
    data.x = (e.clientX - rect.left) / zoom;
    data.y = (e.clientY - rect.top) / zoom;
    
    // Zufallskampf
    if(Math.random() > 0.9) triggerBattle();
    else if(Math.random() > 0.7) data.gras++;
    
    save();
}

function autoCollect() {
    const dist = Math.hypot(data.x - 1500, data.y - 200);
    if(dist < 150) {
        data.stein += 1;
        updateUI();
    }
}

function triggerBattle() {
    const popup = document.getElementById('battlePopup');
    popup.style.display = 'block';
    setTimeout(() => {
        data.lxp += 15;
        // Boss Loot Chance
        if(Math.random() > 0.8) {
            const bossLoot = ["💎", "👑", "🦴", "🏮"][Math.floor(Math.random()*4)];
            data.loot.push(bossLoot);
            alert("BOSS GEFALLEN! Du hast " + bossLoot + " erhalten!");
        }
        popup.style.display = 'none';
        save();
    }, 3000);
}

function toggleInv(s) { document.getElementById('invModal').style.display = s ? 'flex' : 'none'; }
function save() { localStorage.setItem('nestData', JSON.stringify(data)); updateUI(); }
function addRes(t, v) { data[t] += v; save(); }

window.onload = init;
</script>
</body>
</html>
