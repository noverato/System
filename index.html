<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Nest: Admin & Mobile Edition</title>
<style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0a0a12; }
    
    /* Das Spielfeld ist jetzt klickbar für die Bewegung */
    #gameWorld { 
        position: absolute; width: 100%; height: 100%; 
        background: url('wald.png') center/cover; 
        z-index: 1; cursor: crosshair;
    }

    /* CHARAKTER */
    .creature { 
        position: absolute; width: 80px; height: 80px; z-index: 10; 
        transition: left 2s linear, top 2s linear; /* Linearer für direkte Steuerung */
        text-align: center; pointer-events: none; 
    }
    .creature-img { width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: center; margin: 0 auto; position: relative; }
    
    /* WILD MONSTER */
    .wild-monster {
        position: absolute; width: 40px; height: 40px; z-index: 9;
        font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        animation: popIn 0.3s ease-out;
    }
    @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

    /* ADMIN PANEL */
    #adminPanel {
        position: fixed; bottom: 10px; left: 10px; z-index: 1000;
        background: rgba(255, 0, 0, 0.2); border: 1px solid red; padding: 5px; border-radius: 5px;
        display: none; /* Wird nur für dich eingeblendet */
    }
    .admin-btn { font-size: 10px; background: #000; color: #ff4444; border: 1px solid red; cursor: pointer; margin: 2px; }

    /* UI & HUD */
    #hud { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; border: 1px solid #3b82f6; pointer-events: none; }
    .inv-btn { position: fixed; bottom: 20px; right: 20px; z-index: 100; padding: 15px 25px; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }

    /* BALKEN */
    .bar-wrap { width: 50px; height: 5px; background: rgba(0,0,0,0.8); margin: 2px auto; border-radius: 3px; }
    .bar-ep { height: 100%; background: #4caf50; transition: width 0.5s; }
    .bar-lxp { height: 100%; background: #2196f3; transition: width 0.5s; }
</style>
</head>
<body>

<div id="gameWorld" onclick="handleWorldClick(event)">
    <div id="charLayer"></div>
    <div id="monsterLayer"></div>
</div>

<div id="hud">
    ✨ LXP: <span id="lxpVal">0</span> | 📈 EP: <span id="epVal">0</span><br>
    🌿 <span id="resGras">0</span> | 🪵 <span id="resStock">0</span> | 🪨 <span id="resStein">0</span>
</div>

<div id="adminPanel">
    <strong style="font-size:10px; color:red;">ADMIN TOOLS</strong><br>
    <button class="admin-btn" onclick="addRes('lxp', 100)">+100 LXP</button>
    <button class="admin-btn" onclick="addRes('ep', 10)">+10 EP (Evo)</button>
    <button class="admin-btn" onclick="addRes('wood', 50)">+50 All Res</button>
    <button class="admin-btn" onclick="resetSave()">Reset</button>
</div>

<button class="inv-btn" onclick="alert('Inventar öffnet sich...')">🎒 INVENTAR</button>

<script>
let data = JSON.parse(localStorage.getItem('nestData')) || {
    lxp: 0, ep: 0, gras: 0, stock: 0, stein: 0,
    equipped: { head: null, body: null, hand: null }
};

const BROADCASTER_NAME = "spawn2909";

function save() { 
    localStorage.setItem('nestData', JSON.stringify(data)); 
    updateUI(); 
}

function updateUI() {
    document.getElementById('lxpVal').textContent = Math.floor(data.lxp);
    document.getElementById('epVal').textContent = Math.floor(data.ep);
    document.getElementById('resGras').textContent = data.gras;
    document.getElementById('resStock').textContent = data.stock;
    document.getElementById('resStein').textContent = data.stein;
    renderChar();
}

// STEUERUNG FÜR HANDY & PC
function handleWorldClick(e) {
    const el = document.getElementById('myChar');
    if(!el) return;
    
    // Berechne Prozentposition für Responsive Design
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    
    el.style.left = (x - 4) + "%"; // -4 um das Ei zu zentrieren
    el.style.top = (y - 4) + "%";
}

function renderChar() {
    const layer = document.getElementById('charLayer');
    if(layer.children.length > 0) return; // Nicht jedes Mal neu zeichnen

    const char = document.createElement('div');
    char.className = 'creature';
    char.id = "myChar";
    char.style.left = "50%"; char.style.top = "50%";
    
    // Evolution Logik
    let img = 'ei.png';
    if(data.ep >= 30) img = 'schleim.png';
    if(data.ep >= 60) img = 'held.png'; // Beispiel für nächste Stufe
    
    char.innerHTML = `
        <div class="bar-wrap"><div class="bar-ep" id="barEP" style="width:${Math.min(100, (data.ep/30)*100)}%"></div></div>
        <div class="bar-wrap"><div class="bar-lxp" id="barLXP" style="width:${Math.min(100, data.lxp/10)}%"></div></div>
        <div class="creature-img" id="charImg" style="background-image:url('${img}')"></div>
        <div class="name-tag">${BROADCASTER_NAME}</div>
    `;
    layer.appendChild(char);
}

// WILD MONSTER SYSTEM
function spawnWildMonster() {
    const monsterLayer = document.getElementById('monsterLayer');
    const m = document.createElement('div');
    m.className = 'wild-monster';
    m.innerHTML = '👾';
    m.style.left = (10 + Math.random() * 80) + "%";
    m.style.top = (10 + Math.random() * 80) + "%";
    
    m.onclick = (e) => {
        e.stopPropagation();
        data.lxp += 1;
        save();
        m.remove();
        // Kleiner Battle-Text Effekt
        const txt = document.createElement('div');
        txt.style.position = 'fixed';
        txt.style.left = e.clientX + "px";
        txt.style.top = e.clientY + "px";
        txt.style.color = "#44ff44";
        txt.textContent = "+1 LXP";
        document.body.appendChild(txt);
        setTimeout(() => txt.remove(), 1000);
    };
    
    monsterLayer.appendChild(m);
    // Monster verschwindet nach 10 Sek von selbst
    setTimeout(() => { if(m) m.remove(); }, 10000);
}

// ADMIN FUNKTIONEN
function addRes(type, val) {
    if(type === 'lxp') data.lxp += val;
    if(type === 'ep') data.ep += val;
    if(type === 'wood') { data.gras += val; data.stock += val; data.stein += val; }
    save();
    location.reload(); // Refresh um Evo-Bild zu aktualisieren
}

function resetSave() { localStorage.clear(); location.reload(); }

window.onload = () => {
    updateUI();
    // Prüfe ob Admin Modus aktiv (?admin=true in der URL)
    if(new URLSearchParams(window.location.search).get('admin') === 'true') {
        document.getElementById('adminPanel').style.display = 'block';
    }
    
    // Alle 15 Sekunden ein wildes Monster
    setInterval(spawnWildMonster, 15000);
    
    // Ressourcen-Tick (Passiv)
    setInterval(() => {
        data.gras += 1;
        save();
    }, 30000);
};
</script>
</body>
</html>
