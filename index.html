<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Isekai RPG - FINAL STREAM EDITION</title>
    <style>
        :root { --fantasy-bg: rgba(40, 30, 20, 0.95); --gold: #ffd700; --border: 2px solid #ffd700; --shadow: 0 0 15px rgba(255, 215, 0, 0.4); --btn-grad: linear-gradient(135deg, #b8860b, #8b4513); }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; transform-origin: center center; z-index: 1; }
        
        #charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .creature { position: absolute; width: 80px; height: 100px; text-align: center; transform: translate(-50%, -50%); transition: left 0.6s ease-out, top 0.6s ease-out; pointer-events: auto; cursor: crosshair; }
        .creature img { height: 80px; filter: drop-shadow(0 0 8px rgba(0,0,0,0.6)); }
        .name-tag { font-size: 14px; font-weight: bold; color: #fff; background: rgba(15, 23, 42, 0.9); padding: 2px 12px; border-radius: 8px; border: 1px solid #3b82f6; margin-top: 5px; white-space: nowrap; }

        .building { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; transform: translate(-50%, -50%); z-index: 10; }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }

        #pvpMenu { position: fixed; background: var(--fantasy-bg); border: var(--border); padding: 15px; border-radius: 12px; z-index: 70000; display: none; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }

        #arenaLayer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: url('./arena_innen.png') no-repeat center; background-size: cover; z-index: 60000; display: none; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 0; box-sizing: border-box; }
        #combatScene { display: flex; width: 90%; justify-content: space-between; align-items: center; margin-bottom: auto; margin-top: 20px; }
        .combat-unit { text-align: center; width: 300px; }
        .hp-bar-bg { width: 100%; height: 25px; background: #222; border: 2px solid #fff; position: relative; border-radius: 5px; overflow: hidden; }
        .bar-fill-hp { height: 100%; background: linear-gradient(90deg, #800, #f00); width: 100%; transition: width 0.4s; }
        .hp-text { position: absolute; width: 100%; text-align: center; color: white; font-weight: bold; line-height: 25px; font-size: 14px; text-shadow: 1px 1px 2px #000; }
        
        #battleMenu { width: 95%; height: 180px; background: rgba(0, 0, 40, 0.95); border: 4px solid #fff; border-radius: 10px; display: grid; grid-template-columns: 300px 1fr; padding: 10px; box-sizing: border-box; }
        .battle-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-battle { background: #0000a0; color: white; border: 2px solid #fff; cursor: pointer; font-size: 18px; }
        #battleLog { border-left: 2px solid #fff; padding: 10px; overflow-y: auto; color: #00ff00; font-family: monospace; font-size: 15px; }

        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 180px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .mmo-panel { width: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; }
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 18px; border-radius: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="pvpMenu">
    <h3 id="pvpTargetName" style="color: gold; margin: 0 0 10px 0;">Spieler</h3>
    <button class="btn-action" id="pvpChallengeBtn" style="background: #ef4444;">HERAUSFORDERN</button>
    <button class="btn-action" onclick="document.getElementById('pvpMenu').style.display='none'">ABBRECHEN</button>
</div>

<div id="arenaLayer">
    <div id="combatScene">
        <div class="combat-unit">
            <h2 id="pNameDisp" style="color: gold; margin:0;">DU</h2>
            <div id="playerVisual" style="height: 120px; display: flex; align-items: center; justify-content: center;"></div>
            <div class="hp-bar-bg">
                <div id="playerHPFill" class="bar-fill-hp"></div>
                <div class="hp-text" id="pHPText">100 / 100</div>
            </div>
        </div>
        <div class="combat-unit">
            <h2 id="enemyNameDisp" style="color: white; margin:0;">GEGNER</h2>
            <div id="enemyVisual" style="height: 120px; display: flex; align-items: center; justify-content: center;"></div>
            <div class="hp-bar-bg">
                <div id="enemyHPFill" class="bar-fill-hp"></div>
                <div class="hp-text" id="eHPText">100 / 100</div>
            </div>
        </div>
    </div>
    <div id="battleMenu">
        <div class="battle-buttons">
            <button class="btn-battle" onclick="arenaAction('attack')">⚔️ ANGRIFF</button>
            <button class="btn-battle" onclick="arenaAction('flee')">🏃 FLUCHT</button>
        </div>
        <div id="battleLog">> Arena bereit...</div>
    </div>
</div>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div class="building" style="left:1200px; top:750px; width:220px; height:220px; background-image:url('./marktplatz.png');" onclick="event.stopPropagation(); openBuilding('markt')"><div class="label">Marktplatz</div></div>
        <div class="building" style="left:400px; top:300px; width:250px; height:250px; background-image:url('./rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Rathaus</div></div>
        <div class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png');" onclick="event.stopPropagation(); openBuilding('schmiede')"><div class="label">Schmiede</div></div>
        <div class="building" style="left:1600px; top:800px; width:280px; height:280px; background-image:url('./arena.png');" onclick="event.stopPropagation(); openBuilding('arena')"><div class="label">Arena</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:gold; font-size: 18px; font-weight:bold;">👑 <span id="playerName">Held</span></div>
    <div id="hudLevel" style="font-size:12px; color: #3b82f6; font-weight: bold;">Evolution: Ei</div>
    <div style="font-size:13px; margin-top:5px;">❤️ HP: <span id="hpC">100</span> / <span id="maxHpC">100</span></div>
    <div style="font-size:11px; color:#fb923c;">⚔️ ATK: <span id="atkC">5</span></div>
    <div style="font-size:11px; color:#4ade80;">💎 LXP: <span id="lxpC">0</span></div>
</div>

<div id="gameModal" class="modal">
    <div class="mmo-panel">
        <div style="flex:2; padding:25px;" id="modalLeft"></div>
        <div style="flex:1; padding:25px; background:rgba(20,15,10,0.5);">
            <h3 style="color:gold;">🎒 RUCKSACK</h3>
            <div id="miniInv"></div>
            <button class="btn-action" style="margin-top:auto;" onclick="toggleModal('gameModal', false)">Schließen X</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8",
    authDomain: "thenest-81de6.firebaseapp.com",
    databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com",
    projectId: "thenest-81de6",
    storageBucket: "thenest-81de6.firebasestorage.app",
    messagingSenderId: "785821659645",
    appId: "1:785821659645:web:684460a421d3c9dcaee994"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myID = "";
let data = JSON.parse(localStorage.getItem('nestData')) || {
    name: "Held", x: 960, y: 540, stein: 0, lxp: 0, followDays: 0, bone: 0, trank: 1, emoji: "🥚"
};

let currentHP, maxHP, battleAtk;
let combat = { active: false, enemyHP: 100, enemyMaxHP: 100 };

function sync() { 
    if(myID) {
        db.ref('players/' + myID).update({
            ...data,
            maxHP: maxHP,
            currentHP: currentHP,
            ep: data.followDays
        });
    }
}

window.onload = () => {
    const p = new URLSearchParams(window.location.search);
    if(p.get('user')) data.name = p.get('user');
    if(p.get('days')) data.followDays = parseInt(p.get('days'));
    
    myID = data.name.replace(/\s+/g, '_');

    maxHP = 100 + (data.followDays * 2);
    battleAtk = 5 + (data.followDays / 10);
    currentHP = maxHP;

    if(data.followDays >= 10) { data.emoji = "🦅"; document.getElementById('hudLevel').innerText = "Evolution: Greif"; }
    else if(data.followDays >= 5) { data.emoji = "🐥"; document.getElementById('hudLevel').innerText = "Evolution: Küken"; }
    else { data.emoji = "🥚"; document.getElementById('hudLevel').innerText = "Evolution: Ei"; }

    const playerRef = db.ref('players/' + myID);
    playerRef.onDisconnect().remove();

    sync();

    db.ref('players').on('value', snap => { renderPlayers(snap.val()); });

    // CHALLENGE LISTENER
    db.ref('players/' + myID + '/challengePending').on('value', snap => {
        if(snap.val() === true) {
            db.ref('players/' + myID + '/challengerName').once('value', cSnap => {
                let challenger = cSnap.val();
                if(confirm("⚔️ HERAUSFORDERUNG von " + challenger + "! Kampf annehmen?")) {
                    db.ref('players/' + challenger).update({ matchActive: true, opponentID: myID });
                    db.ref('players/' + myID).update({ challengePending: false, matchActive: true, opponentID: challenger });
                } else {
                    db.ref('players/' + myID).update({ challengePending: false });
                }
            });
        }
    });

    // SIMULTAN ARENA LISTENER
    db.ref('players/' + myID + '/matchActive').on('value', snap => {
        if(snap.val() === true) {
            db.ref('players/' + myID + '/opponentID').once('value', oSnap => {
                let oppID = oSnap.val();
                db.ref('players/' + oppID).once('value', dSnap => {
                    let oppData = dSnap.val();
                    startArenaFight({ 
                        name: oppData.name, 
                        emoji: oppData.emoji, 
                        hp: 100 + (oppData.followDays * 2) 
                    });
                });
            });
        }
    });

    updateUI();
};

function renderPlayers(players) {
    const layer = document.getElementById('charLayer'); 
    layer.innerHTML = '';
    if(!players) return;

    for(let id in players) {
        const p = players[id]; 

        // --- FILTER LOGIK: HIER WIRD DER OBS-HOST AUSGEBLENDET ---
        // Falls der Name 'Held' lautet, wird die Grafik nicht erstellt.
        if (p.name === "Held") continue; 
        // ---------------------------------------------------------

        const isMe = (p.name === data.name);
        const div = document.createElement('div'); 
        div.className = 'creature';
        div.style.left = p.x + "px"; 
        div.style.top = p.y + "px";
        div.style.zIndex = isMe ? "1001" : "1000";

        let visual = p.emoji === "🥚" ? `<img src="Ei.png">` : `<span style="font-size:60px;">${p.emoji}</span>`;
        div.innerHTML = `${visual}<div class="name-tag" style="${isMe ? 'border-color: gold; color: gold;' : ''}">${p.name} (LVL ${p.followDays || 0})</div>`;

        if(!isMe) {
            div.onclick = (e) => {
                e.stopPropagation();
                const menu = document.getElementById('pvpMenu');
                menu.style.display = 'flex';
                menu.style.left = e.clientX + "px"; 
                menu.style.top = e.clientY + "px";
                document.getElementById('pvpTargetName').innerText = p.name;
                document.getElementById('pvpChallengeBtn').onclick = () => {
                    db.ref('players/' + p.name.replace(/\s+/g, '_')).update({ 
                        challengePending: true, 
                        challengerName: data.name 
                    });
                    alert("Herausforderung verschickt!");
                    menu.style.display = 'none';
                };
            };
        }
        layer.appendChild(div);
    }
}

function startArenaFight(target = null) {
    combat.active = true;
    combat.enemyMaxHP = target ? target.hp : 100;
    combat.enemyHP = combat.enemyMaxHP;
    document.getElementById('arenaLayer').style.display = 'flex';
    document.getElementById('pNameDisp').innerText = `${data.name.toUpperCase()}`;
    document.getElementById('enemyNameDisp').innerText = target ? target.name.toUpperCase() : "GEGNER";
    
    const pVis = document.getElementById('playerVisual');
    pVis.innerHTML = data.emoji === "🥚" ? `<img src="Ei.png" style="height:100px;">` : `<span style="font-size:80px;">${data.emoji}</span>`;
    
    const eVis = document.getElementById('enemyVisual');
    eVis.innerHTML = target ? (target.emoji === "🥚" ? `<img src="Ei.png" style="height:100px;">` : `<span style="font-size:80px;">${target.emoji}</span>`) : "🐗";
    
    updateArenaUI();
}

function arenaAction(type) {
    if(type === 'flee') {
        document.getElementById('arenaLayer').style.display = 'none';
        combat.active = false;
        db.ref('players/' + myID).update({ matchActive: false });
        return;
    }
    let dmg = Math.floor(Math.random() * battleAtk) + 5;
    combat.enemyHP -= dmg;
    document.getElementById('battleLog').innerHTML += `<br>> Treffer für ${dmg} Schaden!`;

    if(combat.enemyHP <= 0) {
        alert("SIEG!");
        data.lxp += 10;
        arenaAction('flee');
        save();
    } else {
        setTimeout(() => {
            let eDmg = Math.floor(Math.random() * 8) + 2;
            currentHP -= eDmg;
            document.getElementById('battleLog').innerHTML += `<br><span style="color:red;">> Konter für ${eDmg} Schaden!</span>`;
            if(currentHP <= 0) {
                alert("Besiegt!");
                currentHP = maxHP;
                arenaAction('flee');
            }
            updateArenaUI();
        }, 500);
    }
    updateArenaUI();
}

function updateArenaUI() {
    document.getElementById('playerHPFill').style.width = (currentHP / maxHP * 100) + "%";
    document.getElementById('pHPText').innerText = `${Math.floor(currentHP)} / ${maxHP}`;
    document.getElementById('enemyHPFill').style.width = (combat.enemyHP / combat.enemyMaxHP * 100) + "%";
    document.getElementById('eHPText').innerText = `${combat.enemyHP} / ${combat.enemyMaxHP}`;
    updateUI();
}

function openBuilding(b) {
    if(b === 'arena') { startArenaFight(); return; }
    toggleModal('gameModal', true);
    document.getElementById('miniInv').innerHTML = `🪨 Steine: ${data.stein}`;
    const left = document.getElementById('modalLeft');
    if(b === 'steinbruch') left.innerHTML = `<h2>Steinbruch</h2><button class="btn-action" onclick="data.stein++; save(); openBuilding('steinbruch')">Sammeln</button>`;
    else if(b === 'markt') left.innerHTML = `<h2>Marktplatz</h2><button class="btn-action" onclick="if(data.stein>=10){data.stein-=10;data.lxp+=5;save();openBuilding('markt')}">10 Stein -> 5 LXP</button>`;
    else left.innerHTML = `<h2>${b}</h2><p>Aktuell keine Aktion.</p>`;
}

function handleWorldClick(e) {
    if(combat.active || document.getElementById('gameModal').style.display === 'flex') return;
    const rect = document.getElementById('world').getBoundingClientRect();
    data.x = (e.clientX - rect.left); 
    data.y = (e.clientY - rect.top);
    save(); 
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }

function updateUI() {
    document.getElementById('playerName').innerText = data.name;
    document.getElementById('hpC').innerText = Math.floor(currentHP);
    document.getElementById('maxHpC').innerText = maxHP;
    document.getElementById('atkC').innerText = battleAtk.toFixed(1);
    document.getElementById('lxpC').innerText = data.lxp;
}

function save() { 
    localStorage.setItem('nestData', JSON.stringify(data)); 
    updateUI(); 
    sync(); 
}
</script>
</body>
</html>
