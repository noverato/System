<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Isekai Nest V3</title>

<style>
/* ========== CORE ========== */
body{
    margin:0;
    background:#050a05 !important;
    overflow:hidden;
    font-family: "Segoe UI", sans-serif;
    color:white;
}

/* ========== LAYOUT ========== */
#uiLeft,#uiRight{
    position:fixed;
    top:0;
    bottom:0;
    width:260px;
    padding:15px;
    background:rgba(20,30,20,.55);
    backdrop-filter: blur(12px);
    border:2px solid gold;
    z-index:9999;
}
#uiLeft{ left:0; }
#uiRight{ right:0; }

#world{
    position:absolute;
    left:260px;
    right:260px;
    top:0;
    bottom:0;
    overflow:hidden;
}

/* ========== FOREST ========== */
#forest{
    position:absolute;
    width:100%;
    height:100%;
    background: radial-gradient(circle at center,#1c2c1c,#050a05);
    z-index:0;
}

/* trees */
.tree{
    position:absolute;
    z-index:0;
    filter:brightness(0.8);
}

/* ========== VILLAGE ========== */
#village{
    position:absolute;
    width:520px;
    height:520px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle,#3b2a18,#1a120a);
    box-shadow:0 0 50px rgba(255,215,120,.6);
    z-index:10;
}

/* light paths */
.path{
    position:absolute;
    background:linear-gradient(to center,#ffd27d,#6b4a2a);
    opacity:.8;
    z-index:9;
}
#pN{ width:80px;height:200px;left:50%;top:-200px;transform:translateX(-50%);}
#pS{ width:80px;height:200px;left:50%;bottom:-200px;transform:translateX(-50%);}
#pW{ height:80px;width:200px;left:-200px;top:50%;transform:translateY(-50%);}
#pE{ height:80px;width:200px;right:-200px;top:50%;transform:translateY(-50%);}

/* buildings */
.building{
    position:absolute;
    width:90px;height:90px;
    background:rgba(50,30,10,.9);
    border:3px solid gold;
    border-radius:10px;
    text-align:center;
    line-height:90px;
    font-size:42px;
    cursor:pointer;
    z-index:20;
}
#forge{left:90px;top:210px;}
#market{right:90px;top:210px;}

/* ========== EGGS ========== */
.egg{
    position:absolute;
    font-size:26px;
    z-index:50;
    transition:left 6s linear, top 6s linear;
    text-shadow:0 5px 10px rgba(0,0,0,.8);
}
.nameTag{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    padding:2px 6px;
    border-radius:6px;
    font-size:11px;
    z-index:60;
}

/* ========== BOSS ========== */
#boss{
    position:absolute;
    font-size:120px;
    z-index:100;
    display:none;
    cursor:pointer;
}
#bossBar{
    position:absolute;
    width:120px;height:8px;
    background:#400;
    border:1px solid #fff;
    top:-15px;left:0;
}
#bossHP{
    height:100%;
    background:red;
}

/* ========== OVERLAYS ========== */
.overlay{
    position:absolute;
    width:400px;height:300px;
    background:rgba(20,30,20,.7);
    backdrop-filter:blur(12px);
    border:3px solid gold;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    z-index:9999;
    display:none;
    padding:15px;
}
.overlay .close{
    position:absolute;
    right:10px;top:5px;
    cursor:pointer;
    color:red;
    font-size:22px;
}

/* Dev button */
#devBtn{
    position:fixed;
    bottom:10px;
    right:280px;
    z-index:9999;
}
</style>
</head>

<body>

<div id="uiLeft">
    <h3>🧬 Status</h3>
    Inventar:<div id="inventory"></div>
</div>

<div id="uiRight">
    <h3>🏰 Dorf</h3>
    Bosse besiegt: <span id="bossKills">0</span>
</div>

<div id="world">
    <div id="forest"></div>

    <div id="village">
        <div id="pN" class="path"></div>
        <div id="pS" class="path"></div>
        <div id="pW" class="path"></div>
        <div id="pE" class="path"></div>

        <div id="forge" class="building">⚒️</div>
        <div id="market" class="building">🏪</div>
    </div>

    <div id="boss">👾<div id="bossBar"><div id="bossHP"></div></div></div>
</div>

<div id="forgeUI" class="overlay"><span class="close" onclick="closeUI()">✖</span>
<h3>Schmiede</h3>
<button onclick="addItem('🗡️')">Schwert</button>
<button onclick="addItem('🛡️')">Rüstung</button>
</div>

<div id="marketUI" class="overlay"><span class="close" onclick="closeUI()">✖</span>
<h3>Markt</h3>
<button onclick="addItem('🧪')">Trank</button>
</div>

<button id="devBtn" onclick="spawnEgg('TestUser'+Math.floor(Math.random()*999))">DEV +1</button>

<script>
const forest=document.getElementById("forest");
const boss=document.getElementById("boss");
const bossHP=document.getElementById("bossHP");
const inventory=document.getElementById("inventory");
let eggs={};
let bossHealth=100;
let kills=0;

/* Trees */
for(let i=0;i<200;i++){
  let t=document.createElement("div");
  t.className="tree";
  t.textContent=Math.random()>0.5?"🌲":"🌳";
  t.style.fontSize=20+Math.random()*20+"px";
  t.style.left=Math.random()*window.innerWidth+"px";
  t.style.top=Math.random()*window.innerHeight+"px";
  forest.appendChild(t);
}

/* Spawn egg */
function spawnEgg(name){
  if(eggs[name]) return;
  let e=document.createElement("div");
  e.className="egg";
  e.textContent="🥚";
  e.xp=0;
  let tag=document.createElement("div");
  tag.className="nameTag";
  tag.textContent=name;
  e.appendChild(tag);
  forest.appendChild(e);
  eggs[name]=e;
  moveEgg(e);
  setInterval(()=>{
    e.xp++;
    if(e.xp>100) e.textContent="💀";
    else if(e.xp>50) e.textContent="💧";
    e.appendChild(tag);
  },1000);
}

/* Move */
function moveEgg(e){
  setInterval(()=>{
    let x=Math.random()*window.innerWidth;
    let y=Math.random()*window.innerHeight;
    e.style.left=x+"px";
    e.style.top=y+"px";
  },6000);
}

/* Boss */
setInterval(()=>{
  boss.style.display="block";
  bossHealth=100;
  bossHP.style.width="100%";
  boss.style.left=Math.random()*window.innerWidth+"px";
  boss.style.top=Math.random()*window.innerHeight+"px";
},30000);

boss.onclick=()=>{
  bossHealth-=20;
  bossHP.style.width=bossHealth+"%";
  if(bossHealth<=0){
    boss.style.display="none";
    kills++;
    document.getElementById("bossKills").textContent=kills;
  }
};

/* UI */
document.getElementById("forge").onclick=()=>document.getElementById("forgeUI").style.display="block";
document.getElementById("market").onclick=()=>document.getElementById("marketUI").style.display="block";
function closeUI(){document.querySelectorAll(".overlay").forEach(o=>o.style.display="none");}
function addItem(i){inventory.innerHTML+=" "+i;}

/* Websocket */
const ws=new WebSocket("ws://localhost:8080");
ws.onmessage=e=>{
 try{
  const d=JSON.parse(e.data);
  if(d.data?.displayName) spawnEgg(d.data.displayName);
 }catch{}
};
</script>
</body>
</html>
