<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Overlord Edition 2026 - Evolution Lore Build</title>

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;700&display=swap" rel="stylesheet">

    <script src="items.js"></script> <script src="loot.js"></script>
    <script src="storage.js"></script>
    <script src="evolution.js"></script> <script src="mining.js"></script> <script src="inventar.js"></script>
    <script src="markt.js"></script>
    <script src="battle.js"></script>
    <script src="admin.js"></script>

    <style>
        :root { 
            --fantasy-bg: rgba(25, 15, 10, 0.98); 
            --gold: #ffd700; --border: 2px solid #ffd700; 
            --shadow: 0 0 25px rgba(255, 215, 0, 0.6); 
            --btn-grad: linear-gradient(135deg, #b8860b, #8b4513); 
            --hp-color: #ff4444; --mp-color: #3b82f6;
            --warrior: #ef4444; --mage: #3b82f6; --ranger: #22c55e; --craft: #eab308; --shadow-path: #a855f7;
            --ff-blue: rgba(0, 0, 150, 0.9);
        }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; cursor: crosshair; }
        #charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        
        /* --- EVOLUTION INTERFACE CSS --- */
        .evo-container { padding: 20px; text-align: center; }
        .evo-status-bar { background: rgba(0,0,0,0.6); border: 2px solid var(--gold); padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 22px; }
        
        .requirement-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .req-box { background: rgba(255,215,0,0.05); border: 1px solid rgba(255,215,0,0.3); padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; }
        .req-box.met { border-color: #4ade80; color: #4ade80; box-shadow: inset 0 0 10px rgba(74, 222, 128, 0.2); }
        .req-box.locked { color: #ff4444; border-color: #ff4444; }

        .class-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .class-tile { 
            background: rgba(20, 15, 10, 0.8); border: 1px solid var(--gold); padding: 20px 10px; border-radius: 10px; 
            cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px;
        }
        
        /* Schrift-Styling für die Klassen-Namen */
        .class-tile h4 { 
            margin: 0; color: var(--gold); font-size: 20px; text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 2px 2px 4px #000;
        }

        .class-tile:hover:not(.locked) { transform: translateY(-5px); background: rgba(255,215,0,0.15); box-shadow: var(--shadow); }
        
        /* Locked State - Optimierte Lesbarkeit */
        .class-tile.locked { filter: grayscale(0.5); opacity: 0.7; cursor: not-allowed; border-color: #555; }
        .class-tile.locked h4 { color: #aaa; } /* Grau aber lesbar */
        
        .class-tile.locked::after { 
            content: "🔒 GESPERRT"; 
            position: absolute; 
            bottom: 8px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-weight: bold; 
            color: #ff4444; 
            font-size: 11px; 
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            border-radius: 4px;
            width: 80%;
            text-align: center;
        }

        .path-selection { display: flex; gap: 30px; justify-content: center; margin-top: 40px; border-top: 2px solid var(--gold); padding-top: 20px; }
        .path-card { width: 220px; padding: 25px; border-radius: 15px; cursor: pointer; transition: 0.4s; text-align: center; border: 2px solid transparent; }
        .path-light { background: linear-gradient(135deg, #fffceb, #ffd700); color: #000; font-weight: bold; box-shadow: 0 0 15px #ffd700; }
        .path-dark { background: linear-gradient(135deg, #1a0026, #a855f7); color: #fff; border: 2px solid #fff; box-shadow: 0 0 15px #a855f7; }

        /* HUD & Creatures */
        .creature { position: absolute; width: 80px; height: 100px; text-align: center; transform: translate(-50%, -50%); transition: all 0.6s ease-out; pointer-events: auto; }
        .creature img { height: 80px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
        .name-tag { font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 12px; border-radius: 6px; border: 1px solid var(--gold); margin-top: 5px; white-space: nowrap; }
        .boss-aura { border: 2px solid #ff0000 !important; color: #ff0000 !important; box-shadow: 0 0 20px #ff0000; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 200px; box-shadow: var(--shadow); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .mmo-panel { width: 1250px; height: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; box-shadow: var(--shadow); }
        .panel-main { flex: 3; padding: 20px; overflow-y: auto; position: relative; }
        .panel-side { flex: 0.8; padding: 25px; background: rgba(20, 15, 10, 0.85); border-left: 2px solid var(--gold); display: flex; flex-direction: column; }
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-action:hover:not(:disabled) { filter: brightness(1.2); transform: scale(1.05); }
        .btn-action:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(1); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div id="b-steinbruch" class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div id="b-schmiede" class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png');" onclick="event.stopPropagation(); openBuilding('schmiede')"><div class="label">Wald-Schmiede</div></div>
        <div id="b-arena" class="building" style="left:300px; top:700px; width:200px; height:200px; background-image:url('./arena.png');" onclick="event.stopPropagation(); openBuilding('arena')"><div class="label">PvP Arena</div></div>
        <div id="b-rathaus" class="building" style="left:1000px; top:600px; width:250px; height:250px; background-image:url('./rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Halle der Evolution</div></div>
        <div id="b-markt" class="building" style="left:1200px; top:800px; width:180px; height:180px; background-image:url('./Marktplatz.png'); filter:hue-rotate(90deg);" onclick="event.stopPropagation(); openBuilding('markt')"><div class="label">Marktplatz</div></div>
        <div id="b-heilige" class="building" style="left:500px; top:250px; width:180px; height:180px; background-image:url('./heilige_schmiede.png'); filter:brightness(1.5);" onclick="event.stopPropagation(); openBuilding('heilige')"><div class="label">Heilige Schmiede</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:gold; font-size: 20px; font-weight:bold;"><span id="playerName">Identifiziere...</span></div>
    <div id="hudClass" style="font-size:13px; color: #3b82f6; font-weight: bold;">Klasse...</div>
    <div style="font-size:12px; color:#4ade80; margin-top: 5px;">💎 LXP: <span id="lxpC">0</span> | ⭐ LVL: <span id="lvlTotal">0</span> | 👥 Follower: <span id="isFollower">Prüfe...</span></div>
    <div style="font-size:10px; color: #aaa;">⏳ Follow: <span id="followDaysDisplay">0</span> Tage</div>
    <div id="adminHud" style="display:none; margin-top:10px;"><button class="btn-action" style="background:linear-gradient(135deg, #ff0000, #8b0000); width:100%;" onclick="openAdminPanel()">🛠 GÖTTER-MENÜ</button></div>
    <button class="btn-action" style="background:#ff4444; width:100%; margin-top:10px; border-color:#fff;" onclick="exitGame()">❌ NEST VERLASSEN</button>
</div>

<div id="gameModal" class="modal">
    <div class="mmo-panel">
        <div class="panel-main" id="modalLeft">
            <div id="admin-item-grid" style="width: 100%; min-height: 100px; position: relative; z-index: 10;"></div>
        </div>
        <div class="panel-side">
            <h3 style="color:gold; margin-top:0;">🎒 RUCKSACK</h3>
            <div id="miniInv" style="flex-grow: 1; overflow-y: auto;"></div>
            <button class="btn-action" style="width:100%; margin-top:20px;" onclick="closeGeneralModal()">X SCHLIESSEN</button>
        </div>
    </div>
</div>

<template id="evo-hall-template">
    <div class="evo-container">
        <h2 style="color:gold; font-size: 32px; text-shadow: 0 0 15px rgba(255,215,0,0.5);">Halle der Evolution</h2>
        <div class="evo-status-bar">
            Aktuelle Form: <span id="current-form-display" style="color:#00ffff; font-weight:bold; text-shadow: 0 0 5px #00ffff;">Prüfe...</span>
        </div>

        <h3 style="text-align:left; color:var(--gold); border-bottom: 1px solid gold; padding-bottom: 5px;">Lore-Anforderungen</h3>
        <div class="requirement-grid">
            <div class="req-box" id="req-lxp">LXP: <span id="evo-lxp-val">0</span> / 5.000</div>
            <div class="req-box" id="req-lvl">Level: <span id="evo-lvl-val">0</span> / <span id="evo-lvl-req">30</span></div>
            <div class="req-box" id="req-ep">EP (Daily): <span id="evo-ep-val">0</span> / <span id="evo-ep-req">30</span></div>
        </div>

        <div style="background:rgba(0,255,255,0.1); border:1px solid #00ffff; padding:12px; border-radius:8px; margin-top:-15px; margin-bottom:25px; font-size: 18px;">
            ✨ XP-SPEICHER: <span id="evo-buffer-val" style="color:#00ffff; font-weight:bold;">0</span> LXP (bereit für Evolution)
        </div>

        <h3 style="text-align:left; color:var(--gold); border-bottom: 1px solid gold; padding-bottom: 5px;">Die 7 Pfade der Bestimmung</h3>
        <div class="class-grid">
            <div class="class-tile locked" id="evo-class-waldlaeufer"><h4>Waldläufer</h4></div>
            <div class="class-tile locked" id="evo-class-krieger"><h4>Krieger</h4></div>
            <div class="class-tile locked" id="evo-class-druide"><h4>Druide</h4></div>
            <div class="class-tile locked" id="evo-class-hueter"><h4>Hüter</h4></div>
            <div class="class-tile locked" id="evo-class-sucher"><h4>Sucher</h4></div>
            <div class="class-tile locked" id="evo-class-einsiedler"><h4>Einsiedler</h4></div>
            <div class="class-tile locked" id="evo-class-waechter"><h4>Wächter</h4></div>
        </div>

        <div id="alignment-section" style="display:none;">
            <h3 style="margin-top:40px; color:var(--gold); border-bottom: 1px solid gold; padding-bottom: 5px;">Zweig der Gesinnung (Stufe 3)</h3>
            <div class="path-selection">
                <div class="path-card path-light" onclick="chooseEvoPath('Licht')">
                    <h3>LICHT-PFAD</h3>
                    <p style="font-size:13px; margin-top: 5px;">Glanz, Schutz & göttliche Macht</p>
                </div>
                <div class="path-card path-dark" onclick="chooseEvoPath('Dunkel')">
                    <h3>DUNKEL-PFAD</h3>
                    <p style="font-size:13px; margin-top: 5px;">Schatten, Chaos & Leere</p>
                </div>
            </div>
        </div>
    </div>
</template>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// --- KONFIGURATION (UNBERÜHRT) ---
const firebaseConfig = { apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8", authDomain: "thenest-81de6.firebaseapp.com", databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com", projectId: "thenest-81de6" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const TWITCH_CLIENT_ID = "futhxsgrshkh2h6cqywavg5cous3q0";
const BROADCASTER_ID = "573773653";
const REDIRECT_URI = "https://noverato.github.io/System";
let data = { name: "Held", x: 960, y: 540, lxp: 0, hp: 100, maxHp: 100, stats: { totalEvoLevel: 0, currentLevel: 0, className: "Ei" }, inventar: {}, ep: 0, followDays: 0, lxpBuffer: 0 };
let twitchToken = "", verifiedID = "", isIdentified = false, onlinePlayers = {}, isAdmin = false;

async function checkTwitchAuth() {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    if (params.has("access_token")) {
        twitchToken = params.get("access_token");
        window.history.replaceState({}, document.title, window.location.pathname);
        return true;
    }
    return false;
}

async function initTwitchSession() {
    if (!twitchToken) return;
    try {
        const resp = await fetch(`https://api.twitch.tv/helix/users`, {
            headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${twitchToken}` }
        });
        const result = await resp.json();
        if (result.data && result.data.length > 0) {
            const twitchUser = result.data[0];
            verifiedID = twitchUser.id;
            data.name = twitchUser.display_name;
            isIdentified = true;
            isAdmin = (verifiedID === BROADCASTER_ID);
            await loadUserData();
        }
    } catch (err) { console.error("Identity Error:", err); }
}

async function loadUserData() {
    if (!verifiedID) return;
    try {
        const snapshot = await db.ref('players/' + verifiedID).once('value');
        if (snapshot.exists()) {
            const dbData = snapshot.val();
            data = { ...data, ...dbData };
        } else {
            save();
        }
        updateUI();
    } catch (err) { console.error("Sync Error:", err); }
}

function save() {
    if (!verifiedID || !isIdentified) return;
    db.ref('players/' + verifiedID).update({ ...data, lastSeen: Date.now() });
}

function updateUI() {
    document.getElementById('playerName').innerText = isAdmin ? "OVERLORD " + data.name : data.name;
    document.getElementById('hudClass').innerText = data.stats.className;
    document.getElementById('lxpC').innerText = data.lxp;
    document.getElementById('lvlTotal').innerText = data.stats.currentLevel;
    document.getElementById('followDaysDisplay').innerText = data.followDays;
    if(isAdmin) document.getElementById('adminHud').style.display = 'block';
}

function renderPlayers(players) {
    const layer = document.getElementById('charLayer'); layer.innerHTML = '';
    Object.keys(players).forEach(id => {
        const p = players[id];
        if (p.hidden || (Date.now() - (p.lastSeen || 0) > 60000)) return;
        const div = document.createElement('div');
        div.className = 'creature';
        div.style.left = p.x + "px";
        div.style.top = p.y + "px";
        const imgSrc = (typeof getCreatureSprite === 'function') ? getCreatureSprite(p, id === BROADCASTER_ID) : 'Ei.png';
        div.innerHTML = `<img src="${imgSrc}"><div class="name-tag ${id===BROADCASTER_ID?'boss-aura':''}">${p.name}</div>`;
        layer.appendChild(div);
    });
}

window.onload = async () => {
    const authenticated = await checkTwitchAuth();
    if (authenticated) {
        await initTwitchSession();
        db.ref('players').on('value', snap => {
            onlinePlayers = snap.val() || {};
            renderPlayers(onlinePlayers);
        });
    } else {
        const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=user:read:email`;
        window.location.href = authUrl;
    }
};

function handleWorldClick(e) {
    if (!isIdentified) return;
    const rect = document.getElementById('world').getBoundingClientRect();
    data.x = e.clientX - rect.left;
    data.y = e.clientY - rect.top;
    save();
}

function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
function closeGeneralModal() { toggleModal('gameModal', false); }

function openBuilding(b) { 
    toggleModal('gameModal', true);
    const left = document.getElementById('modalLeft');
    left.innerHTML = ''; 

    if (b === 'steinbruch') renderMiningMenu(); 
    else if (b === 'rathaus') {
        const temp = document.getElementById('evo-hall-template');
        left.appendChild(temp.content.cloneNode(true));
        if (typeof initEvoHallDisplay === 'function') {
            initEvoHallDisplay(); 
        }
    } 
    else if (b === 'markt') renderMarketplace(); 
    else if (b === 'arena') renderArenaMatchmaking();
}
</script>
</body>
</html>
