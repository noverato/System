<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nest: Overlord Edition 2026 - Divine Bridge Build</title>
    <style>
        :root { 
            --fantasy-bg: rgba(25, 15, 10, 0.98); 
            --gold: #ffd700; --border: 2px solid #ffd700; 
            --shadow: 0 0 25px rgba(255, 215, 0, 0.6); 
            --btn-grad: linear-gradient(135deg, #b8860b, #8b4513); 
            --hp-color: #ff4444; --mp-color: #3b82f6;
            --warrior: #ef4444; --mage: #3b82f6; --ranger: #22c55e; --craft: #eab308; --shadow-path: #a855f7;
            --ff-blue: rgba(0, 0, 150, 0.9);
        }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Crimson Text', serif; background: #000; color: #fdf5e6; }
        #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
        #world { width: 1920px; height: 1080px; background: url('./wald.png') no-repeat center; background-size: cover; position: absolute; transition: transform 0.1s ease-out; cursor: crosshair; }
        #charLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .creature { position: absolute; width: 80px; height: 100px; text-align: center; transform: translate(-50%, -50%); transition: left 0.8s ease-out, top 0.8s ease-out; pointer-events: auto; }
        .creature img { height: 80px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
        .name-tag { font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 2px 12px; border-radius: 6px; border: 1px solid var(--gold); margin-top: 5px; white-space: nowrap; }
        .boss-aura { border: 2px solid #ff0000 !important; color: #ff0000 !important; box-shadow: 0 0 20px #ff0000; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .building { position: absolute; background-size: contain; background-repeat: no-repeat; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; }
        .label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: var(--fantasy-bg); color: var(--gold); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--gold); font-weight: bold; }
        
        #hud { position: fixed; top: 20px; left: 20px; background: var(--fantasy-bg); padding: 15px; border-radius: 12px; border: var(--border); z-index: 5000; min-width: 200px; box-shadow: var(--shadow); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 20000; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
        .mmo-panel { width: 1250px; height: 850px; background: var(--fantasy-bg); border: var(--border); border-radius: 20px; display: flex; overflow: hidden; box-shadow: var(--shadow); }
        .panel-main { flex: 3; padding: 20px; overflow-y: auto; position: relative; }
        .panel-side { flex: 0.8; padding: 25px; background: rgba(20, 15, 10, 0.85); border-left: 2px solid var(--gold); display: flex; flex-direction: column; }
        
        .btn-action { background: var(--btn-grad); color: white; border: 1px solid var(--gold); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-action:hover:not(:disabled) { filter: brightness(1.2); transform: scale(1.05); }
        .btn-action:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(1); }

        #battleInvite { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--ff-blue); border: 3px solid #fff; padding: 30px; z-index: 30000; display: none; text-align: center; box-shadow: 0 0 50px #000; border-radius: 15px; }

        #arenaStage { width: 100%; height: 100%; background: url('./arena_innen.png') no-repeat center; background-size: cover; position: relative; display: flex; align-items: center; justify-content: space-around; overflow: hidden; }
        .combatant-wrap { display: flex; flex-direction: column; align-items: center; width: 300px; z-index: 5; }
        .combatant-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 15px rgba(0,0,0,0.5)); }
        #ffMenu { position: absolute; bottom: 0; left: 0; width: 100%; height: 220px; background: var(--ff-blue); border-top: 4px solid #fff; display: flex; box-sizing: border-box; }
        .ff-buttons { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
        .ff-status { flex: 1.2; padding: 20px; border-left: 2px solid #fff; display: flex; flex-direction: column; justify-content: center; }
        .bar-wrap { height: 18px; background: #000; border: 2px solid #fff; border-radius: 4px; overflow: hidden; margin-bottom: 10px; position: relative; }
        
        #playerHpFill { background: linear-gradient(to right, #8a2be2, #4b0082) !important; box-shadow: 0 0 15px #8a2be2; height: 100%; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #enemyHpFill { background: linear-gradient(to right, #ff4500, #ff0000) !important; box-shadow: 0 0 15px #ff4500; height: 100%; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="world" onclick="handleWorldClick(event)">
        <div class="building" style="left:1500px; top:200px; width:220px; height:220px; background-image:url('./steinbruch.png');" onclick="event.stopPropagation(); openBuilding('steinbruch')"><div class="label">Steinbruch</div></div>
        <div class="building" style="left:700px; top:500px; width:180px; height:180px; background-image:url('./schmiede.png');" onclick="event.stopPropagation(); openBuilding('wald')"><div class="label">Wald-Schmiede</div></div>
        <div class="building" style="left:300px; top:700px; width:200px; height:200px; background-image:url('./arena.png');" onclick="event.stopPropagation(); openBuilding('arena')"><div class="label">PvP Arena</div></div>
        <div class="building" style="left:1000px; top:600px; width:250px; height:250px; background-image:url('./rathaus.png');" onclick="event.stopPropagation(); openBuilding('rathaus')"><div class="label">Halle der Evolution</div></div>
        <div id="charLayer"></div>
    </div>
</div>

<div id="hud">
    <div style="color:gold; font-size: 20px; font-weight:bold;"><span id="playerName">Magie wirkt...</span></div>
    <div id="hudClass" style="font-size:13px; color: #3b82f6; font-weight: bold;">Identifikation...</div>
    <div style="font-size:12px; color:#4ade80; margin-top: 5px;">💎 LXP: <span id="lxpC">0</span> | ⭐ LVL: <span id="lvlTotal">0</span> | 👥 Follower: <span id="isFollower">Prüfe...</span></div>
    <div style="font-size:10px; color: #aaa;">⏳ Follow: <span id="followDaysDisplay">0</span> Tage</div>
    <div id="adminHud" style="display:none; margin-top:10px;"><button class="btn-action" style="background:linear-gradient(135deg, #ff0000, #8b0000); width:100%;" onclick="openAdminPanel()">🛠 GÖTTER-MENÜ</button></div>
    <button class="btn-action" style="background:#ff4444; width:100%; margin-top:10px; border-color:#fff;" onclick="exitGame()">❌ NEST VERLASSEN</button>
</div>

<div id="battleInvite">
    <h2 style="color:#fff; margin-top:0;">⚔️ HERAUSFORDERUNG!</h2>
    <p id="inviteText" style="color:gold; font-size:18px;"></p>
    <button class="btn-action" id="btnAcceptInvite">ANNEHMEN</button>
    <button class="btn-action" style="background:#444;" onclick="cancelChallenge()">IGNORIEREN</button>
</div>

<div id="gameModal" class="modal">
    <div class="mmo-panel">
        <div class="panel-main" id="modalLeft"></div>
        <div class="panel-side">
            <h3 style="color:gold; margin-top:0;">🎒 RUCKSACK</h3>
            <div id="miniInv" style="flex-grow: 1; overflow-y: auto;"></div>
            <button class="btn-action" style="width:100%; margin-top:20px;" onclick="closeGeneralModal()">X SCHLIESSEN</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ==========================================
// SECTION 1: CONFIG
// ==========================================
const firebaseConfig = { apiKey: "AIzaSyCKNXJ-ouAOAcLr5ut-EemWQI8_zJxhqa8", authDomain: "thenest-81de6.firebaseapp.com", databaseURL: "https://thenest-81de6-default-rtdb.firebaseio.com", projectId: "thenest-81de6" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const TWITCH_CLIENT_ID = "futhxsgrshkh2h6cqywavg5cous3q0";
const BROADCASTER_ID = "573773653";
const REDIRECT_URI = "https://noverato.github.io/System";
const BOSS_NAME = "Spawn2909";

const EVO_IMGS = ['Ei.png', 'Schleim.png', 'Skelett.png', 'Goblin.png', 'Oger.png', 'Lich.png', 'HoeheresWesen.png'];
const MONSTERS = [
    { name: "Waldschleim", hp: 40, maxHp: 40, lxp: 15, img: 'Monster1.png' },
    { name: "Frost-Wolf", hp: 80, maxHp: 80, lxp: 35, img: 'Monster2.png' },
    { name: "Finster-Goblin", hp: 120, maxHp: 120, lxp: 60, img: 'Monster3.png' }
];

let twitchToken = "";
let isLoadingFollower = true; 
let isIdentified = false; 
let data = { 
    name: "Held", x: 960, y: 540, lxp: 0, hp: 100, maxHp: 100, mp: 50, maxMp: 50, 
    followDays: 0, isFollower: false, inventar: {}, 
    stats: { warrior: 0, mage: 0, ranger: 0, craftsman: 0, shadow: 0, totalEvoLevel: 0, className: "Novize" },
    battleAction: "none", battleReady: false, hidden: false
};
let myID = "", onlinePlayers = {}, isAdmin = false, currentEnemy = null, isActionLocked = false, activeBattleID = null;
let arenaFallbackTimer = null;
let forceArenaSync = false;

// ==========================================
// SECTION 2: IDENTITY
// ==========================================
function checkTwitchAuth() {
    const hash = window.location.hash.substring(1);
    if (!hash) return false;
    const params = new URLSearchParams(hash);
    if (params.has("access_token")) {
        twitchToken = params.get("access_token");
        window.history.replaceState({}, document.title, window.location.pathname);
        return true;
    }
    return false;
}

function redirectToTwitch(userName) {
    const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=moderator:read:followers&state=${userName}`;
    window.location.href = authUrl;
}

async function initTwitchSession() {
    if (!twitchToken) return;
    try {
        const resp = await fetch(`https://api.twitch.tv/helix/users`, {
            headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${twitchToken}` }
        });
        const result = await resp.json();
        if (result.data && result.data.length > 0) {
            const twitchUser = result.data[0];
            if (twitchUser.id) {
                data.name = twitchUser.display_name;
                myID = twitchUser.id;
                isIdentified = true; 
                if (myID === BROADCASTER_ID) isAdmin = true;
                await loadUserData(); 
                await validateTwitchFollower(myID);
            }
        }
    } catch (err) { console.error("Twitch Session Error:", err); }
    updateUI();
}

async function validateTwitchFollower(userID) {
    try {
        const followUrl = `https://api.twitch.tv/helix/channels/followers?broadcaster_id=${BROADCASTER_ID}&user_id=${userID}`;
        const resp = await fetch(followUrl, {
            headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${twitchToken}` }
        });
        const followData = await resp.json();
        if (followData.data && followData.data.length > 0) {
            data.isFollower = true;
            const followDate = new Date(followData.data[0].followed_at);
            data.followDays = Math.ceil(Math.abs(new Date() - followDate) / (1000 * 60 * 60 * 24));
        } else {
            data.isFollower = false;
        }
    } catch (err) { console.error("Follow Check Error:", err); }
    finally {
        isLoadingFollower = false;
        updateUI();
    }
}

// ==========================================
// SECTION 3: FIREBASE CORE
// ==========================================
async function loadUserData() {
    if (!myID) return;
    try {
        const snapshot = await db.ref('players/' + myID).once('value');
        if (snapshot.exists()) {
            const dbData = snapshot.val();
            data.lxp = dbData.lxp || 0;
            data.stats = dbData.stats || data.stats;
            data.inventar = dbData.inventar || {};
            data.hp = dbData.hp || data.maxHp;
            data.x = dbData.x || 960;
            data.y = dbData.y || 540;
        }
    } catch (err) { console.error("Load Error:", err); }
    updateUI();
}

function save() {
    localStorage.setItem('nestData', JSON.stringify(data));
    updateUI(); 
    if (isIdentified && myID && !isLoadingFollower) {
        db.ref('players/' + myID).update({
            hp: data.hp, lxp: data.lxp, x: data.x, y: data.y, name: data.name,
            stats: data.stats, inventar: data.inventar, 
            isFollower: data.isFollower, followDays: data.followDays, 
            battleAction: data.battleAction, battleReady: data.battleReady, hidden: data.hidden,
            lastSeen: Date.now()
        });
    }
}

function updateUI() {
    document.getElementById('playerName').innerText = isAdmin ? "OVERLORD Spawn2909" : (isLoadingFollower ? "Magie wirkt..." : data.name);
    document.getElementById('hudClass').innerText = isAdmin ? "SYSTEM-ARCHITEKT" : (data.stats.className || "Novize");
    document.getElementById('lxpC').innerText = data.lxp;
    document.getElementById('lvlTotal').innerText = data.stats.totalEvoLevel;
    const followDisplay = document.getElementById('isFollower');
    followDisplay.innerText = isLoadingFollower ? "Prüfe..." : (data.isFollower ? "Ja" : "Nein");
    if(isAdmin) document.getElementById('adminHud').style.display = 'block';
    const invDiv = document.getElementById('miniInv'); invDiv.innerHTML = '';
    if(data.inventar) {
        Object.keys(data.inventar).forEach(i => { if(data.inventar[i]>0) invDiv.innerHTML += `<div style="padding:5px; border-bottom:1px solid #444;">${i} x${data.inventar[i]}</div>`; });
    }
}

function exitGame() {
    if(myID) {
        db.ref('players/' + myID).remove().then(() => {
            localStorage.removeItem('nestData');
            location.href = REDIRECT_URI;
        });
    }
}

function renderPlayers(players) {
    const layer = document.getElementById('charLayer'); layer.innerHTML = '';
    Object.keys(players).forEach(id => {
        const p = players[id];
        if (p.hidden || !p.name || (Date.now() - (p.lastSeen || 0) > 60000)) return;
        const div = document.createElement('div'); div.className = 'creature';
        div.style.left = p.x + "px"; div.style.top = p.y + "px";
        const isBoss = (id === BROADCASTER_ID);
        const imgIdx = Math.min(Math.max((p.stats?.totalEvoLevel || 0), 0), 6);
        const imgSrc = isBoss ? 'Overlord.png' : EVO_IMGS[imgIdx];
        div.innerHTML = `<img src="${imgSrc}" onerror="this.src='Ei.png'"><div class="name-tag ${isBoss?'boss-aura':''}">${isBoss?'OVERLORD':p.name}</div>`;
        layer.appendChild(div);
    });
}

// ==========================================
// SECTION 4: ARENA-SYNC
// ==========================================
function listenForChallenges() {
    if (!myID) return;
    
    db.ref('battles').on('value', snap => {
        const allBattles = snap.val() || {};
        
        if (activeBattleID) {
            const b = allBattles[activeBattleID];
            if (!b || b.status === 'finished') {
                activeBattleID = null;
                currentEnemy = null;
                isActionLocked = false;
                forceArenaSync = false;
                if(arenaFallbackTimer) clearTimeout(arenaFallbackTimer);
                toggleModal('gameModal', false);
                return;
            }
        }

        Object.keys(allBattles).forEach(bID => {
            const battle = allBattles[bID];

            if (battle.defenderID === myID && battle.status === 'pending' && !activeBattleID) {
                const inviteBox = document.getElementById('battleInvite');
                document.getElementById('inviteText').innerText = battle.attackerName + " fordert dich!";
                inviteBox.style.display = 'block';
                document.getElementById('btnAcceptInvite').onclick = () => {
                    db.ref('battles/' + bID).update({ status: 'active' });
                    inviteBox.style.display = 'none';
                };
            }

            if ((battle.attackerID === myID || battle.defenderID === myID) && battle.status === 'active') {
                if (!currentEnemy || activeBattleID !== bID) {
                    activeBattleID = bID;
                    const oppID = (battle.attackerID === myID) ? battle.defenderID : battle.attackerID;
                    
                    if(onlinePlayers[oppID]) {
                        toggleModal('gameModal', true);
                        startCombat(onlinePlayers[oppID], false, oppID);
                    }
                }

                const atkStat = battle.actions[battle.attackerID];
                const defStat = battle.actions[battle.defenderID];
                const log = document.getElementById('battleLog');

                if (log && atkStat && defStat) {
                    // SYNCHRONISIERUNG: Prüfe inArena Flagge oder erzwungenen Sync
                    if ((atkStat.inArena && defStat.inArena) || forceArenaSync) {
                        if (!isActionLocked) {
                            log.innerText = forceArenaSync ? "Synchronisation erzwungen! Wahl treffen..." : "Synchronisiert! Deine Wahl?";
                            document.getElementById('btnAtk').disabled = false;
                            document.getElementById('btnHeal').disabled = false;
                        }
                    } else {
                        log.innerText = "Synchronisation... Warte auf Gegner.";
                        document.getElementById('btnAtk').disabled = true;
                        document.getElementById('btnHeal').disabled = true;
                    }
                }

                if (atkStat?.ready && defStat?.ready && !isActionLocked) {
                    resolvePvPTurn(battle);
                }
            }
        });
    });
}

async function challengePlayer(targetID, targetName) {
    if (!isIdentified || (!data.isFollower && !isAdmin)) return alert("Nur aktive Follower dürfen fordern!");
    if (activeBattleID) return alert("Kampf läuft bereits!");
    
    const bID = targetID; 
    await db.ref('battles/' + bID).remove();
    
    activeBattleID = bID;
    db.ref('battles/' + bID).set({
        attackerName: data.name, attackerID: myID,
        defenderName: targetName, defenderID: targetID,
        status: 'pending', timestamp: Date.now(),
        actions: {
            [myID]: { type: 'none', ready: false, inArena: false },
            [targetID]: { type: 'none', ready: false, inArena: false }
        }
    });
}

function cancelChallenge() {
    document.getElementById('battleInvite').style.display = 'none';
    db.ref('battles/' + myID).remove();
}

function startCombat(enemy, isMonster, enemyID = null) {
    if(document.getElementById('gameModal').style.display !== 'flex') toggleModal('gameModal', true);
    
    isActionLocked = false;
    forceArenaSync = false;

    // FALLBACK TIMER: Erzwinge Kampfstart nach 5 Sekunden
    if (!isMonster) {
        if(arenaFallbackTimer) clearTimeout(arenaFallbackTimer);
        arenaFallbackTimer = setTimeout(() => {
            if (activeBattleID && !isActionLocked) {
                console.log("Arena Fallback: Erzwinge Synchronisation.");
                forceArenaSync = true;
            }
        }, 5000);
    }

    if (isMonster) {
        currentEnemy = { ...MONSTERS[Math.floor(Math.random() * MONSTERS.length)], isMonster: true, maxHp: 100 };
        if(!currentEnemy.hp) currentEnemy.hp = currentEnemy.maxHp;
    } else {
        const isBoss = (enemyID === BROADCASTER_ID);
        currentEnemy = { ...enemy, id: enemyID, isMonster: false, img: (isBoss ? 'Overlord.png' : EVO_IMGS[enemy.stats?.totalEvoLevel || 0]) };
    }
    renderCombatStage();
}

function renderCombatStage() {
    const left = document.getElementById('modalLeft');
    const myImg = (isAdmin ? 'Overlord.png' : EVO_IMGS[data.stats?.totalEvoLevel || 0]);
    
    // SOFORT-CHECK: Meldung an DB, sobald Arena gerendert wird
    if (activeBattleID && !currentEnemy.isMonster) {
        db.ref('battles/' + activeBattleID + '/actions/' + myID).update({ inArena: true });
    }

    left.innerHTML = `<div id="arenaStage">
        <div class="combatant-wrap"><img src="${myImg}" onerror="this.src='Ei.png'" class="combatant-img"><br><strong>${data.name}</strong></div>
        <div class="combatant-wrap"><img src="${currentEnemy.img || 'Monster1.png'}" onerror="this.src='Ei.png'" class="combatant-img"><br><strong>${currentEnemy.name}</strong></div>
        <div id="ffMenu">
            <div class="ff-buttons">
                <button id="btnAtk" class="btn-action" disabled onclick="executeCombatAction('attack')">ATTACKE</button>
                <button id="btnHeal" class="btn-action" disabled onclick="executeCombatAction('heal')">HEILUNG</button>
                <button class="btn-action" onclick="endCombat()">FLUCHT</button>
            </div>
            <div class="ff-status">
                <div class="bar-wrap"><div id="playerHpFill" style="width:${(data.hp/data.maxHp)*100}%;"></div></div>
                <div class="bar-wrap"><div id="enemyHpFill" style="width:${(currentEnemy.hp/currentEnemy.maxHp)*100}%;"></div></div>
            </div>
        </div>
        <div id="battleLog">Warte auf Magie...</div>
    </div>`;
}

function executeCombatAction(type) {
    if (isActionLocked) return;
    isActionLocked = true;
    document.getElementById('battleLog').innerHTML = `<div style="color:cyan;">Wahl getroffen: ${type.toUpperCase()}...</div>`;
    
    if (currentEnemy.isMonster) {
        data.battleAction = type;
        setTimeout(() => {
            currentEnemy.battleAction = (Math.random() > 0.3 ? 'attack' : 'heal');
            resolveBattleTurn();
        }, 1200);
    } else {
        db.ref(`battles/${activeBattleID}/actions/${myID}`).update({ type: type, ready: true });
    }
}

function resolvePvPTurn(battle) {
    isActionLocked = true;
    const log = document.getElementById('battleLog');
    const atk = battle.actions[battle.attackerID];
    const def = battle.actions[battle.defenderID];
    
    let myAction = (myID === battle.attackerID) ? atk : def;
    let oppAction = (myID === battle.attackerID) ? def : atk;
    
    let dmg = 20; let heal = 25;
    let logTxt = "";

    if (myAction.type === 'attack') { currentEnemy.hp -= dmg; logTxt += "Du greifst an! "; }
    else { data.hp = Math.min(data.maxHp, data.hp + heal); logTxt += "Du heilst dich! "; }

    if (oppAction.type === 'attack') { data.hp -= dmg; logTxt += "Gegner kontert! "; }
    else { currentEnemy.hp = Math.min(currentEnemy.maxHp, currentEnemy.hp + heal); logTxt += "Gegner regeneriert! "; }

    log.innerHTML = `<div style="color:gold;">${logTxt}</div>`;
    save();

    setTimeout(() => {
        if (data.hp <= 0 || currentEnemy.hp <= 0) {
            alert(data.hp <= 0 ? "Du wurdest besiegt!" : "Glorreicher Sieg!");
            endCombat();
        } else {
            if (myID === battle.attackerID) {
                db.ref(`battles/${activeBattleID}/actions/${battle.attackerID}`).update({ type: 'none', ready: false });
                db.ref(`battles/${activeBattleID}/actions/${battle.defenderID}`).update({ type: 'none', ready: false });
            }
            isActionLocked = false;
            renderCombatStage();
        }
    }, 3000);
}

function resolveBattleTurn() {
    const log = document.getElementById('battleLog');
    let myDmg = 15; let enDmg = 12; let heal = 25;
    if (data.battleAction === 'attack') currentEnemy.hp -= myDmg; else data.hp = Math.min(data.maxHp, data.hp + heal);
    if (currentEnemy.battleAction === 'attack') data.hp -= enDmg; else currentEnemy.hp = Math.min(currentEnemy.maxHp, currentEnemy.hp + heal);
    
    log.innerHTML = `Kampfrunde beendet!`;
    setTimeout(() => {
        if (currentEnemy.hp <= 0) { alert("Sieg!"); data.lxp += 50; endCombat(); }
        else if (data.hp <= 0) { data.hp = data.maxHp; alert("Gefallen!"); endCombat(); }
        else { isActionLocked = false; renderCombatStage(); }
    }, 2000);
}

function endCombat() {
    if (activeBattleID) {
        const bRef = db.ref('battles/' + activeBattleID);
        bRef.update({ status: 'finished' }).then(() => {
            setTimeout(() => { bRef.remove(); }, 500);
        });
    }
    activeBattleID = null;
    currentEnemy = null;
    isActionLocked = false;
    forceArenaSync = false;
    if(arenaFallbackTimer) clearTimeout(arenaFallbackTimer);
    toggleModal('gameModal', false);
    save();
}

function closeGeneralModal() {
    if (activeBattleID || currentEnemy) endCombat();
    else toggleModal('gameModal', false);
}

function handleWorldClick(e) { if(document.getElementById('gameModal').style.display === 'flex') return; const rect = document.getElementById('world').getBoundingClientRect(); data.x = e.clientX - rect.left; data.y = e.clientY - rect.top; save(); }
function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
function openBuilding(b) { toggleModal('gameModal', true); if (b === 'steinbruch') renderMiningMenu(); else if (b === 'wald') renderSmithy(); else if (b === 'arena') renderArenaMatchmaking(); else if (b === 'rathaus') renderEvoMenu(); }
function renderSmithy() { let html = `<div style="padding:30px;"><h2>Schmiede</h2>`; [{ name: "Spitzhacke", needs: { "Eisenerz": 3 } }, { name: "Schwert", needs: { "Eisenerz": 5 } }].forEach(recipe => { html += `<div style="border:1px solid gold; padding:10px; margin:5px; display:flex; justify-content:space-between;"><div><b>${recipe.name}</b></div><button class="btn-action" onclick="craftItem('${recipe.name}')">SCHMIEDEN</button></div>`; }); document.getElementById('modalLeft').innerHTML = html + `</div>`; }
function craftItem(name) { data.inventar[name] = (data.inventar[name] || 0) + 1; save(); renderSmithy(); }
function renderMiningMenu() { document.getElementById('modalLeft').innerHTML = `<div style="padding:30px;"><h2>Steinbruch</h2><button class="btn-action" onclick="startMining()">⛏️ Abbau</button><div id="mineLog"></div></div>`; }
function startMining() { if (typeof isMining !== 'undefined' && isMining) return; isMining = true; setTimeout(() => { let item = "Eisenerz"; data.inventar[item] = (data.inventar[item] || 0) + 1; data.lxp += 5; save(); document.getElementById('mineLog').innerText = `Gefunden: ${item}!`; isMining = false; }, 2000); }
function renderEvoMenu() { const evoNames = ['Ei', 'Schleim', 'Skelett', 'Goblin', 'Oger', 'Lich', 'Höheres Wesen']; let html = `<div class="evo-container"><h2>Halle der Evolution</h2><div class="evo-tree-grid">`; ['warrior', 'mage', 'ranger'].forEach(p => { html += `<div class="path-column">`; for(let i=1; i<=7; i++) html += `<div class="node" onclick="tryEvolve('${p}', ${i}, ${i*30})">${evoNames[i-1]}</div>`; html += `<b>${p.toUpperCase()}</b></div>`; }); document.getElementById('modalLeft').innerHTML = html + `</div></div>`; }
function tryEvolve(path, tier, days) { if(data.followDays < days && !isAdmin) return alert(`${days} Tage benötigt!`); data.stats[path] = tier; data.stats.totalEvoLevel++; save(); renderEvoMenu(); }
function openAdminPanel() { toggleModal('gameModal', true); document.getElementById('modalLeft').innerHTML = `<h2>🛠 GÖTTER-MENÜ</h2><button class="btn-action" onclick="data.followDays+=30;save()">+30 Tage</button><div style="margin-top:20px; background:rgba(0,0,0,0.5); padding:10px; border:1px solid red;"><h3>Schatten-Reinigung</h3><input type="text" id="purgeInput" placeholder="ID des Geister-Eis..." style="width:100%; background:#111; color:white; border:1px solid gold; padding:5px;"><button class="btn-action" style="width:100%; margin-top:5px; background:red;" onclick="purgeGhostEgg()">Geister-Ei löschen</button></div>`; }
function purgeGhostEgg() { const id = document.getElementById('purgeInput').value; if(id) db.ref('players/' + id).remove().then(() => alert("Geister-Ei eliminiert.")); }
function renderArenaMatchmaking() {
    const left = document.getElementById('modalLeft');
    const canFight = isAdmin || (isIdentified && data.isFollower);
    const lockAttr = !canFight ? 'disabled' : '';
    let html = `<div style="padding:20px;"><h2>🛡️ Arena</h2><p>${canFight?'✅ Kampfbereit':'❌ Gesperrt'}</p><button class="btn-action" style="width:100%;" ${lockAttr} onclick="startCombat(null, true)">🐗 Monster</button><div style="margin-top:20px;">`;
    Object.keys(onlinePlayers).forEach(id => {
        const p = onlinePlayers[id];
        const isActive = (Date.now() - (p.lastSeen || 0) < 60000);
        if (id !== myID && !p.hidden && isActive) {
            html += `<div style="padding:10px; border:1px solid gold; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center;">
                <span><strong>${p.name}</strong> (LVL ${p.stats?.totalEvoLevel || 0})</span>
                <button class="btn-action" ${lockAttr} onclick="challengePlayer('${id}', '${p.name}')">Fordern</button>
            </div>`;
        }
    });
    left.innerHTML = html + `</div></div>`;
}

window.onload = async () => {
    if (checkTwitchAuth()) {
        await initTwitchSession();
    } else {
        const params = new URLSearchParams(window.location.search);
        const userParam = params.get('user');
        if (userParam) return redirectToTwitch(userParam);
        else return alert("Fehler: Kein User");
    }
    if (myID) listenForChallenges();
    db.ref('players').on('value', snap => {
        onlinePlayers = snap.val() || {};
        renderPlayers(onlinePlayers);
        if(myID && onlinePlayers[myID]) {
            const pData = onlinePlayers[myID];
            data.lxp = pData.lxp || 0;
            data.stats = pData.stats || data.stats;
            data.inventar = pData.inventar || {};
            updateUI();
        }
    });
    if (myID) db.ref('players/' + myID).onDisconnect().remove();
    save(); 
    setInterval(save, 30000);
};
</script>
</body>
</html>
