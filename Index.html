<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawn2909 - System Interface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* DEIN BILD ALS HINTERGRUND */
            background-image: url('DEIN_BILD_LINK_HIER'); 
            background-size: cover;
            background-position: center;
        }

        #interface {
            width: 90%;
            max-width: 800px;
            padding: 40px;
            text-align: center;
            /* Falls du keinen Rahmen im Bild hast, kannst du hier einen nutzen */
        }

        .status-box {
            background: rgba(0, 20, 40, 0.7);
            border: 2px solid #00d4ff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 20px;
        }

        h1 { color: #00d4ff; text-transform: uppercase; letter-spacing: 5px; margin: 0; }
        .data { font-size: 1.5em; margin: 10px 0; }
        .evolution-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .rank { padding: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; font-size: 0.8em; }
        .unlocked { color: #00d4ff; border: 1px solid #00d4ff; }
        .locked { color: #555; }
    </style>
</head>
<body>

<div id="interface">
    <div class="status-box">
        <h1 id="welcome">WILLKOMMEN, REISENDER</h1>
        <div class="data">STATUS: <span id="rank-name">UNBEKANNT</span></div>
        <div class="data">LOYALITÄT: <span id="days">?</span> TAGE</div>
    </div>

    <div class="evolution-grid" id="grid">
        <div class="rank" id="r1">EI (0d)</div>
        <div class="rank" id="r2">SCHLEIM (60d)</div>
        <div class="rank" id="r3">SKELETT (90d)</div>
        <div class="rank" id="r4">GOBLIN (180d)</div>
        <div class="rank" id="r5">OGER (270d)</div>
        <div class="rank" id="r6">LICH (360d)</div>
        <div class="rank" id="r7">WESEN (720d)</div>
    </div>
</div>

<script>
    // Holt Daten aus der URL: ?user=NAME&days=ZAHL
    const urlParams = new URLSearchParams(window.location.search);
    const user = urlParams.get('user') || 'REISENDER';
    const days = parseInt(urlParams.get('days')) || 0;

    document.getElementById('welcome').innerText = "WILLKOMMEN, " + user.toUpperCase();
    document.getElementById('days').innerText = days;

    // Logik für die Evolutionsstufen
    let rank = "EI";
    if(days >= 720) { rank = "HÖHERES WESEN"; document.getElementById('r7').classList.add('unlocked'); }
    else if(days >= 360) { rank = "LICH"; document.getElementById('r6').classList.add('unlocked'); }
    else if(days >= 270) { rank = "OGER"; document.getElementById('r5').classList.add('unlocked'); }
    else if(days >= 180) { rank = "GOBLIN"; document.getElementById('r4').classList.add('unlocked'); }
    else if(days >= 90) { rank = "SKELETT"; document.getElementById('r3').classList.add('unlocked'); }
    else if(days >= 60) { rank = "SCHLEIM"; document.getElementById('r2').classList.add('unlocked'); }
    else { document.getElementById('r1').classList.add('unlocked'); }

    document.getElementById('rank-name').innerText = rank;
</script>

</body>
</html>
